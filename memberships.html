<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบสมาชิก • วินทร์ทรัพย์นาคราช</title>
  
  <script src="./config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at 50% 0%, #064e3b 0%, #021a14 42%, #010c09 100%);
      color: #fbfbee;
      min-height: 100vh;
      margin: 0;
    }
    .glossy-panel {
      background: linear-gradient(145deg, rgba(4, 41, 31, 0.88) 0%, rgba(2, 16, 12, 0.96) 100%);
      border: 1px solid rgba(254, 240, 138, 0.28);
      backdrop-filter: blur(16px);
    }
    .menu-card {
      background: linear-gradient(145deg, rgba(3, 33, 25, 0.85) 0%, rgba(1, 15, 11, 0.95) 100%);
      border: 1.2px solid rgba(254, 240, 138, 0.25);
      border-radius: 20px;
    }
  </style>
</head>
<body class="p-4 sm:p-6 max-w-md mx-auto flex flex-col pb-28">

  <div class="flex items-center justify-between py-3 mb-2">
    <div class="flex items-center gap-3">
      <div class="relative w-10 h-10 rounded-full p-0.5 bg-gradient-to-tr from-amber-400 via-emerald-500 to-amber-200 shadow-[0_0_12px_rgba(254,240,138,0.55)] flex-shrink-0">
        <div class="w-full h-full rounded-full bg-black/80 flex items-center justify-center overflow-hidden">
          <img src="./logo.png" alt="วินทร์ทรัพย์นาคราช" class="w-full h-full object-contain p-1">
        </div>
      </div>
      <div>
        <h2 class="text-xs font-bold tracking-widest uppercase text-amber-200">วินทร์ทรัพย์นาคราช</h2>
        <p class="text-[9px] text-emerald-300">ระบบจัดการบัญชีสมาชิก</p>
      </div>
    </div>
    <button onclick="window.location.href='./index.html'" class="text-[11px] text-slate-200 bg-black/60 border border-amber-300/30 px-3.5 py-1.5 rounded-full">
      Shop@หน้าร้าน ⟨
    </button>
  </div>

  <!-- บัตรสมาชิกดิจิทัล (ปรับเป็น ผู้ถือบัญชี / สมาชิกใหม่) -->
  <div class="glossy-panel rounded-3xl p-5 mb-5 relative overflow-hidden">
    <div class="flex justify-between items-start mb-4">
      <div>
        <span class="text-[10px] text-emerald-300 uppercase font-medium">รหัสประจำตัวสมาชิก</span>
        <div id="disp-member-code" class="text-lg font-extrabold text-amber-200">M-XXXX</div>
      </div>
      <span id="disp-privilege-tag" class="px-3 py-1 rounded-full text-[10px] font-bold bg-amber-500/20 border border-amber-400/50 text-amber-200">
        สิทธิ์ฟรี 30 วัน
      </span>
    </div>

    <div class="mb-4">
      <span class="text-[10px] text-slate-300 font-light">ผู้ถือบัญชี:</span>
      <h1 id="disp-user-name" class="text-xl font-bold text-white">สมาชิกใหม่</h1>
    </div>

    <div class="grid grid-cols-2 gap-3 pt-3 border-t border-amber-300/20">
      <div class="bg-black/40 rounded-xl p-2.5">
        <div class="text-[10px] text-emerald-300">ยอดเงินคงเหลือ</div>
        <div class="text-base font-extrabold text-amber-300 mt-0.5">
          <span id="disp-balance">0</span> บาท
        </div>
      </div>
      <div class="bg-black/40 rounded-xl p-2.5">
        <div class="text-[10px] text-amber-200">สิทธิ์เปิดไพ่ประจำวัน</div>
        <div id="disp-trial-status" class="text-xs font-bold text-emerald-300 mt-1">ฟรีอีก 30 วัน</div>
      </div>
    </div>
  </div>

  <!-- เมนูบริการต่างๆ -->
  <div class="grid grid-cols-2 gap-3 mb-5">
    <a href="./pickacard_hub.html" class="menu-card p-4 flex flex-col justify-between">
      <div>
        <div class="text-2xl mb-1">🔮</div>
        <h4 class="text-xs font-bold text-amber-200">เปิดไพ่นำทาง</h4>
        <p class="text-[10px] text-slate-300 mt-1">รับข้อคิดและกำลังใจประจำวัน</p>
      </div>
      <span class="text-[9px] text-emerald-400 mt-2 font-medium">เข้าสู่เรือนไพ่ →</span>
    </a>

    <a href="./booking.html" class="menu-card p-4 flex flex-col justify-between">
      <div>
        <div class="text-2xl mb-1">📅</div>
        <h4 class="text-xs font-bold text-emerald-300">นัดหมายพูดคุย</h4>
        <p class="text-[10px] text-slate-300 mt-1">ปรึกษาและพูดคุยแบบเป็นกันเอง</p>
      </div>
      <span class="text-[9px] text-emerald-400 mt-2 font-medium">จองรอบเวลา →</span>
    </a>
  </div>

  <script>
    const WEB_URL = typeof getMasterApiUrl === "function" ? getMasterApiUrl() : "https://script.google.com/macros/s/AKfycbwBK-NcHXTiaoVhJyBxB3fMVGFj9x8lSjvU1ECL6pzmjjIWLFqgN-94ny9niIjtow9B/exec";

    window.onload = function() {
      fetch(`${WEB_URL}?action=login_or_register&userId=guest_user`)
        .then(r => r.json())
        .then(res => {
          if (res.status === "success") {
            document.getElementById("disp-member-code").innerText = res.memberCode;
            document.getElementById("disp-user-name").innerText = res.name;
            document.getElementById("disp-balance").innerText = res.balance.toLocaleString();
            document.getElementById("disp-trial-status").innerText = res.freeTrialDaysLeft > 0 ? `ฟรีอีก ${res.freeTrialDaysLeft} วัน` : "หมดช่วงทดลองใช้ฟรี";
          }
        });
    };
  </script>
</body>
</html>
