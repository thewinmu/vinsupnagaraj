<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบจองคิวดูดวง • วินทร์ทรัพย์นาคราช</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at top, #022c22 0%, #031410 50%, #000000 100%);
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
    }
    .gold-cream-text {
      background: linear-gradient(135deg, #fef08a 0%, #fde047 40%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card-emerald-pearl {
      background: rgba(4, 47, 46, 0.55);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .btn-gold-cream {
      background: linear-gradient(135deg, #fef08a 0%, #d4af37 100%);
      color: #031410;
      font-weight: 800;
      border-radius: 9999px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      transition: all 0.2s ease;
    }
    .btn-gold-cream:active { transform: scale(0.96); }
    .text-pearl { color: #f1f5f9; }
    .text-pearl-muted { color: #cbd5e1; }
  </style>
</head>
<body class="p-5 max-w-md mx-auto flex flex-col pb-12">

  <!-- Header -->
  <div class="flex items-center justify-between py-4 mb-2">
    <button onclick="window.location.href='./index.html'" class="text-xs font-semibold text-amber-200 px-3.5 py-1.5 rounded-full border border-amber-400/30 bg-emerald-950/40 hover:bg-emerald-900/50 transition">⟨ กลับหน้าร้าน</button>
    <div class="text-sm text-amber-300 font-bold tracking-wider">วินทร์ทรัพย์นาคราช</div>
  </div>

  <div class="text-center mb-6">
    <h1 class="text-2xl font-extrabold gold-cream-text tracking-wide">จองคิวดูดวงมงคล</h1>
    <p class="text-xs text-pearl-muted mt-1">เลือกแพ็กเกจและช่วงเวลาเพื่อรับคำพยากรณ์</p>
  </div>

  <!-- กล่องประกาศสถานะจาก Admin (ถ้าปิดรับจอง) -->
  <div id="admin-notice" class="hidden mb-6 p-4 rounded-2xl bg-amber-950/90 border border-amber-500/60 text-center text-xs text-amber-200 leading-relaxed shadow-xl">
    ⚠️ <span id="notice-text">ขณะนี้ปิดรับจองคิวชั่วคราว</span>
  </div>

  <!-- รายการแพ็กเกจดูดวง -->
  <div id="service-list" class="space-y-4">
    <div class="text-center py-10 text-amber-300 animate-pulse text-xs">กำลังโหลดแพ็กเกจมงคล...</div>
  </div>

  <!-- ปุ่มเพิ่มเติมสำหรับหน้าสมาชิก: ดูรายการจองทั้งหมด -->
  <div class="mt-6 pt-4 border-t border-emerald-900/50">
    <button onclick="alert('แสดงรายการจองทั้งหมดของคุณผ่านระบบ LIFF')" class="btn-gold-cream w-full py-3 text-xs tracking-wide shadow-lg">
      📅 จองคิวดูดวง วินทร์ทรัพย์นาคราช (แสดงรายการจองทั้งหมด)
    </button>
  </div>

  <!-- Modal เลือกเวลาจอง -->
  <div id="booking-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="card-emerald-pearl p-6 w-full max-w-sm space-y-4 bg-emerald-950/95 border border-amber-400/50 shadow-2xl">
      <div class="flex justify-between items-center border-b border-amber-400/20 pb-3">
        <h3 class="text-sm font-bold gold-cream-text" id="modal-service-title">เลือกช่วงเวลานัดหมาย</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-base px-2">✕</button>
      </div>
      
      <div class="space-y-2 text-xs">
        <label class="block text-pearl font-medium">รอบเวลา (สถานะ ว่าง / เต็ม):</label>
        <div id="slot-container" class="space-y-2 max-h-52 overflow-y-auto pr-1">
          <div class="text-gray-400 text-center py-4">กำลังตรวจสอบรอบเวลา...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WEB_URL = "https://script.google.com/macros/s/AKfycbxXRJyClfhGCLyG3plwkuCBzbwsIQdPiy0X11f3EbCvL2Dj-y2sCenNFiqjMdKNoqhf/exec";
    const LIFF_ID = "2007499712-B0uid9G3";
    let selectedService = "";
    let isBookingOpen = true;
    let currentUserId = "guest_user";

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof liff !== 'undefined' && LIFF_ID) {
        liff.init({ liffId: LIFF_ID })
          .then(() => {
            if (liff.isLoggedIn()) {
              liff.getProfile().then(p => { currentUserId = p.userId; }).catch(() => {});
            }
          })
          .catch(err => console.error("LIFF Init Error:", err));
      }
      checkBookingStatusAndLoad();
    });

    function checkBookingStatusAndLoad() {
      fetch(`${WEB_URL}?action=get_booking_status`)
        .then(r => r.json())
        .then(res => {
          if (res && res.status === "success") {
            if (res.bookingStatus === "closed") {
              isBookingOpen = false;
              document.getElementById('notice-text').innerText = res.message || "ขณะนี้ปิดรับจองคิวชั่วคราว";
              document.getElementById('admin-notice').classList.remove('hidden');
            }
          }
          loadServices();
        })
        .catch(() => loadServices());
    }

    function loadServices() {
      fetch(`${WEB_URL}?action=get_booking_services`)
        .then(r => r.json())
        .then(res => {
          const container = document.getElementById('service-list');
          container.innerHTML = "";
          
          if(res && res.items && res.items.length > 0) {
            res.items.forEach(item => {
              const btnStyle = isBookingOpen ? "btn-gold-cream cursor-pointer" : "bg-gray-800 text-gray-500 cursor-not-allowed opacity-50";
              const btnAction = isBookingOpen ? `onclick="openBookingModal('${item.name}')"` : "";
              
              container.innerHTML += `
                <div class="card-emerald-pearl p-4 flex flex-col gap-3">
                  <div>
                    <div class="text-base font-bold text-pearl">${item.name}</div>
                    <div class="text-xs text-pearl-muted mt-1 leading-relaxed">${item.desc}</div>
                    <div class="text-sm font-extrabold gold-cream-text mt-2">${item.price > 0 ? item.price.toLocaleString() + ' บาท' : 'บูชาฟรี'}</div>
                  </div>
                  <button ${btnAction} class="${btnStyle} w-full py-2.5 text-xs tracking-wide flex items-center justify-center gap-1 shadow-md">
                    ${isBookingOpen ? '🔮 เลือกจองเวลานี้' : '🔒 ปิดรับจองชั่วคราว'}
                  </button>
                </div>
              `;
            });
          } else {
            container.innerHTML = `<div class="text-center text-xs text-gray-400 py-10">ไม่พบแพ็กเกจดูดวงในขณะนี้</div>`;
          }
        })
        .catch(() => {
          document.getElementById('service-list').innerHTML = `<div class="text-center text-xs text-red-300 py-10">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</div>`;
        });
    }

    function openBookingModal(serviceName) {
      if (!isBookingOpen) return;
      selectedService = serviceName;
      document.getElementById('modal-service-title').innerText = `จองคิว: ${serviceName}`;
      document.getElementById('booking-modal').classList.remove('hidden');
      loadTimeSlots();
    }

    function closeModal() {
      document.getElementById('booking-modal').classList.add('hidden');
    }

    function loadTimeSlots() {
      const container = document.getElementById('slot-container');
      container.innerHTML = `<div class="text-gray-300 text-center py-3 text-xs">กำลังตรวจสอบรอบเวลา...</div>`;

      fetch(`${WEB_URL}?action=get_time_slots`)
        .then(r => r.json())
        .then(res => {
          container.innerHTML = "";
          const slots = (res && res.slots) ? res.slots : [];

          if(slots.length === 0) {
            container.innerHTML = `<div class="text-gray-400 text-center py-3 text-xs">ไม่พบรอบเวลาเปิดบริการ</div>`;
            return;
          }

          slots.forEach(slot => {
            const isOpen = slot.status.toLowerCase() === "open";
            
            if (isOpen) {
              container.innerHTML += `
                <div class="p-3 rounded-xl bg-emerald-950/40 border border-emerald-500/30 flex items-center justify-between">
                  <div>
                    <div class="text-pearl font-bold text-xs">⏰ ${slot.time}</div>
                    <span class="inline-flex items-center gap-1 text-[10px] text-emerald-300 bg-emerald-900/60 px-2 py-0.5 rounded-full border border-emerald-500/40 mt-1">
                      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> ว่าง
                    </span>
                  </div>
                  <button onclick="confirmSlot('${slot.time}')" class="btn-gold-cream px-3 py-1.5 text-xs shadow">จอง</button>
                </div>
              `;
            } else {
              container.innerHTML += `
                <div class="p-3 rounded-xl bg-black/50 border border-red-500/20 flex items-center justify-between opacity-70">
                  <div>
                    <div class="text-gray-400 font-bold text-xs">⏰ ${slot.time}</div>
                    <span class="inline-flex items-center gap-1 text-[10px] text-red-400 bg-red-950 px-2 py-0.5 rounded-full border border-red-500/30 mt-1">
                      <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span> เต็มแล้ว
                    </span>
                  </div>
                  <button disabled class="bg-gray-800 text-gray-500 px-3 py-1.5 text-xs rounded-full cursor-not-allowed">เต็ม</button>
                </div>
              `;
            }
          });
        })
        .catch(() => {
          container.innerHTML = `<div class="text-red-300 text-center py-3 text-xs">โหลดรอบเวลาไม่สำเร็จ</div>`;
        });
    }

    function confirmSlot(slotTime) {
      if (confirm(`ยืนยันการจองแพ็กเกจ "${selectedService}" รอบเวลา ${slotTime} ใช่หรือไม่?`)) {
        fetch(`${WEB_URL}?action=submit_booking&userId=${encodeURIComponent(currentUserId)}&serviceName=${encodeURIComponent(selectedService)}&slotTime=${encodeURIComponent(slotTime)}`)
          .then(r => r.json())
          .then(res => {
            alert(`✨ ทำการจองคิวสำเร็จ! ระบบบันทึกข้อมูลเรียบร้อยแล้ว กรุณากลับไปที่แชท LINE เพื่อชำระเงินครับ`);
            closeModal();
          })
          .catch(() => {
            alert(`✨ บันทึกการจองเรียบร้อยแล้ว`);
            closeModal();
          });
      }
    }
  </script>
</body>
</html>
