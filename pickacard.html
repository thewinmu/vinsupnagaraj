<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สาส์นนำทาง Pick-A-Card - SHOP@วินทร์ทรัพย์นาคราช</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
          colors: {
            pearl: '#F2F7F4',
            emeraldDeep: '#0B4734',
            emeraldDark: '#083828',
            nagaGold: '#D97706',
            goldBright: '#FBBF24',
            goldBorder: '#E6CA65',
            obsidian: '#121714'
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at top, #FBFDFB 0%, #EBF4F0 100%);
      color: #121714;
    }
    .glass-pearl {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(230, 202, 101, 0.45);
    }
    .card-hover:active {
      transform: translateY(-8px) scale(1.02);
    }
  </style>
</head>
<body class="min-h-screen pb-24 p-4">

  <main class="max-w-md mx-auto space-y-4">
    <!-- Header -->
    <div class="glass-pearl rounded-3xl p-4 shadow-sm border border-goldBorder/40 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-obsidian via-emeraldDark to-emeraldDeep p-0.5 border border-goldBorder flex items-center justify-center">
          <span class="text-xl">🔮</span>
        </div>
        <div>
          <h1 class="text-xs font-black tracking-wider text-nagaGold uppercase leading-none">
            สาส์นนำทางออราเคิลนาคราช
          </h1>
          <p class="text-[10px] font-bold text-emeraldDark mt-0.5">Pick-A-Card สายญาณบารมี</p>
        </div>
      </div>
      <a href="index.html" class="text-xs font-bold text-stone-500 bg-stone-100 px-3 py-1.5 rounded-xl hover:bg-stone-200 transition">
        หน้าร้าน
      </a>
    </div>

    <!-- Category Tabs -->
    <div class="flex items-center space-x-2 overflow-x-auto hide-scrollbar py-1">
      <button onclick="switchCategory('daily', this)" class="cat-tab px-4 py-1.5 rounded-full bg-emeraldDeep text-white text-xs font-black border border-goldBright shadow-sm flex-shrink-0">
        สาส์นประจำวัน
      </button>
      <button onclick="switchCategory('job', this)" class="cat-tab px-4 py-1.5 rounded-full bg-white text-emeraldDeep text-xs font-bold border border-goldBorder/50 flex-shrink-0">
        การงาน & กิจการ
      </button>
      <button onclick="switchCategory('money', this)" class="cat-tab px-4 py-1.5 rounded-full bg-white text-emeraldDeep text-xs font-bold border border-goldBorder/50 flex-shrink-0">
        โชคลาภ & การเงิน
      </button>
      <button onclick="switchCategory('love', this)" class="cat-tab px-4 py-1.5 rounded-full bg-white text-emeraldDeep text-xs font-bold border border-goldBorder/50 flex-shrink-0">
        ความรัก & เมตตา
      </button>
    </div>

    <!-- Instructions -->
    <div class="text-center py-2">
      <p class="text-xs font-black text-obsidian">ตั้งจิตอธิษฐานนึกถึงองค์พญานาคาธิบดี</p>
      <p class="text-[10px] font-bold text-nagaGold mt-0.5">แล้วเลือกไพ่ 1 ใบ ที่ดึงดูดจิตใจของท่านมากที่สุด</p>
    </div>

    <!-- 3 Oracle Cards Selection Grid -->
    <div id="cards-container" class="grid grid-cols-3 gap-3 pt-2">
      <!-- Card 1 -->
      <div onclick="revealCard(0)" class="card-hover cursor-pointer rounded-2xl overflow-hidden border-2 border-goldBorder shadow-lg bg-gradient-to-b from-obsidian to-emeraldDark aspect-[2/3] flex flex-col items-center justify-center p-2 text-center transition-all duration-300">
        <div class="w-9 h-9 rounded-full bg-goldBright/20 border border-goldBorder flex items-center justify-center mb-1">
          <span class="text-base">🐍</span>
        </div>
        <span class="text-[10px] font-black text-goldBright">ใบที่ ๑</span>
      </div>
      <!-- Card 2 -->
      <div onclick="revealCard(1)" class="card-hover cursor-pointer rounded-2xl overflow-hidden border-2 border-goldBorder shadow-lg bg-gradient-to-b from-obsidian to-emeraldDark aspect-[2/3] flex flex-col items-center justify-center p-2 text-center transition-all duration-300">
        <div class="w-9 h-9 rounded-full bg-goldBright/20 border border-goldBorder flex items-center justify-center mb-1">
          <span class="text-base">🐍</span>
        </div>
        <span class="text-[10px] font-black text-goldBright">ใบที่ ๒</span>
      </div>
      <!-- Card 3 -->
      <div onclick="revealCard(2)" class="card-hover cursor-pointer rounded-2xl overflow-hidden border-2 border-goldBorder shadow-lg bg-gradient-to-b from-obsidian to-emeraldDark aspect-[2/3] flex flex-col items-center justify-center p-2 text-center transition-all duration-300">
        <div class="w-9 h-9 rounded-full bg-goldBright/20 border border-goldBorder flex items-center justify-center mb-1">
          <span class="text-base">🐍</span>
        </div>
        <span class="text-[10px] font-black text-goldBright">ใบที่ ๓</span>
      </div>
    </div>

    <!-- Revealed Card Sheet Modal -->
    <div id="result-modal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-md hidden flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl border-2 border-goldBorder p-5 space-y-4">
        <div class="text-center space-y-1">
          <span class="text-2xl">🐍</span>
          <h3 id="res-card-name" class="text-base font-black text-obsidian">ชื่อไพ่นาคราช</h3>
          <p id="res-card-cat" class="text-[10px] font-bold text-nagaGold uppercase">สาส์นนำทางชีวิต</p>
        </div>

        <div class="w-full aspect-[4/3] rounded-2xl overflow-hidden bg-stone-100 border border-goldBorder">
          <img id="res-card-img" src="" class="w-full h-full object-cover" alt="Card Image">
        </div>

        <div class="bg-pearl p-3.5 rounded-2xl border border-goldBorder/40 space-y-2">
          <p class="text-[11px] font-bold text-stone-700 leading-relaxed" id="res-card-meaning">ความหมายคำพยากรณ์</p>
          <div class="pt-2 border-t border-stone-200">
            <p class="text-[10px] font-black text-emeraldDeep">แนวทางปฏิบัติเสริมดวง:</p>
            <p class="text-[10px] text-stone-600 font-medium" id="res-card-advice">หมั่นรักษาศีล เจริญภาวนา แผ่เมตตาจิต</p>
          </div>
        </div>

        <button onclick="closeResultModal()" class="w-full bg-gradient-to-r from-obsidian via-emeraldDark to-emeraldDeep text-white font-black text-xs py-3 rounded-2xl border border-goldBright">
          น้อมรับสาส์นนำทางบารมี 🙏
        </button>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzhqzmw9LkSheJD2AQTreWQY2w1Wqh0okxRMXhRelayFqHetwQCPmc877YJCPnd6P6w/exec";
    let currentCategory = "daily";
    let categoryCards = [];

    window.addEventListener("DOMContentLoaded", () => {
      fetchCards(currentCategory);
    });

    async function switchCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll(".cat-tab").forEach(b => {
        b.classList.remove("bg-emeraldDeep", "text-white", "font-black");
        b.classList.add("bg-white", "text-emeraldDeep", "font-bold");
      });
      btn.classList.add("bg-emeraldDeep", "text-white", "font-black");
      btn.classList.remove("bg-white", "text-emeraldDeep", "font-bold");
      fetchCards(cat);
    }

    async function fetchCards(cat) {
      try {
        const res = await fetch(`${API_URL}?action=get_cards&category=${encodeURIComponent(cat)}`);
        const data = await res.json();
        if (data.status === "success" && data.cards) {
          categoryCards = data.cards;
        }
      } catch (e) {}
    }

    function revealCard(idx) {
      if (categoryCards.length === 0) {
        alert("กำลังจัดเตรียมสาส์นนำทาง กรุณาลองใหม่อีกครั้งครับ");
        return;
      }
      // สุ่มหรือเลือกไพ่
      const card = categoryCards[idx % categoryCards.length];
      document.getElementById("res-card-name").innerText = card.name;
      document.getElementById("res-card-cat").innerText = `หมวด: ${card.category || currentCategory}`;
      document.getElementById("res-card-meaning").innerText = card.meaning || "ตั้งมั่นอยู่ในความดี มีสติในการตัดสินใจ แล้วทุกสิ่งจะราบรื่น";
      document.getElementById("res-card-advice").innerText = card.advice || "หมั่นรักษาศีล เจริญภาวนา แผ่เมตตาจิต";

      const imgEl = document.getElementById("res-card-img");
      if (card.imageUrl) {
        imgEl.src = card.imageUrl.startsWith("http") ? card.imageUrl : `https://drive.google.com/thumbnail?id=${card.imageUrl}&sz=w600`;
      } else {
        imgEl.src = "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&q=80";
      }

      document.getElementById("result-modal").classList.remove("hidden");
    }

    function closeResultModal() {
      document.getElementById("result-modal").classList.add("hidden");
    }
  </script>
</body>
</html>
