<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>จองคิวตรวจดวงชะตา - SHOP@วินทร์ทรัพย์นาคราช</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
          colors: {
            pearl: '#F2F7F4',
            emeraldDeep: '#0B4734',
            emeraldDark: '#083828',
            nagaGold: '#D97706',
            goldBright: '#FBBF24',
            goldBorder: '#E6CA65',
            obsidian: '#121714'
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at top, #FBFDFB 0%, #EBF4F0 100%);
      color: #121714;
    }
    .glass-pearl {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(230, 202, 101, 0.45);
    }
  </style>
</head>
<body class="min-h-screen pb-24 p-4">

  <main class="max-w-md mx-auto space-y-4">
    <!-- Header Card -->
    <div class="glass-pearl rounded-3xl p-4 shadow-sm border border-goldBorder/40 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-obsidian via-emeraldDark to-emeraldDeep p-0.5 border border-goldBorder flex items-center justify-center">
          <span class="text-xl">🐍</span>
        </div>
        <div>
          <h1 class="text-xs font-black tracking-wider text-nagaGold uppercase leading-none">
            จองคิวตรวจดวงชะตาสายญาณ
          </h1>
          <p class="text-[10px] font-bold text-emeraldDark mt-0.5">SHOP@วินทร์ทรัพย์นาคราช</p>
        </div>
      </div>
      <a href="index.html" class="text-xs font-bold text-stone-500 bg-stone-100 px-3 py-1.5 rounded-xl hover:bg-stone-200 transition">
        หน้าร้าน
      </a>
    </div>

    <!-- Step 1: เลือกรายการบริการ (ดึงจากชีต products อัตโนมัติ) -->
    <div class="glass-pearl rounded-3xl p-4 shadow-sm border border-goldBorder/40 space-y-2.5">
      <h2 class="text-xs font-black text-obsidian uppercase flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-goldBright"></span>
        1. เลือกแพ็กเกจตรวจดวงชะตา
      </h2>
      <div id="service-list" class="space-y-2">
        <div class="p-4 text-center text-xs text-stone-400 font-bold animate-pulse">กำลังอัญเชิญรายการบริการ...</div>
      </div>
    </div>

    <!-- Step 2: เลือกวันที่และเวลาสนทนา -->
    <div class="glass-pearl rounded-3xl p-4 shadow-sm border border-goldBorder/40 space-y-3">
      <h2 class="text-xs font-black text-obsidian uppercase flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-goldBright"></span>
        2. เลือกวันและรอบเวลาสนทนา
      </h2>
      
      <div>
        <label class="text-[11px] font-bold text-stone-600 block mb-1">วันที่ต้องการรับคำพยากรณ์ *</label>
        <input type="date" id="booking-date" onchange="loadTimeSlots()" class="w-full text-xs font-bold px-3.5 py-2.5 rounded-2xl border border-stone-300 focus:outline-none focus:border-goldBright bg-white">
      </div>

      <div>
        <label class="text-[11px] font-bold text-stone-600 block mb-1.5">รอบเวลาสนทนาญาณ *</label>
        <div id="time-slots" class="grid grid-cols-2 gap-2">
          <div class="col-span-2 text-center py-4 text-xs text-stone-400 font-bold">
            กรุณาเลือกวันที่ก่อนครับ
          </div>
        </div>
      </div>
    </div>

    <!-- Action Button -->
    <button id="btn-submit-booking" onclick="submitBooking()" class="w-full bg-gradient-to-r from-obsidian via-emeraldDark to-emeraldDeep text-white font-black text-xs py-4 rounded-2xl shadow-lg border border-goldBright hover:brightness-110 active:scale-95 transition flex items-center justify-center space-x-2">
      <span>✨ ยืนยันการจองคิว & รับใบนัดหมายใน LINE</span>
    </button>
  </main>

  <script>
    const LIFF_ID = "2007499712-3e6TMnJJ";
    const API_URL = "https://script.google.com/macros/s/AKfycbzhqzmw9LkSheJD2AQTreWQY2w1Wqh0okxRMXhRelayFqHetwQCPmc877YJCPnd6P6w/exec";

    let currentUserId = "GUEST_USER";
    let selectedService = null;
    let selectedSlot = "";

    window.addEventListener("DOMContentLoaded", async () => {
      // ตั้งค่าวันที่เริ่มต้นเป็นวันพรุ่งนี้
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const dateStr = tomorrow.toISOString().split('T')[0];
      const dateInput = document.getElementById("booking-date");
      dateInput.value = dateStr;
      dateInput.min = new Date().toISOString().split('T')[0];

      try {
        if (typeof liff !== "undefined") {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            currentUserId = profile.userId;
          }
        }
      } catch (err) {}

      loadServices();
      loadTimeSlots();
    });

    async function loadServices() {
      try {
        const res = await fetch(`${API_URL}?action=get_call_services`);
        const data = await res.json();
        const container = document.getElementById("service-list");

        if (data.status === "success" && data.services && data.services.length > 0) {
          container.innerHTML = data.services.map((s, idx) => `
            <div onclick="selectServiceItem('${s.id}', '${s.name}', ${s.price}, this)" class="service-card p-3 rounded-2xl border ${idx === 0 ? 'border-nagaGold bg-amber-50/50' : 'border-stone-200 bg-white'} cursor-pointer hover:border-goldBorder transition flex items-center justify-between shadow-sm">
              <div>
                <p class="text-xs font-black text-obsidian">${s.name}</p>
                <p class="text-[10px] text-stone-500 font-medium">${s.desc || 'ตรวจดวงชะตาสายญาณ'}</p>
              </div>
              <span class="text-xs font-black text-nagaGold">฿${Number(s.price).toLocaleString()}</span>
            </div>
          `).join("");

          // เลือกตัวแรกเป็น Default
          selectedService = data.services[0];
        } else {
          container.innerHTML = `<div class="p-3 text-center text-xs text-stone-400 font-bold">ไม่พบรายการบริการดูดวง</div>`;
        }
      } catch (e) {
        document.getElementById("service-list").innerHTML = `<div class="p-3 text-center text-xs text-red-500">สายสัญญาณขัดข้อง</div>`;
      }
    }

    function selectServiceItem(id, name, price, el) {
      selectedService = { id: id, name: name, price: price };
      document.querySelectorAll(".service-card").forEach(c => {
        c.classList.remove("border-nagaGold", "bg-amber-50/50");
        c.classList.add("border-stone-200", "bg-white");
      });
      el.classList.add("border-nagaGold", "bg-amber-50/50");
      el.classList.remove("border-stone-200", "bg-white");
    }

    async function loadTimeSlots() {
      const targetDate = document.getElementById("booking-date").value;
      if (!targetDate) return;

      const container = document.getElementById("time-slots");
      container.innerHTML = `<div class="col-span-2 text-center py-3 text-xs text-stone-400 font-bold animate-pulse">กำลังตรวจสอบรอบเวลาว่าง...</div>`;

      try {
        const dParts = targetDate.split("-");
        const formattedDate = `${dParts[2]}/${dParts[1]}/${dParts[0]}`;

        const res = await fetch(`${API_URL}?action=get_time_slots&date=${encodeURIComponent(formattedDate)}`);
        const data = await res.json();

        if (data.status === "success" && data.slots) {
          container.innerHTML = data.slots.map(s => `
            <button type="button" onclick="selectSlotTime('${s.time}', this)" ${!s.available ? 'disabled' : ''} class="slot-btn py-2 px-3 rounded-xl text-xs font-bold border ${s.available ? 'border-stone-200 bg-white text-stone-700 hover:border-goldBorder' : 'border-stone-200 bg-stone-100 text-stone-400 cursor-not-allowed'} transition">
              ${s.time} ${!s.available ? '(เต็ม)' : ''}
            </button>
          `).join("");
        }
      } catch (e) {
        container.innerHTML = `<div class="col-span-2 text-center text-xs text-red-500">ไม่สามารถโหลดรอบเวลาได้</div>`;
      }
    }

    function selectSlotTime(slotTime, btn) {
      selectedSlot = slotTime;
      document.querySelectorAll(".slot-btn").forEach(b => {
        b.classList.remove("border-nagaGold", "bg-emeraldDeep", "text-white");
        b.classList.add("bg-white", "text-stone-700");
      });
      btn.classList.add("border-nagaGold", "bg-emeraldDeep", "text-white");
      btn.classList.remove("bg-white", "text-stone-700");
    }

    async function submitBooking() {
      if (!selectedService) {
        alert("กรุณาเลือกแพ็กเกจดูดวงครับ");
        return;
      }
      if (!selectedSlot) {
        alert("กรุณาเลือกรอบเวลาสนทนาครับ");
        return;
      }

      const targetDate = document.getElementById("booking-date").value;
      const dParts = targetDate.split("-");
      const formattedDate = `${dParts[2]}/${dParts[1]}/${dParts[0]}`;

      const btn = document.getElementById("btn-submit-booking");
      btn.disabled = true;
      btn.innerText = "กำลังจารึกนัดหมายมงคล...";

      let uid = currentUserId;
      try {
        if (typeof liff !== "undefined" && liff.isLoggedIn()) {
          const prof = await liff.getProfile();
          uid = prof.userId;
        }
      } catch (e) {}

      const payload = {
        action: "submit_fast_booking",
        userId: uid || "GUEST_USER",
        serviceName: selectedService.name,
        price: selectedService.price,
        bookingDate: formattedDate,
        slotTime: selectedSlot
      };

      try {
        const query = new URLSearchParams(payload).toString();
        const res = await fetch(`${API_URL}?${query}`);
        const result = await res.json();

        if (result.status === "success") {
          if (typeof liff !== "undefined" && liff.isInClient() && result.flexBubble) {
            try {
              await liff.sendMessages([{
                type: "flex",
                altText: `ใบนัดหมายตรวจดวงชะตา [${result.bookingId}] กรุณาแนบสลิปภายใน 15 นาที`,
                contents: result.flexBubble
              }]);
            } catch (err) {}
          }

          setTimeout(() => {
            if (typeof liff !== "undefined" && liff.isInClient()) {
              liff.closeWindow();
            } else {
              alert("✅ บันทึกนัดหมายสำเร็จ! ระบบได้ส่งใบนัดหมายไปยังแชท LINE แล้ว กรุณาแนบสลิปภายใน 15 นาทีครับ");
            }
          }, 300);

        } else {
          alert("แจ้งเตือน: " + (result.message || "ไม่สามารถจองคิวได้"));
          btn.disabled = false;
          btn.innerText = "✨ ยืนยันการจองคิว & รับใบนัดหมายใน LINE";
        }
      } catch (err) {
        alert("สายสัญญาณขัดข้อง กรุณาลองใหม่อีกครั้ง");
        btn.disabled = false;
        btn.innerText = "✨ ยืนยันการจองคิว & รับใบนัดหมายใน LINE";
      }
    }
  </script>
</body>
</html>
