<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบจองคิวดูดวง • วินทร์ทรัพย์นาคราช</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      /* ธีมสว่าง: พื้นหลังไล่ระดับสีขาวนวลและทองอ่อน */
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%);
      color: #0f172a;
      min-height: 100vh;
      margin: 0;
    }
    /* ข้อความสีทองหรูหราบนพื้นสว่าง */
    .gold-dark-text {
      background: linear-gradient(135deg, #854d0e 0%, #a16207 50%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* การ์ดสไตล์เขียวมรกตพรีเมียมบนพื้นสว่าง ขอบทอง */
    .card-light-emerald {
      background: #ffffff;
      border: 1px solid rgba(202, 138, 4, 0.3);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
    }
    /* ปุ่มพรีเมียมเขียวมรกตตัดทองหรูหรา */
    .btn-emerald-gold {
      background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
      color: #fef08a;
      font-weight: 700;
      border-radius: 9999px;
      box-shadow: 0 4px 15px rgba(2, 44, 34, 0.25);
      transition: all 0.2s ease;
    }
    .btn-emerald-gold:active { transform: scale(0.96); }
    
    .text-dark-main { color: #0f172a; }
    .text-dark-muted { color: #475569; }
  </style>
</head>
<body class="p-5 max-w-md mx-auto flex flex-col pb-12">

  <!-- Header -->
  <div class="flex items-center justify-between py-4 mb-2">
    <button onclick="window.location.href='./index.html'" class="text-xs font-semibold text-emerald-900 px-4 py-2 rounded-full border border-emerald-900/20 bg-white hover:bg-emerald-50 transition shadow-sm">⟨ กลับหน้าร้าน</button>
    <div class="text-sm text-emerald-950 font-bold tracking-wider">วินทร์ทรัพย์นาคราช</div>
  </div>

  <div class="text-center mb-6">
    <h1 class="text-2xl font-extrabold gold-dark-text tracking-wide">ยืนยันการจองคิวดูดวง</h1>
    <p class="text-xs text-dark-muted mt-1" id="subtitle-mode">เลือกช่วงเวลาเพื่อรับคำพยากรณ์</p>
  </div>

  <!-- กล่องประกาศสถานะจาก Admin -->
  <div id="admin-notice" class="hidden mb-6 p-4 rounded-2xl bg-amber-50 border border-amber-300 text-center text-xs text-amber-900 leading-relaxed shadow-sm">
    ⚠️ <span id="notice-text">ขณะนี้ปิดรับจองคิวชั่วคราว</span>
  </div>

  <!-- แสดงแพ็กเกจที่เลือก -->
  <div id="service-list" class="space-y-4">
    <div class="text-center py-10 text-dark-muted animate-pulse text-xs">กำลังโหลดแพ็กเกจที่ท่านเลือก...</div>
  </div>

  <!-- Modal เลือกเวลาจอง (2 คอลัมน์) -->
  <div id="booking-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white p-6 w-full max-w-md space-y-4 rounded-3xl border border-amber-500/30 shadow-2xl">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <h3 class="text-sm font-bold text-emerald-950" id="modal-service-title">เลือกช่วงเวลานัดหมาย</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 text-base px-2">✕</button>
      </div>
      
      <div class="space-y-2 text-xs">
        <label class="block text-dark-muted font-medium mb-2">รอบเวลาบริการ (สถานะ ว่าง / เต็ม):</label>
        <div id="slot-container" class="grid grid-cols-2 gap-2.5 max-h-64 overflow-y-auto pr-1">
          <div class="text-gray-400 text-center py-4 col-span-2">กำลังตรวจสอบรอบเวลา...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WEB_URL = "https://script.google.com/macros/s/AKfycbxXRJyClfhGCLyG3plwkuCBzbwsIQdPiy0X11f3EbCvL2Dj-y2sCenNFiqjMdKNoqhf/exec";
    const LIFF_ID = "2007499712-B0uid9G3";
    let selectedService = "";
    let isBookingOpen = true;
    let currentUserId = "guest_user";
    let targetServiceFromURL = "";

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      targetServiceFromURL = urlParams.get('service') ? decodeURIComponent(urlParams.get('service')).trim() : "";

      if (typeof liff !== 'undefined' && LIFF_ID) {
        liff.init({ liffId: LIFF_ID })
          .then(() => {
            if (liff.isLoggedIn()) {
              liff.getProfile().then(p => { currentUserId = p.userId; }).catch(() => {});
            }
          })
          .catch(err => console.error("LIFF Init Error:", err));
      }
      checkBookingStatusAndLoad();
    });

    function checkBookingStatusAndLoad() {
      fetch(`${WEB_URL}?action=get_booking_status`)
        .then(r => r.json())
        .then(res => {
          if (res && res.status === "success") {
            if (res.bookingStatus === "closed") {
              isBookingOpen = false;
              document.getElementById('notice-text').innerText = res.message || "ขณะนี้ปิดรับจองคิวชั่วคราว";
              document.getElementById('admin-notice').classList.remove('hidden');
            }
          }
          loadServices();
        })
        .catch(() => loadServices());
    }

    function loadServices() {
      fetch(`${WEB_URL}?action=get_booking_services`)
        .then(r => r.json())
        .then(res => {
          const container = document.getElementById('service-list');
          container.innerHTML = "";
          
          if(res && res.items && res.items.length > 0) {
            let itemsToShow = res.items;
            if (targetServiceFromURL) {
              itemsToShow = res.items.filter(item => item.name.toLowerCase().includes(targetServiceFromURL.toLowerCase()));
              if (itemsToShow.length === 0) {
                itemsToShow = res.items;
              } else {
                document.getElementById('subtitle-mode').innerText = "แพ็กเกจที่คุณเลือกจากแชท LINE";
              }
            }

            itemsToShow.forEach(item => {
              const btnStyle = isBookingOpen ? "btn-emerald-gold cursor-pointer py-3" : "bg-gray-200 text-gray-400 cursor-not-allowed opacity-60 py-3 font-bold rounded-full";
              const btnAction = isBookingOpen ? `onclick="openBookingModal('${item.name}')"` : "";
              
              container.innerHTML += `
                <div class="card-light-emerald p-5 flex flex-col gap-3">
                  <div>
                    <div class="text-base font-bold text-emerald-950">${item.name}</div>
                    <div class="text-xs text-dark-muted mt-1.5 leading-relaxed">${item.desc || 'เปิดดวงพยากรณ์มงคล เจาะลึกเฉพาะประเด็น'}</div>
                    <div class="text-sm font-extrabold gold-dark-text mt-3">${item.price > 0 ? item.price.toLocaleString() + ' บาท' : 'บูชาฟรี'}</div>
                  </div>
                  <button ${btnAction} class="${btnStyle} w-full text-xs tracking-wide flex items-center justify-center gap-1 shadow-sm">
                    ${isBookingOpen ? '🔮 เลือกจองเวลานี้' : '🔒 ปิดรับจองชั่วคราว'}
                  </button>
                </div>
              `;
            });
          } else {
            container.innerHTML = `<div class="text-center text-xs text-gray-500 py-10">ไม่พบแพ็กเกจดูดวงในขณะนี้</div>`;
          }
        })
        .catch(() => {
          document.getElementById('service-list').innerHTML = `<div class="text-center text-xs text-red-500 py-10">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</div>`;
        });
    }

    function openBookingModal(serviceName) {
      if (!isBookingOpen) return;
      selectedService = serviceName;
      document.getElementById('modal-service-title').innerText = `จองคิว: ${serviceName}`;
      document.getElementById('booking-modal').classList.remove('hidden');
      loadTimeSlots();
    }

    function closeModal() {
      document.getElementById('booking-modal').classList.add('hidden');
    }

    function loadTimeSlots() {
      const container = document.getElementById('slot-container');
      container.innerHTML = `<div class="text-gray-500 text-center py-4 col-span-2 text-xs">กำลังตรวจสอบรอบเวลา...</div>`;

      fetch(`${WEB_URL}?action=get_time_slots`)
        .then(r => r.json())
        .then(res => {
          container.innerHTML = "";
          const slots = (res && res.slots) ? res.slots : [];

          if(slots.length === 0) {
            container.innerHTML = `<div class="text-gray-500 text-center py-4 col-span-2 text-xs">ไม่พบรอบเวลาเปิดบริการ</div>`;
            return;
          }

          slots.forEach(slot => {
            const isOpen = slot.status.toLowerCase() === "open";
            
            if (isOpen) {
              container.innerHTML += `
                <div class="p-2.5 rounded-2xl bg-emerald-50/60 border border-emerald-600/20 flex flex-col justify-between gap-2 shadow-2xs">
                  <div>
                    <div class="text-emerald-950 font-bold text-[11px]">⏰ ${slot.time}</div>
                    <span class="inline-flex items-center gap-1 text-[9px] text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full border border-emerald-300 mt-1">
                      <span class="w-1.5 h-1.5 rounded-full bg-emerald-600 animate-pulse"></span> ว่าง
                    </span>
                  </div>
                  <button onclick="confirmSlotWithoutPopup('${slot.time}')" class="btn-emerald-gold w-full py-1.5 text-[11px] shadow-sm">จอง</button>
                </div>
              `;
            } else {
              container.innerHTML += `
                <div class="p-2.5 rounded-2xl bg-gray-50 border border-gray-200 flex flex-col justify-between gap-2 opacity-60">
                  <div>
                    <div class="text-gray-400 font-bold text-[11px]">⏰ ${slot.time}</div>
                    <span class="inline-flex items-center gap-1 text-[9px] text-red-600 bg-red-50 px-2 py-0.5 rounded-full border border-red-200 mt-1">
                      <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span> เต็มแล้ว
                    </span>
                  </div>
                  <button disabled class="bg-gray-200 text-gray-400 w-full py-1.5 text-[11px] rounded-full cursor-not-allowed font-medium">เต็ม</button>
                </div>
              `;
            }
          });
        })
        .catch(() => {
          container.innerHTML = `<div class="text-red-500 text-center py-4 col-span-2 text-xs">โหลดรอบเวลาไม่สำเร็จ</div>`;
        });
    }

    function confirmSlotWithoutPopup(slotTime) {
      if (currentUserId === "guest_user") {
        alert("⚠️ กรุณาเปิดใช้งานผ่านแอปพลิเคชัน LINE ครับ");
        return;
      }

      closeModal();

      fetch(`${WEB_URL}?action=submit_booking&userId=${encodeURIComponent(currentUserId)}&serviceName=${encodeURIComponent(selectedService)}&slotTime=${encodeURIComponent(slotTime)}`)
        .then(r => r.json())
        .then(res => {
          if (typeof liff !== 'undefined' && liff.isInClient()) {
            liff.closeWindow();
          } else {
            window.location.href = "https://line.me/R/";
          }
        })
        .catch(() => {
          if (typeof liff !== 'undefined' && liff.isInClient()) {
            liff.closeWindow();
          }
        });
    }
  </script>
</body>
</html>
