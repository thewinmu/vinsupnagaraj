<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จองคิวดูดวง | วินทร์ทรัพย์นาคราช</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Prompt', sans-serif; background-color: #020617; } </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col p-4 max-w-md mx-auto justify-between">
  
  <div>
    <header class="text-center py-5 border-b border-amber-500/20 mb-4">
      <p class="text-[10px] tracking-[0.2em] text-amber-500 uppercase font-bold">THE WIN MU</p>
      <h1 class="text-xl font-bold text-amber-400 mt-1">รายการแพ็กเกจพยากรณ์</h1>
      
      <div id="member-badge" class="mt-3 inline-block bg-slate-900 border border-amber-500/40 px-4 py-1.5 rounded-full text-xs text-amber-300 shadow">
        กำลังโหลดข้อมูลสมาชิก...
      </div>
    </header>

    <!-- ขั้นที่ 1: แสดงรายการสินค้า/แพ็กเกจที่ดึงมาจากชีต products -->
    <div id="step-packages" class="space-y-3">
      <div class="text-center text-xs text-slate-400 py-6">กำลังดึงรายการแพ็กเกจจากระบบ...</div>
    </div>

    <!-- ขั้นที่ 2: เลือกวัน-เวลา (สำหรับแพ็กเกจที่ต้องนัดหมาย) -->
    <div id="step-datetime" style="display: none;" class="space-y-4">
      <button onclick="backToPackages()" class="text-amber-400 text-xs">❮ เปลี่ยนแพ็กเกจ</button>
      <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3">
        <p id="selected-pkg-name" class="text-sm font-bold text-amber-300"></p>
      </div>
      <div>
        <label class="text-xs text-slate-400 block mb-2">เลือกวันที่ต้องการ</label>
        <input type="date" id="booking-date" class="w-full bg-slate-900 border border-amber-500/40 rounded-xl p-3 text-sm text-slate-100 focus:outline-none">
      </div>
      <div>
        <label class="text-xs text-slate-400 block mb-2">เลือกรอบเวลา</label>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="selectTime('13:00 - 13:20')" class="time-btn bg-slate-900 border border-amber-500/30 p-2.5 rounded-xl text-xs text-amber-300">13:00 - 13:20</button>
          <button onclick="selectTime('14:00 - 14:20')" class="time-btn bg-slate-900 border border-amber-500/30 p-2.5 rounded-xl text-xs text-amber-300">14:00 - 14:20</button>
          <button onclick="selectTime('15:00 - 15:20')" class="time-btn bg-slate-900 border border-amber-500/30 p-2.5 rounded-xl text-xs text-amber-300">15:00 - 15:20</button>
          <button onclick="selectTime('16:00 - 16:20')" class="time-btn bg-slate-900 border border-amber-500/30 p-2.5 rounded-xl text-xs text-amber-300">16:00 - 16:20</button>
        </div>
      </div>
    </div>
  </div>

  <div id="action-box" style="display: none;" class="mt-6">
    <button onclick="submitBooking()" class="w-full bg-gradient-to-r from-amber-500 to-amber-700 text-slate-950 font-bold py-3.5 rounded-xl text-sm shadow">ยืนยันการจองคิวทันที</button>
  </div>

  <script>
    const WEB_APP_URL = "วาง_WEB_APP_URL_ของคุณตรงนี้";
    let currentUserId = "U8065e05dc54f0ddc3fb46e97492eb53a";
    let memberInfo = { memberCode: "M0000", name: "กำลังโหลด..." };
    let bookingData = { packageName: "", price: 0, isTimeRequired: false, bookingDate: "", bookingTime: "" };

    window.onload = async function() {
      try {
        await liff.init({ liffId: "2007499712-O7LXXVaY" });
        if (liff.isLoggedIn()) currentUserId = (await liff.getProfile()).userId;
      } catch (e) {}
      
      fetchMemberData();
      fetchPackages();
    };

    function fetchMemberData() {
      fetch(WEB_APP_URL + "?action=get_member&userId=" + currentUserId)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success" && data.member) {
            memberInfo = data.member;
            document.getElementById('member-badge').innerText = "👤 " + memberInfo.name + " (" + memberInfo.memberCode + ")";
          } else {
            document.getElementById('member-badge').innerText = "👤 ลูกค้าทั่วไป (M0000)";
          }
        });
    }

    function fetchPackages() {
      fetch(WEB_APP_URL + "?action=get_packages")
        .then(res => res.json())
        .then(data => {
          if (data.status === "success" && data.packages) {
            renderPackages(data.packages);
          } else {
            document.getElementById('step-packages').innerHTML = '<div class="text-center text-xs text-red-400">ไม่พบข้อมูลแพ็กเกจในชีต products</div>';
          }
        });
    }

    function renderPackages(packages) {
      const container = document.getElementById('step-packages');
      container.innerHTML = "";
      
      packages.forEach(pkg => {
        // ตรวจสอบเงื่อนไขว่าแพ็กเกจไหนต้องจองเวลา (เช่น แพ็กเกจที่มีคำว่า "โทร" หรือ "ชม." หรือ "นาที")
        const needTime = pkg.name.includes("โทร") || pkg.name.includes("ชม") || pkg.name.includes("นาที");
        
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-amber-500/30 rounded-2xl p-4 cursor-pointer hover:border-amber-400 transition shadow-lg";
        card.onclick = () => selectPackage(pkg.name, pkg.price, needTime);
        
        card.innerHTML = `
          <span class="text-xs bg-amber-500/10 text-amber-400 px-2.5 py-0.5 rounded-full">${needTime ? 'โทรคุย (จองเวลา)' : 'ผ่านแชท (ใช้งานทันที)'}</span>
          <h3 class="font-bold text-base text-slate-100 mt-2">${pkg.name}</h3>
          <p class="text-xs text-slate-400 mt-0.5">${pkg.description}</p>
          <p class="text-amber-400 font-bold text-sm mt-2">${pkg.price} บาท</p>
        `;
        container.appendChild(card);
      });
    }

    function selectPackage(name, price, reqTime) {
      bookingData.packageName = name;
      bookingData.price = price;
      bookingData.isTimeRequired = reqTime;
      
      if (reqTime) {
        document.getElementById('step-packages').style.display = 'none';
        document.getElementById('step-datetime').style.display = 'block';
        document.getElementById('selected-pkg-name').innerText = "📦 " + name + " (" + price + " ฿)";
      } else {
        submitBooking();
      }
    }

    function selectTime(timeStr) {
      bookingData.bookingTime = timeStr;
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('bg-amber-500', 'text-slate-950'));
      event.target.classList.add('bg-amber-500', 'text-slate-950');
      document.getElementById('action-box').style.display = 'block';
    }

    function backToPackages() {
      document.getElementById('step-datetime').style.display = 'none';
      document.getElementById('step-packages').style.display = 'block';
      document.getElementById('action-box').style.display = 'none';
    }

    function submitBooking() {
      if (bookingData.isTimeRequired) {
        bookingData.bookingDate = document.getElementById('booking-date').value;
        if (!bookingData.bookingDate || !bookingData.bookingTime) {
          alert("กรุณาเลือกวันที่และรอบเวลาก่อนครับ");
          return;
        }
      } else {
        bookingData.bookingDate = "ใช้งานทันทีผ่านแชท";
        bookingData.bookingTime = "-";
      }

      const payload = { 
        action: "create_booking", 
        userId: currentUserId, 
        memberCode: memberInfo.memberCode,
        customerName: memberInfo.name,
        ...bookingData 
      };

      fetch(WEB_APP_URL, {
        method: "post",
        contentType: "application/json",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          alert("✅ จองคิวสำเร็จ! รหัสการจอง: " + data.bookingId);
          window.location.reload();
        } else {
          alert("❌ เกิดข้อผิดพลาด: " + data.message);
        }
      })
      .catch(err => alert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์"));
    }
  </script>
</body>
</html>
