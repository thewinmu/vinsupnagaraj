<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>วินทร์ทรัพย์นาคราช • วัตถุมงคล & บริการญาณพยากรณ์</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-deep: #021a14;
      --pearl-cream: #fbfbee;
      --gold-bright: #fef9c3;
      --gold-mid: #fef08a;
      --gold-dark: #ca8a04;
      --glossy-card: linear-gradient(145deg, rgba(4, 41, 31, 0.85) 0%, rgba(2, 16, 12, 0.95) 100%);
    }

    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at 50% 0%, #064e3b 0%, var(--bg-deep) 40%, #010d0a 100%);
      color: var(--pearl-cream);
      min-height: 100vh;
      margin: 0;
    }

    .bright-white-gold-text {
      background: linear-gradient(135deg, #ffffff 0%, var(--gold-bright) 30%, var(--gold-mid) 60%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(254, 249, 195, 0.4);
    }

    .glossy-panel {
      background: var(--glossy-card);
      border: 1px solid rgba(254, 240, 138, 0.25);
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
    }

    /* การ์ดสินค้าแบบ 2 คอลัมน์ */
    .product-mini-card {
      background: linear-gradient(145deg, rgba(4, 41, 31, 0.9) 0%, rgba(1, 15, 11, 0.95) 100%);
      border: 1.2px solid rgba(254, 240, 138, 0.25);
      border-radius: 18px;
      transition: all 0.2s ease;
    }
    .product-mini-card:hover {
      border-color: #fef08a;
      transform: translateY(-2px);
    }

    .btn-gold-action {
      background: linear-gradient(135deg, #ffffff 0%, #fef08a 35%, #eab308 70%, #a16207 100%);
      color: #032018;
    }
  </style>
</head>
<body class="p-4 sm:p-6 max-w-md mx-auto flex flex-col pb-28">

  <!-- Header ด้านบน -->
  <div class="flex items-center justify-between py-3 mb-3">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-full bg-emerald-950/80 border border-amber-300/40 flex items-center justify-center">
        <span class="text-xl">🐍</span>
      </div>
      <div>
        <h2 class="text-xs font-bold tracking-widest uppercase text-amber-200">วินทร์ทรัพย์นาคราช</h2>
        <p class="text-[9px] text-emerald-300">@thewinmu • LINE MyShop Official</p>
      </div>
    </div>
    <a href="./memberships.html" class="p-2 rounded-xl bg-black/60 border border-amber-300/35 text-xs text-amber-200 flex items-center gap-1">
      <span>👤</span> สมาชิก
    </a>
  </div>

  <!-- แบนเนอร์หลัก & ทางลัด LINE MyShop -->
  <div class="glossy-panel rounded-3xl p-5 mb-5 relative overflow-hidden">
    <span class="px-2.5 py-0.5 rounded-full text-[9px] font-semibold bg-emerald-950/90 border border-emerald-400/40 text-emerald-300">
      ✨ ร้านค้าทางการ LINE MyShop
    </span>
    <h1 class="text-xl font-extrabold bright-white-gold-text mt-2 mb-1">
      วัตถุมงคล & บริการญาณ
    </h1>
    <p class="text-[11px] text-slate-200/90 mb-4">
      เบิกเนตรเสริมสิริมงคล เมตตา มหาเสน่ห์ และโชคลาภ
    </p>

    <div class="grid grid-cols-2 gap-2.5">
      <!-- ปุ่มเชื่อม LINE MyShop LIFF -->
      <a href="https://liff.line.me/1572442362-jGxDDGRp/@thewinmu" target="_blank" class="p-2.5 rounded-xl bg-black/50 border border-emerald-400/50 text-center flex flex-col items-center justify-center">
        <span class="text-lg mb-0.5">🛍️</span>
        <span class="text-xs font-bold text-emerald-200">LINE MyShop</span>
        <span class="text-[9px] text-emerald-400">ช้อปผ่านไลน์</span>
      </a>
      <!-- ปุ่มทางลัด TikTok -->
      <a href="https://www.tiktok.com/@thewinmu" target="_blank" class="p-2.5 rounded-xl bg-black/50 border border-amber-300/30 text-center flex flex-col items-center justify-center">
        <span class="text-lg mb-0.5">🎵</span>
        <span class="text-xs font-bold text-amber-200">TikTok ชุมชน</span>
        <span class="text-[9px] text-emerald-300">@thewinmu</span>
      </a>
    </div>
  </div>

  <!-- หมวดหมู่สินค้า -->
  <div class="flex items-center gap-2 mb-4 overflow-x-auto pb-1 no-scrollbar">
    <button onclick="filterCategory('all')" id="tab-all" class="px-4 py-1.5 rounded-full text-xs border border-amber-300/30 bg-amber-400/20 text-white font-bold">ทั้งหมด</button>
    <button onclick="filterCategory('amulet')" id="tab-amulet" class="px-4 py-1.5 rounded-full text-xs border border-amber-300/30 bg-black/40 text-pearl-cream">📿 วัตถุมงคล</button>
    <button onclick="filterCategory('service')" id="tab-service" class="px-4 py-1.5 rounded-full text-xs border border-amber-300/30 bg-black/40 text-pearl-cream">🔮 ดูดวง/พิธี</button>
  </div>

  <!-- รายการสินค้าแบบ 2 คอลัมน์ รูปขนาดเล็กตามโจทย์ -->
  <div id="product-grid" class="grid grid-cols-2 gap-3">
    <div class="col-span-full py-10 text-center text-xs text-amber-200 animate-pulse">
      กำลังดึงข้อมูลวัตถุมงคลและบริการ...
    </div>
  </div>

  <script>
    const WEB_URL = "https://script.google.com/macros/s/AKfycbwBK-NcHXTiaoVhJyBxB3fMVGFj9x8lSjvU1ECL6pzmjjIWLFqgN-94ny9niIjtow9B/exec";
    const MYSHOP_LIFF = "https://liff.line.me/1572442362-jGxDDGRp/@thewinmu";

    let allItems = [];
    let currentCategory = 'all';

    window.onload = function() {
      fetch(`${WEB_URL}?action=get_services`)
        .then(r => r.json())
        .then(res => {
          if (res.status === "success") {
            allItems = [...(res.products || []), ...(res.services || [])];
          }
          if (allItems.length === 0) {
            allItems = [
              { name: "จี้พญานาคราชมณีรัตนะ", price: 999, category: "amulet", description: "แร่ดูดทรัพย์ เบิกเนตรเสริมโชคลาภ", imageId: "" },
              { name: "น้ำปรุงทิพย์มนต์นาคราช", price: 499, category: "amulet", description: "สูตรลับโบราณ เมตตามหานิยม", imageId: "" },
              { name: "ดูดวงญาณนาคราช 15 นาที", price: 108, category: "service", description: "ตรวจดวงชะตารอบเวลาเฉพาะบุคคล", imageId: "" }
            ];
          }
          renderProducts();
        }).catch(() => {
          renderProducts();
        });
    };

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll("button[id^='tab-']").forEach(b => {
        b.className = "px-4 py-1.5 rounded-full text-xs border border-amber-300/30 bg-black/40 text-pearl-cream";
      });
      document.getElementById(`tab-${cat}`).className = "px-4 py-1.5 rounded-full text-xs border border-amber-300/30 bg-amber-400/20 text-white font-bold";
      renderProducts();
    }

    function renderProducts() {
      const container = document.getElementById("product-grid");
      container.innerHTML = "";

      const filtered = allItems.filter(item => {
        if (currentCategory === 'all') return true;
        if (currentCategory === 'amulet') return !item.category.includes("บริการ") && !item.name.includes("ดูดวง");
        if (currentCategory === 'service') return item.category.includes("บริการ") || item.name.includes("ดูดวง");
        return true;
      });

      filtered.forEach(p => {
        const isService = p.category.includes("บริการ") || p.name.includes("ดูดวง");
        const actionUrl = isService ? `./booking.html?service=${encodeURIComponent(p.name)}` : MYSHOP_LIFF;
        const btnLabel = isService ? "📅 จองคิว" : "🛒 บูชา";

        // แสดงรูปประกอบขนาดเล็ก หากมี Drive ID
        const imgTag = (p.imageId && p.imageId.length > 10) 
          ? `<img src="https://drive.google.com/uc?id=${p.imageId}" class="w-12 h-12 object-cover rounded-lg border border-amber-300/30 mr-2 flex-shrink-0">`
          : `<div class="w-12 h-12 rounded-lg bg-emerald-950 border border-amber-300/30 flex items-center justify-center text-lg mr-2 flex-shrink-0">🐍</div>`;

        const card = document.createElement("div");
        card.className = "product-mini-card p-3 flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <div class="flex items-center mb-2">
              ${imgTag}
              <div class="overflow-hidden">
                <span class="text-[9px] text-emerald-300 font-bold uppercase">${isService ? 'บริการ' : 'วัตถุมงคล'}</span>
                <h3 class="text-xs font-bold text-white leading-tight line-clamp-1">${p.name}</h3>
              </div>
            </div>
            <p class="text-[10px] text-slate-300 font-light line-clamp-2 mb-2">${p.description || '-'}</p>
          </div>
          <div class="pt-2 border-t border-white/5 flex items-center justify-between">
            <span class="text-xs font-bold bright-white-gold-text">฿${Number(p.price).toLocaleString()}</span>
            <a href="${actionUrl}" target="${isService ? '_self' : '_blank'}" class="btn-gold-action px-2.5 py-1 rounded-lg text-[10px] font-bold">
              ${btnLabel}
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
