<!-- ปรับปรุง Modal ตะกร้าสินค้าให้มีฟอร์มชื่อ-ที่อยู่จัดส่ง -->
<div id="cart-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-[#fcfcf7] border-t-2 sm:border-2 border-amber-400 rounded-t-3xl sm:rounded-3xl w-full max-w-md p-5 text-slate-800 max-h-[90vh] flex flex-col justify-between shadow-2xl overflow-y-auto">
    
    <div>
      <div class="flex items-center justify-between pb-3 border-b border-slate-200">
        <div class="flex items-center gap-2">
          <span class="text-lg">🛒</span>
          <h3 class="text-sm font-extrabold text-emerald-950">ตะกร้าสินค้า & สั่งซื้อ</h3>
        </div>
        <button onclick="closeCartModal()" class="text-slate-400 hover:text-slate-800 text-lg">✕</button>
      </div>

      <!-- รายการสินค้าในตะกร้า -->
      <div id="cart-items-container" class="divide-y divide-slate-100 max-h-40 overflow-y-auto py-2 my-1 text-xs"></div>

      <!-- ฟอร์มข้อมูลจัดส่ง -->
      <div class="mt-3 pt-3 border-t border-slate-200 space-y-2 text-xs">
        <div class="font-bold text-emerald-950 flex items-center gap-1">
          <span>📍</span> ข้อมูลผู้รับและที่อยู่จัดส่ง
        </div>
        <input type="text" id="cust-name" placeholder="ชื่อ-นามสกุล ผู้รับ" class="w-full p-2.5 rounded-xl border border-slate-300 bg-white text-xs focus:outline-none focus:border-amber-500">
        <input type="tel" id="cust-phone" placeholder="เบอร์โทรศัพท์ติดต่อ" class="w-full p-2.5 rounded-xl border border-slate-300 bg-white text-xs focus:outline-none focus:border-amber-500">
        <textarea id="cust-address" rows="2" placeholder="ที่อยู่จัดส่งครบถ้วน (บ้านเลขที่, แขวง/ตำบล, เขต/อำเภอ, จังหวัด, รหัสไปรษณีย์)" class="w-full p-2.5 rounded-xl border border-slate-300 bg-white text-xs focus:outline-none focus:border-amber-500"></textarea>
      </div>
    </div>

    <!-- ส่วนสรุปยอดและปุ่มสั่งซื้อ -->
    <div class="pt-3 border-t border-slate-200 space-y-2.5 mt-3">
      <div class="flex justify-between items-center">
        <span class="text-xs text-slate-500">ยอดรวมทั้งสิ้น:</span>
        <span id="cart-total-price" class="text-lg font-black text-emerald-900 font-mono">฿0</span>
      </div>

      <button id="btn-submit-order" onclick="submitOrderViaLiff()" class="btn-emerald-gold w-full py-3 text-center text-xs font-bold shadow-lg flex items-center justify-center gap-2">
        <span>💬 ยืนยันสั่งซื้อและส่งบิลเข้าแชท LINE</span>
      </button>
    </div>

  </div>
</div>
