<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จองคิวดูดวง | วินทร์ทรัพย์นาคราช</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F8FAFC; color: #1E293B; }
    .gold-gradient { background: linear-gradient(135deg, #D97706 0%, #B45309 100%); }
    .gold-border { border-color: rgba(217, 119, 6, 0.3); }
    .luxury-card { background: #FFFFFF; border: 1px solid rgba(217, 119, 6, 0.2); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4 max-w-md mx-auto justify-between">
  
  <div>
    <!-- ส่วนหัว: ธีมสว่าง หรูหรา พร้อมโลโก้พญานาค -->
    <header class="text-center py-6 border-b gold-border mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-amber-50 border gold-border mb-2 shadow-inner">
        <!-- สัญลักษณ์พญานาค (Logo Icon) -->
        <span class="text-xl">🐉</span>
      </div>
      <p class="text-[10px] tracking-[0.25em] text-amber-700 uppercase font-bold">THE WIN MU</p>
      <h1 class="text-xl font-bold text-slate-900 mt-1">วินทร์ทรัพย์นาคราช</h1>
      <p class="text-xs text-slate-500 mt-0.5">ระบบจองคิวพยากรณ์และศรัทธามหามงคล</p>
      
      <div id="member-badge" class="mt-3 inline-block bg-amber-50 border gold-border px-4 py-1 rounded-full text-xs text-amber-800 font-medium shadow-sm">
        กำลังตรวจสอบสมาชิก...
      </div>
    </header>

    <!-- ขั้นที่ 1: รายการแพ็กเกจ (ดึงจาก product) -->
    <div id="step-packages" class="space-y-3.5">
      <div class="text-center text-xs text-slate-400 py-8">กำลังเชื่อมต่อฐานข้อมูลแพ็กเกจ...</div>
    </div>

    <!-- ขั้นที่ 2: เลือกรอบวันเวลาและเช็กสถานะคิวว่าง 15 วัน -->
    <div id="step-datetime" style="display: none;" class="space-y-4">
      <button onclick="backToPackages()" class="text-amber-700 text-xs font-semibold flex items-center gap-1">❮ กลับไปเลือกแพ็กเกจ</button>
      <div class="bg-amber-50 border gold-border rounded-2xl p-4 shadow-sm">
        <p class="text-[11px] text-amber-800 font-medium">แพ็กเกจที่เลือก</p>
        <p id="selected-pkg-name" class="text-sm font-bold text-slate-900 mt-0.5"></p>
      </div>
      <div>
        <label class="text-xs text-slate-600 block mb-2 font-medium">เลือกวันที่ต้องการ (ภายใน 15 วันนี้)</label>
        <input type="date" id="booking-date" onchange="checkSlots()" class="w-full bg-white border gold-border rounded-xl p-3 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500/20 shadow-sm">
      </div>
      <div>
        <label class="text-xs text-slate-600 block mb-2 font-medium">สถานะรอบเวลา (🟩 ว่าง | 🟥 เต็ม)</label>
        <div id="slots-container" class="grid grid-cols-2 gap-2.5">
          <p class="text-xs text-slate-400 col-span-2 py-4 text-center">กรุณาเลือกวันที่ด้านบนก่อนครับ</p>
        </div>
      </div>
    </div>
  </div>

  <div id="action-box" style="display: none;" class="mt-6">
    <button onclick="submitBooking()" class="w-full gold-gradient text-white font-bold py-3.5 rounded-xl text-sm shadow-lg shadow-amber-600/20 transition-all active:scale-95">ยืนยันการจอง & รับใบกำกับภาษี</button>
  </div>

  <footer class="text-center text-[11px] text-slate-400 py-6 border-t border-slate-100 mt-6">
    The Win Mu Official © 2026
  </footer>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzAJeHPfi9p4K-ouN-9z-8rG79REIP0qNiQwWzM1F9M5BfWJ2H1WZQ_4V4P0d8v0uM/exec";
    let currentUserId = "U8065e05dc54f0ddc3fb46e97492eb53a";
    let memberInfo = { memberCode: "M0000", name: "สมาชิก" };
    let bookingData = { packageName: "", price: 0, bookingDate: "", bookingTime: "" };

    window.onload = async function() {
      try {
        await liff.init({ liffId: "2007499712-O7LXXVaY" });
        if (liff.isLoggedIn()) currentUserId = (await liff.getProfile()).userId;
      } catch (e) {}
      fetchMemberData();
      fetchPackages();
      setMinMaxDate();
    };

    function setMinMaxDate() {
      const today = new Date().toISOString().split('T')[0];
      const maxDate = new Date();
      maxDate.setDate(maxDate.getDate() + 15);
      const maxStr = maxDate.toISOString().split('T')[0];
      const dateInput = document.getElementById('booking-date');
      dateInput.min = today;
      dateInput.max = maxStr;
    }

    function fetchMemberData() {
      fetch(WEB_APP_URL + "?action=get_member&userId=" + currentUserId)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            memberInfo = data.member;
            document.getElementById('member-badge').innerText = "👤 " + memberInfo.name + " (" + memberInfo.memberCode + ")";
          }
        });
    }

    function fetchPackages() {
      fetch(WEB_APP_URL + "?action=get_packages")
        .then(res => res.json())
        .then(data => {
          if (data.status === "success" && data.packages) {
            const container = document.getElementById('step-packages');
            container.innerHTML = "";
            data.packages.forEach(pkg => {
              const card = document.createElement('div');
              card.className = "luxury-card rounded-2xl p-4 cursor-pointer hover:border-amber-500 transition-all transform hover:-translate-y-0.5";
              card.onclick = () => selectPackage(pkg.name, pkg.price);
              card.innerHTML = `
                <div class="flex justify-between items-start">
                  <h3 class="font-bold text-base text-slate-900">${pkg.name}</h3>
                  <span class="text-amber-700 font-bold text-sm bg-amber-50 px-2.5 py-1 rounded-lg border gold-border">${pkg.price} ฿</span>
                </div>
                <p class="text-xs text-slate-500 mt-1.5 leading-relaxed">${pkg.description}</p>
              `;
              container.appendChild(card);
            });
          }
        });
    }

    function selectPackage(name, price) {
      bookingData.packageName = name;
      bookingData.price = price;
      document.getElementById('step-packages').style.display = 'none';
      document.getElementById('step-datetime').style.display = 'block';
      document.getElementById('selected-pkg-name').innerText = name + " — " + price + " บาท";
    }

    function checkSlots() {
      const date = document.getElementById('booking-date').value;
      if (!date) return;
      fetch(WEB_APP_URL + "?action=check_slots&date=" + date)
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('slots-container');
          container.innerHTML = "";
          data.slots.forEach(slot => {
            const btn = document.createElement('button');
            if (slot.available) {
              btn.className = "bg-emerald-50 border border-emerald-300 p-3 rounded-xl text-xs text-emerald-800 font-semibold shadow-sm transition hover:bg-emerald-100";
              btn.innerText = "🟩 " + slot.time + " (ว่าง)";
              btn.onclick = () => selectTime(slot.time, btn);
            } else {
              btn.className = "bg-red-50 border border-red-200 p-3 rounded-xl text-xs text-red-400 opacity-60 cursor-not-allowed font-semibold";
              btn.innerText = "🟥 " + slot.time + " (เต็ม)";
              btn.disabled = true;
            }
            container.appendChild(btn);
          });
        });
    }

    function selectTime(timeStr, btnEl) {
      bookingData.bookingTime = timeStr;
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('ring-2', 'ring-amber-500', 'bg-amber-100'));
      btnEl.classList.add('ring-2', 'ring-amber-500', 'bg-amber-50');
      document.getElementById('action-box').style.display = 'block';
    }

    function backToPackages() {
      document.getElementById('step-datetime').style.display = 'none';
      document.getElementById('step-packages').style.display = 'block';
      document.getElementById('action-box').style.display = 'none';
    }

    function submitBooking() {
      bookingData.bookingDate = document.getElementById('booking-date').value;
      const payload = { action: "create_booking", userId: currentUserId, memberCode: memberInfo.memberCode, customerName: memberInfo.name, ...bookingData };

      fetch(WEB_APP_URL, { method: "post", contentType: "application/json", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            alert("✅ จองคิวสำเร็จ! ระบบส่งใบกำกับภาษีแบบย่อให้ทางแชท LINE แล้ว");
            window.location.reload();
          } else { alert("❌ เกิดข้อผิดพลาด: " + data.message); }
        });
    }
  </script>
</body>
</html>
