<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โถงพยากรณ์ | วินทร์ทรัพย์นาคราช</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F8FAFC; color: #1E293B; }
    .gold-gradient { background: linear-gradient(135deg, #D97706 0%, #B45309 100%); }
    .gold-border { border-color: rgba(217, 119, 6, 0.3); }
    .luxury-card { background: #FFFFFF; border: 1px solid rgba(217, 119, 6, 0.2); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; transition: transform 0.8s; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">
  <header class="bg-white border-b gold-border p-4 text-center rounded-2xl shadow-sm mb-4">
    <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-amber-50 border gold-border mb-1">
      <span class="text-lg">🐉</span>
    </div>
    <p class="text-[10px] tracking-[0.2em] text-amber-700 uppercase font-bold">The Win Mu</p>
    <h1 id="header-title" class="text-base font-bold text-slate-900 mt-0.5">โถงพยากรณ์ศักดิ์สิทธิ์</h1>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center text-center">
    
    <!-- เมนูเลือกกองไพ่ -->
    <div id="menu-section" class="w-full space-y-4">
      <div class="mb-4">
        <h2 class="text-lg font-bold text-slate-900">เลือกรูปแบบสาส์นพยากรณ์</h2>
        <p class="text-xs text-slate-500 mt-1">ค่าครู 20 บาท หรือใช้สิทธิ์เปิดฟรีรายเดือน</p>
      </div>
      
      <button onclick="openDeck('Pick a Card', '1g4nh17S_I8_0UK4mdhwTBYRKhF3FVVkN')" class="w-full luxury-card p-5 rounded-2xl flex flex-col items-center gap-1.5 hover:border-amber-500 transition-all">
        <span class="text-3xl">🔮</span>
        <span class="font-bold text-slate-900 text-base">Pick a Card</span>
        <span class="text-xs text-slate-500">สุ่มไพ่จากสาส์นครูผู้ชี้นำ</span>
      </button>

      <button onclick="openDeck('สาส์นเทวดา', '16SSHTmxmWyIiSCrwCNLlZkBl6ALGGEc2')" class="w-full luxury-card p-5 rounded-2xl flex flex-col items-center gap-1.5 hover:border-amber-500 transition-all">
        <span class="text-3xl">👼</span>
        <span class="font-bold text-slate-900 text-base">สาส์นเทวดา</span>
        <span class="text-xs text-slate-500">สุ่มไพ่รับพรจากสรวงสวรรค์</span>
      </button>
    </div>

    <!-- หน้าเลือกไพ่ 3 ใบ -->
    <div id="intro-section" style="display: none;" class="space-y-6 w-full">
      <div class="bg-amber-50 border gold-border rounded-2xl p-4 shadow-sm">
        <p class="text-xs text-amber-900 font-medium">ตั้งจิตอธิษฐานให้เป็นสมาธิ <br>จงเลือกไพ่ 1 ใบ เพื่อรับสาส์นชี้แนะ</p>
      </div>
      <div id="cards-box" class="flex justify-center gap-3">
        <div onclick="drawCard()" class="cursor-pointer aspect-[2/3] w-24 rounded-xl bg-white border-2 gold-border flex items-center justify-center shadow-md hover:scale-105 transition"><span class="text-amber-600 text-2xl">🐉</span></div>
        <div onclick="drawCard()" class="cursor-pointer aspect-[2/3] w-24 rounded-xl bg-white border-2 gold-border flex items-center justify-center shadow-md hover:scale-105 transition"><span class="text-amber-600 text-2xl">🐉</span></div>
        <div onclick="drawCard()" class="cursor-pointer aspect-[2/3] w-24 rounded-xl bg-white border-2 gold-border flex items-center justify-center shadow-md hover:scale-105 transition"><span class="text-amber-600 text-2xl">🐉</span></div>
      </div>
      <p id="loading-text" style="display: none;" class="text-xs text-amber-700 font-bold animate-pulse">กำลังสื่อสารกับพลังงานศักดิ์สิทธิ์...</p>
    </div>

    <!-- หน้าแสดงรูปไพ่ -->
    <div id="result-section" style="display: none;" class="w-full space-y-5">
      <div class="perspective-1000 mx-auto w-56 h-80">
        <div id="card-inner" class="relative w-full h-full transform-style-3d">
          <div class="absolute w-full h-full backface-hidden bg-white border-2 gold-border rounded-2xl flex items-center justify-center shadow-lg"><span class="text-amber-600 text-4xl">🐉</span></div>
          <div class="absolute w-full h-full backface-hidden rotate-y-180 bg-white border-2 border-amber-500 rounded-2xl overflow-hidden shadow-xl flex items-center justify-center">
            <img id="res-image" src="" alt="Card" class="w-full h-full object-cover">
          </div>
        </div>
      </div>
      <button onclick="window.location.reload()" class="w-full gold-gradient text-white text-sm font-bold py-3.5 rounded-xl shadow-md">🔄 เริ่มต้นทำนายใหม่</button>
    </div>

  </main>

  <footer class="text-center text-[11px] text-slate-400 py-4">
    วินทร์ทรัพย์นาคราช © 2026
  </footer>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyxtbe9FCOGtmwSZr6Z6HwPpYK42tDN6EPv53BB42__U-tAx2hCQnOP7rARI0vW5wr83Q/exec";
    let currentUserId = "U8065e05dc54f0ddc3fb46e97492eb53a";
    let selectedFolderId = "";

    window.onload = async function() {
      try {
        await liff.init({ liffId: "2007499712-O7LXXVaY" });
        if (liff.isLoggedIn()) currentUserId = (await liff.getProfile()).userId;
      } catch (e) {}
    };

    function openDeck(title, folderId) {
      selectedFolderId = folderId;
      document.getElementById('header-title').innerText = title;
      document.getElementById('menu-section').style.display = 'none';
      document.getElementById('intro-section').style.display = 'block';
    }

    function drawCard() {
      document.getElementById('cards-box').style.opacity = '0.3';
      document.getElementById('cards-box').style.pointerEvents = 'none';
      document.getElementById('loading-text').style.display = 'block';

      const url = WEB_APP_URL + "?action=draw_folder_card&folderId=" + selectedFolderId + "&userId=" + currentUserId + "&t=" + Date.now();

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            document.getElementById('intro-section').style.display = 'none';
            document.getElementById('result-section').style.display = 'block';
            document.getElementById('res-image').src = data.imgUrl;
            setTimeout(() => { document.getElementById('card-inner').classList.add('rotate-y-180'); }, 200);
          } else {
            alert("แจ้งเตือน: " + data.message);
            window.location.reload();
          }
        });
    }
  </script>
</body>
</html>
