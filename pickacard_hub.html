<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pick a Card • วินทร์ทรัพย์นาคราช</title>
  <script src="./config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F8F9FA; color: #1D1D1F; min-height: 100vh; }
    .gold-text { background: linear-gradient(135deg, #D4AF37 0%, #FDE08B 50%, #B48608 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .glass-box { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
    .gold-card { background: linear-gradient(135deg, #121212 0%, #064E3B 70%, #000000 100%); border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 24px; color: #FDE08B; }
    .white-box { background: #FFFFFF; border-radius: 20px; border: 1px solid rgba(229, 229, 234, 0.8); }
    .btn-gold { background: #121212; color: #FDE08B; border: 1px solid rgba(212, 175, 55, 0.6); border-radius: 9999px; }
    .card-fan { display: flex; overflow-x: auto; gap: 12px; padding: 20px 10px; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .card-fan::-webkit-scrollbar { display: none; }
    .fan-item { flex: 0 0 120px; height: 180px; border-radius: 16px; background: linear-gradient(145deg, #121212 0%, #064E3B 100%); border: 1px solid #D4AF37; scroll-snap-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #FDE08B; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto flex flex-col justify-between pb-10">
  
  <div id="view-loading" class="text-center py-24">
    <div class="text-4xl mb-2 animate-bounce">🐍</div>
    <div class="text-xs text-gray-500">กำลังโหลดระบบ...</div>
  </div>

  <!-- หน้าสมัครสมาชิก (กรณีหลุด) -->
  <div id="view-reg" style="display: none;" class="text-center py-16">
    <div class="text-5xl mb-3">🔮</div>
    <h2 class="text-lg font-bold gold-text mb-2">วินทร์ทรัพย์นาคราช</h2>
    <p class="text-xs text-gray-500 mb-6">กรุณาสมัครสมาชิกก่อนใช้งานพยากรณ์</p>
    <button onclick="doRegister()" class="btn-gold w-full py-4 text-sm font-semibold">✨ สมัครสมาชิกฟรี</button>
  </div>

  <!-- หน้าจอหลัก -->
  <div id="view-main" style="display: none;">
    <header class="text-center py-4 glass-box mb-4 px-4">
      <div class="text-[10px] font-semibold tracking-widest text-slate-500 uppercase mb-1">✦ วินทร์ทรัพย์นาคราช ✦</div>
      <h1 class="text-xl font-bold gold-text">PICK A CARD</h1>
    </header>

    <div class="gold-card p-5 mb-5">
      <div class="flex justify-between items-center mb-3">
        <div><div class="font-semibold text-sm text-white" id="u-name">เจ้านางน้อย</div><div class="text-[10px] font-mono text-[#D4AF37]" id="u-code">ID: -</div></div>
        <button onclick="window.location.href='./memberships.html'" class="bg-black/40 text-[#FDE08B] px-3 py-1 rounded-full text-[11px] border border-[#D4AF37]/40">สถานะ</button>
      </div>
      <div class="grid grid-cols-2 gap-2 pt-3 border-t border-[#D4AF37]/30 text-center text-xs">
        <div><div class="text-[#A7F3D0] text-[10px]">สิทธิ์ฟรี</div><div class="font-semibold text-white" id="u-free">- ครั้ง</div></div>
        <div><div class="text-[#A7F3D0] text-[10px]">ยอดเงิน</div><div class="font-semibold text-white" id="u-bal">- ฿</div></div>
      </div>
    </div>

    <!-- หมวดหมู่ -->
    <div id="sec-cats" class="space-y-3">
      <button onclick="pickCat('สาส์นครู')" class="gold-card w-full p-4 rounded-2xl flex items-center justify-between text-left">
        <div class="flex items-center gap-3"><span class="text-2xl">🐍</span><div><div class="text-sm font-bold text-[#FDE08B]">สาส์นครู • สาร์นปู่</div><div class="text-[10px] text-[#A7F3D0]">รับคำทำนายโดยตรงจากครูบาอาจารย์</div></div></div><span>➔</span>
      </button>
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="pickCat('การงาน')" class="white-box p-4 text-center"><div class="text-2xl mb-1">💼</div><div class="text-xs font-semibold">การงาน</div></button>
        <button onclick="pickCat('การเงิน')" class="white-box p-4 text-center"><div class="text-2xl mb-1">💰</div><div class="text-xs font-semibold">การเงิน</div></button>
        <button onclick="pickCat('ความรัก')" class="white-box p-4 text-center"><div class="text-2xl mb-1">❤️</div><div class="text-xs font-semibold">ความรัก</div></button>
        <button onclick="pickCat('สุขภาพ')" class="white-box p-4 text-center"><div class="text-2xl mb-1">🌿</div><div class="text-xs font-semibold">สุขภาพ</div></button>
      </div>
    </div>

    <!-- หน้าเลือกไพ่ -->
    <div id="sec-select" style="display: none;" class="py-4 text-center">
      <button onclick="backToHub()" class="text-xs text-[#B48608] mb-4">⟨ เลือกหมวดหมู่ใหม่</button>
      <div class="text-xs font-semibold text-gray-700 mb-2">แตะเลือกไพ่ 1 ใบ</div>
      <div id="fan-box" class="card-fan"></div>
    </div>

    <!-- หน้าผลลัพธ์ -->
    <div id="sec-res" style="display: none;" class="py-2 text-center">
      <div class="white-box p-5 text-left mb-4 shadow-sm">
        <div class="text-[11px] font-semibold text-gray-400 mb-1" id="res-cat">หมวด</div>
        <h3 class="text-base font-bold text-gray-900 mb-2" id="res-title">-</h3>
        <p class="text-xs text-gray-600 leading-relaxed" id="res-meaning">-</p>
      </div>
      <button onclick="backToHub()" class="btn-gold w-full py-4 text-xs font-semibold">เสี่ยงทายใหม่อีกครั้ง</button>
    </div>
  </div>

  <script>
    const WEB_URL = (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.WEB_URL) ? APP_CONFIG.WEB_URL : "";
    let userId = "guest_user", uData = null, activeCat = "";

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof liff !== 'undefined') {
        liff.init({ liffId: "2007499712-O7LXXVaY" }).then(() => {
          if (liff.isLoggedIn()) { liff.getProfile().then(p => { userId = p.userId; initApp(); }); }
          else { initApp(); }
        }).catch(() => { initApp(); });
      } else { initApp(); }
    });

    function initApp() {
      fetch(`${WEB_URL}?action=check_user_quota&userId=${encodeURIComponent(userId)}`)
        .then(r => r.json()).then(res => {
          document.getElementById('view-loading').style.display = 'none';
          if (res && res.isMember) {
            uData = res;
            document.getElementById('view-main').style.display = 'block';
            document.getElementById('u-name').innerText = res.name;
            document.getElementById('u-code').innerText = "ID: " + res.memberCode;
            document.getElementById('u-free').innerText = res.freeQuota + " ครั้ง";
            document.getElementById('u-bal').innerText = res.balance + " ฿";
          } else {
            document.getElementById('view-reg').style.display = 'block';
          }
        }).catch(() => { document.getElementById('view-loading').style.display = 'none'; document.getElementById('view-reg').style.display = 'block'; });
    }

    function doRegister() {
      fetch(`${WEB_URL}?action=register_member&userId=${encodeURIComponent(userId)}`)
        .then(r => r.json()).then(res => {
          if (res.status === "success") {
            alert("สมัครสมาชิกสำเร็จ! รหัส " + res.memberCode);
            location.reload();
          } else { alert("เกิดข้อผิดพลาด"); }
        });
    }

    function pickCat(cat) {
      if (uData.freeQuota <= 0 && uData.balance < 9) {
        alert("สิทธิ์ฟรีหมด และยอดเงินไม่พอ กรุณาเติมเงิน");
        return;
      }
      activeCat = cat;
      document.getElementById('sec-cats').style.display = 'none';
      document.getElementById('sec-select').style.display = 'block';
      renderCards();
    }

    function backToHub() {
      document.getElementById('sec-select').style.display = 'none';
      document.getElementById('sec-res').style.display = 'none';
      document.getElementById('sec-cats').style.display = 'block';
      initApp();
    }

    function renderCards() {
      const box = document.getElementById('fan-box'); box.innerHTML = "";
      for (let i = 0; i < 10; i++) {
        let el = document.createElement('div'); el.className = "fan-item";
        el.innerHTML = `<div class="text-2xl mb-1">🎴</div><div class="text-[10px]">ใบที่ ${i+1}</div>`;
        el.onclick = () => selectCard(i); box.appendChild(el);
      }
    }

    function selectCard(idx) {
      fetch(`${WEB_URL}?action=deduct_reading_quota&userId=${encodeURIComponent(userId)}&serviceName=${encodeURIComponent(activeCat)}`)
        .then(r => r.json()).then(res => {
          if (res.status === "success") {
            document.getElementById('sec-select').style.display = 'none';
            document.getElementById('sec-res').style.display = 'block';
            document.getElementById('res-cat').innerText = "หมวด: " + activeCat;
            document.getElementById('res-title').innerText = "คำทำนายใบที่ " + (idx + 1);
            document.getElementById('res-meaning').innerText = "ญาณบารมีเปิดเผยว่า: ช่วงเวลานี้พลังงานหนุนนำให้เกิดความสำเร็จสมหวังในสิ่งที่มุ่งมั่น ตั้งจิตอธิษฐานรับโชคลาภและสิ่งดีที่จะเข้ามา";
          } else {
            alert(res.message || "ไม่สามารถทำรายการได้");
          }
        });
    }
  </script>
</body>
</html>
