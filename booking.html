<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>จองคิวตรวจดวงชะตาสายญาณ - วินทร์ทรัพย์นาคราช</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', '-apple-system', 'sans-serif'] },
          colors: {
            mysticBg: { DEFAULT: '#08231C', light: '#0D382D', deep: '#051913' },
            nagaEmerald: { DEFAULT: '#105B43', deep: '#063828', glow: '#16805E', bright: '#34D399', light: '#A7F3D0' },
            auroraGold: { light: '#FEF08A', DEFAULT: '#FBBF24', amber: '#F59E0B', border: '#E6CA65' }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at 50% 0%, #104234 0%, #08261E 50%, #051A14 100%);
      color: #F3F4F6;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-mystic {
      background: rgba(9, 39, 31, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(230, 202, 101, 0.45);
    }
    .slot-btn.active {
      background: linear-gradient(135deg, #FEF08A 0%, #FBBF24 50%, #F59E0B 100%);
      color: #051913;
      border-color: #FFFFFF;
      font-weight: 800;
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
    }
  </style>
</head>
<body class="p-3.5 pb-28 max-w-md mx-auto">

  <!-- Header -->
  <header class="glass-mystic rounded-2xl p-4 shadow-xl flex items-center justify-between border border-auroraGold-border/60 mb-3.5">
    <div class="flex items-center space-x-2.5">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-mysticBg-deep via-nagaEmerald to-nagaEmerald-glow p-0.5 border border-auroraGold-border flex items-center justify-center shadow-md">
        <span class="text-xl">📞</span>
      </div>
      <div>
        <h1 class="text-xs font-black tracking-widest text-auroraGold-bright uppercase leading-tight">
          วินทร์ทรัพย์นาคราช
        </h1>
        <p class="text-[11px] font-black text-nagaEmerald-light">จองคิวตรวจดวงชะตา (โทร)</p>
      </div>
    </div>
    <a href="index.html" class="text-xs font-bold text-auroraGold-light bg-black/40 px-3 py-1.5 rounded-xl border border-auroraGold-border/60 hover:bg-black/60 transition shadow-sm">
      หน้าร้าน
    </a>
  </header>

  <div class="space-y-3.5">
    <!-- กล่องเลือกแพ็กเกจดูดวง -->
    <div class="glass-mystic rounded-2xl p-4 border border-auroraGold-border/40 space-y-2 shadow-lg">
      <label class="text-xs font-bold text-auroraGold-light flex items-center gap-1.5">
        <span>🔮</span> เลือกแพ็กเกจสายญาณ (หมวดบริการ)
      </label>
      <select id="service-select" onchange="onServiceChange()" class="w-full text-xs font-medium px-3.5 py-2.5 rounded-xl border border-auroraGold-border/50 bg-black/50 text-white focus:outline-none focus:border-auroraGold-bright">
        <option value="">กำลังดึงรายการบริการ...</option>
      </select>
      <div id="service-desc-box" class="text-[11px] text-stone-300 bg-black/30 p-2.5 rounded-xl border border-white/5 hidden leading-relaxed"></div>
      <div class="flex justify-between items-center pt-1 border-t border-white/10">
        <span class="text-xs text-stone-300">ค่าครูบูชาญาณ:</span>
        <span id="service-price" class="text-base font-black text-auroraGold-bright font-mono">฿0 บาท</span>
      </div>
    </div>

    <!-- กล่องเลือกวันที่ -->
    <div class="glass-mystic rounded-2xl p-4 border border-auroraGold-border/40 space-y-2 shadow-lg">
      <label class="text-xs font-bold text-auroraGold-light flex items-center gap-1.5">
        <span>🗓️</span> เลือกวันที่นัดหมายสนทนา
      </label>
      <input type="date" id="booking-date" onchange="loadTimeSlots()" class="w-full text-xs font-medium px-3.5 py-2.5 rounded-xl border border-auroraGold-border/50 bg-black/50 text-white focus:outline-none focus:border-auroraGold-bright">
    </div>

    <!-- กล่องเลือกรอบเวลา (รองรับสวิตช์เปิด-ปิดจากแอดมิน) -->
    <div class="glass-mystic rounded-2xl p-4 border border-auroraGold-border/40 space-y-2 shadow-lg">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-auroraGold-light flex items-center gap-1.5">
          <span>⏰</span> เลือกรอบเวลาสนทนา
        </label>
        <span id="slot-status" class="text-[10px] text-stone-400">เลือกรอบที่สะดวก</span>
      </div>
      <div id="slots-grid" class="grid grid-cols-2 gap-2 pt-1">
        <p class="text-xs text-stone-400 col-span-2 text-center py-4">กรุณาเลือกวันที่ก่อนครับ</p>
      </div>
    </div>

    <!-- ข้อมูลผู้ขอรับคำพยากรณ์ -->
    <div class="glass-mystic rounded-2xl p-4 border border-auroraGold-border/40 space-y-2 shadow-lg">
      <label class="text-xs font-bold text-auroraGold-light flex items-center gap-1.5">
        <span>👤</span> ข้อมูลผู้ขอรับคำพยากรณ์
      </label>
      <input type="text" id="cust-name" placeholder="ชื่อ - นามสกุล หรือชื่อเรียก *" class="w-full text-xs bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-auroraGold-bright">
      <input type="tel" id="cust-phone" placeholder="เบอร์โทรศัพท์ติดต่อสำหรับการโทร *" class="w-full text-xs bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-auroraGold-bright">
    </div>

    <!-- ปุ่มยืนยันการจอง -->
    <div class="pt-2">
      <button id="btn-confirm-booking" onclick="confirmBookingAction()" class="w-full bg-gradient-to-r from-auroraGold-bright via-auroraGold to-auroraGold-amber text-mysticBg-deep font-black text-sm py-3.5 rounded-2xl shadow-xl hover:brightness-110 active:scale-95 transition flex items-center justify-center space-x-2 border border-white">
        <span>✨</span>
        <span>ยืนยันการนัดหมายตรวจดวงชะตา</span>
      </button>
    </div>
  </div>

  <script>
    const LIFF_ID = "2007499712-3e6TMnJJ";
    const API_URL = "https://script.google.com/macros/s/AKfycbzhqzmw9LkSheJD2AQTreWQY2w1Wqh0okxRMXhRelayFqHetwQCPmc877YJCPnd6P6w/exec";

    let currentUserId = "";
    let servicesList = [];
    let selectedService = null;
    let selectedDate = "";
    let selectedTime = "";

    window.addEventListener("DOMContentLoaded", async () => {
      // 1. ตั้งค่าวันที่เริ่มต้นเป็นวันพรุ่งนี้
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const dateStr = tomorrow.toISOString().split('T')[0];
      const dateInput = document.getElementById("booking-date");
      dateInput.min = dateStr;
      dateInput.value = dateStr;
      selectedDate = dateStr;

      // 2. เริ่มต้น LIFF SDK
      try {
        if (typeof liff !== "undefined") {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) {
            const prof = await liff.getProfile();
            currentUserId = prof.userId;
            loadSavedProfile(currentUserId);
          }
        }
      } catch (e) {
        console.warn("LIFF Notice:", e);
      }

      // 3. โหลดบริการดูดวงและรอบเวลา
      await loadServices();
      loadTimeSlots();
    });

    async function loadSavedProfile(uid) {
      try {
        const res = await fetch(`${API_URL}?action=get_member_profile&userId=${encodeURIComponent(uid)}`);
        const data = await res.json();
        if (data.status === "success" && data.member) {
          if (data.member.name && data.member.name !== "-") document.getElementById("cust-name").value = data.member.name;
          if (data.member.phone && data.member.phone !== "-") document.getElementById("cust-phone").value = data.member.phone;
        }
      } catch (e) {}
    }

    async function loadServices() {
      const select = document.getElementById("service-select");
      try {
        const res = await fetch(`${API_URL}?action=get_call_services`);
        const data = await res.json();
        if (data.status === "success" && data.services && data.services.length > 0) {
          servicesList = data.services;
          select.innerHTML = servicesList.map((s, idx) => `
            <option value="${idx}">${s.name} - ฿${Number(s.price).toLocaleString()} บาท</option>
          `).join('');

          // ตรวจสอบ Parameter จาก URL (กรณีส่งต่อมาจากหน้าร้าน)
          const params = new URLSearchParams(window.location.search);
          const reqService = params.get("service");
          if (reqService) {
            const foundIdx = servicesList.findIndex(s => s.name === reqService);
            if (foundIdx !== -1) select.value = foundIdx;
          }

          onServiceChange();
        } else {
          select.innerHTML = `<option value="">ไม่พบบริการในหมวดบริการ</option>`;
        }
      } catch (err) {
        select.innerHTML = `<option value="">สายสัญญาณขัดข้อง</option>`;
      }
    }

    function onServiceChange() {
      const select = document.getElementById("service-select");
      const idx = select.value;
      if (idx !== "" && servicesList[idx]) {
        selectedService = servicesList[idx];
        document.getElementById("service-price").innerText = `฿${Number(selectedService.price).toLocaleString()} บาท`;
        const descBox = document.getElementById("service-desc-box");
        if (selectedService.description) {
          descBox.innerText = selectedService.description;
          descBox.classList.remove("hidden");
        } else {
          descBox.classList.add("hidden");
        }
      }
    }

    async function loadTimeSlots() {
      selectedDate = document.getElementById("booking-date").value;
      const grid = document.getElementById("slots-grid");
      const statusEl = document.getElementById("slot-status");
      selectedTime = "";

      if (!selectedDate) {
        grid.innerHTML = `<p class="text-xs text-stone-400 col-span-2 text-center py-4">กรุณาเลือกวันที่</p>`;
        return;
      }

      statusEl.innerText = "กำลังตรวจสอบรอบว่าง...";
      grid.innerHTML = `<p class="text-xs text-stone-400 col-span-2 text-center py-4">กำลังประสานตารางเวลา...</p>`;

      try {
        const res = await fetch(`${API_URL}?action=get_time_slots&date=${selectedDate}`);
        const data = await res.json();
        if (data.status === "success" && data.slots) {
          if (data.slots.length === 0) {
            statusEl.innerText = "ไม่มีรอบเวลาเปิด";
            grid.innerHTML = `<p class="text-xs text-amber-300 col-span-2 text-center py-4">รอบเวลาในวันนี้ปิดให้บริการทั้งหมด</p>`;
            return;
          }

          statusEl.innerText = "แตะเลือกรอบที่ต้องการ";
          grid.innerHTML = data.slots.map(s => {
            if (s.available) {
              return `<button type="button" onclick="selectSlot(this, '${s.time}')" class="slot-btn p-2.5 rounded-xl border border-auroraGold-border/40 bg-black/40 text-stone-200 text-xs font-semibold hover:border-auroraGold-bright active:scale-95 transition text-center shadow-sm">${s.time}</button>`;
            } else {
              return `<button type="button" disabled class="p-2.5 rounded-xl border border-white/5 bg-white/5 text-stone-500 text-xs font-medium cursor-not-allowed text-center">${s.time} (เต็ม)</button>`;
            }
          }).join('');
        }
      } catch (e) {
        grid.innerHTML = `<p class="text-xs text-red-400 col-span-2 text-center py-4">โหลดรอบเวลาไม่สำเร็จ</p>`;
      }
    }

    function selectSlot(btn, time) {
      document.querySelectorAll(".slot-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      selectedTime = time;
    }

    async function confirmBookingAction() {
      if (!selectedService) {
        alert("กรุณาเลือกแพ็กเกจดูดวงครับ");
        return;
      }
      if (!selectedDate) {
        alert("กรุณาเลือกวันที่นัดหมายครับ");
        return;
      }
      if (!selectedTime) {
        alert("กรุณาเลือกรอบเวลาสนทนาครับ");
        return;
      }

      const custName = document.getElementById("cust-name").value.trim();
      const custPhone = document.getElementById("cust-phone").value.trim();

      if (!custName || !custPhone) {
        alert("กรุณากรอกชื่อและเบอร์โทรศัพท์ติดต่อสำหรับการโทรครับ");
        return;
      }

      const btn = document.getElementById("btn-confirm-booking");
      btn.disabled = true;
      btn.innerText = "กำลังประสานคิวนัดหมาย...";

      let uid = currentUserId;
      if (!uid && typeof liff !== "undefined" && liff.isLoggedIn()) {
        try {
          const prof = await liff.getProfile();
          uid = prof.userId;
        } catch (e) {}
      }

      const payload = {
        action: "submit_fast_booking",
        userId: uid || "GUEST_USER",
        serviceName: selectedService.name,
        price: selectedService.price,
        bookingDate: selectedDate,
        slotTime: selectedTime,
        customerName: custName,
        phone: custPhone
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === "success") {
          // ฝั่งเราส่งข้อความธรรมดาเข้าห้องแชท (ฝั่งขวา) ป้องกัน Flex ส่งมาเบิ้ล
          if (typeof liff !== "undefined" && liff.isInClient()) {
            try {
              await liff.sendMessages([
                {
                  type: "text",
                  text: `📞 จองคิวตรวจดวงชะตา: ${result.bookingId}\nแพ็กเกจ: ${selectedService.name}\nวันที่นัด: ${selectedDate} (${selectedTime})\nค่าครู: ฿${Number(selectedService.price).toLocaleString()} บาท\n(กำลังแนบสลิปค่าครู)`
                }
              ]);
            } catch (chatErr) {
              console.warn("sendMessages warning:", chatErr);
            }
          }

          alert("🎉 จองคิวสำเร็จ! ระบบส่งใบนัดหมายและเลขที่บัญชีเข้าห้องแชทเรียบร้อยแล้วครับ");
          if (typeof liff !== "undefined" && liff.isInClient()) {
            setTimeout(() => { liff.closeWindow(); }, 500);
          }
        } else {
          alert("แจ้งเตือน: " + (result.message || "ไม่สามารถจองคิวได้"));
          btn.disabled = false;
          btn.innerText = "ยืนยันการนัดหมายตรวจดวงชะตา";
        }
      } catch (err) {
        alert("สายสัญญาณขัดข้อง กรุณาลองใหม่อีกครั้งครับ");
        btn.disabled = false;
        btn.innerText = "ยืนยันการนัดหมายตรวจดวงชะตา";
      }
    }
  </script>
</body>
</html>
