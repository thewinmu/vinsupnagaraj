<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>พิธีสลักนามผูกจิต • วินทร์ทรัพย์นาคราช</title>
  
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="./config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Prompt', -apple-system, sans-serif;
      background: radial-gradient(circle at 50% -10%, #064032 0%, #021a13 50%, #000806 100%);
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
    }
    .naga-glass-altar {
      background: linear-gradient(145deg, rgba(6, 44, 34, 0.92) 0%, rgba(1, 20, 14, 0.98) 100%);
      border: 1.2px solid rgba(250, 204, 21, 0.4);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7), 0 0 20px rgba(52, 211, 153, 0.15);
      backdrop-filter: blur(25px);
    }
    .naga-card-emerald {
      background: linear-gradient(135deg, #064e3b 0%, #022c22 45%, #00120c 100%);
      border: 1.5px solid #facc15;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.6), 0 0 20px rgba(250, 204, 21, 0.25);
    }
    .soul-input {
      background: rgba(0, 15, 11, 0.85);
      border: 1px solid rgba(250, 204, 21, 0.25);
      color: #fef9c3;
    }
    .soul-input:focus {
      border-color: #facc15;
      background: rgba(0, 25, 18, 0.95);
      outline: none;
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.3);
    }
    .btn-naga-bless {
      background: linear-gradient(135deg, #fef08a 0%, #ca8a04 100%);
      color: #022018;
      border-radius: 9999px;
      font-weight: 800;
      box-shadow: 0 4px 18px rgba(202, 138, 4, 0.4);
    }
  </style>
</head>
<body class="p-4 max-w-md mx-auto flex flex-col pb-36">

  <!-- แท่นพิธีเศียรนาคา -->
  <header class="naga-glass-altar rounded-3xl p-3.5 mb-4 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-full bg-black/80 border border-amber-400 flex items-center justify-center text-xl shadow-inner">
        🐍
      </div>
      <div>
        <h1 class="text-xs font-bold text-amber-200">วินทร์ทรัพย์นาคราช</h1>
        <p class="text-[9px] text-emerald-300/80">มหาพิธีสลักนามผูกจิตบาดาล</p>
      </div>
    </div>
    <span class="text-[9px] text-amber-300 font-mono bg-amber-400/10 px-2.5 py-1 rounded-full border border-amber-400/30">
      ภพมนุษย์ ⟨-⟩ บาดาล
    </span>
  </header>

  <!-- แท่นแก้วแสดงสังข์ประจำกาย (Simply Card) -->
  <div class="naga-card-emerald rounded-3xl p-5 text-white mb-4 flex flex-col justify-between min-h-[190px]">
    <div>
      <div class="flex justify-between items-start">
        <div>
          <div class="text-[8px] text-amber-300 font-mono tracking-widest uppercase">NAGA SOUL IDENTITY</div>
          <div class="text-xs font-bold text-slate-100">บัตรแก้วรัตนบารมีนาคาธิบดี</div>
        </div>
        <span id="soul-privilege" class="text-[9px] font-bold text-black bg-amber-400 px-2.5 py-0.5 rounded-full shadow">
          วรรณะนาคารัตนบารมี
        </span>
      </div>

      <div class="mt-4 flex items-center gap-3">
        <div class="w-12 h-12 rounded-full border border-amber-300/60 bg-black/60 overflow-hidden flex items-center justify-center shadow">
          <img id="soul-avatar" src="https://placehold.co/100x100/064032/fef08a?text=🐍" class="w-full h-full object-cover">
        </div>
        <div>
          <div id="soul-name" class="text-sm font-extrabold text-amber-200 line-clamp-1">กำลังสดับดวงจิต...</div>
          <div id="soul-phone" class="text-[11px] text-emerald-300/90 font-mono">08X-XXX-XXXX</div>
        </div>
      </div>
    </div>

    <div class="pt-3 border-t border-white/15 flex justify-between items-end mt-3">
      <div>
        <div class="text-[8px] text-slate-400 uppercase">สังข์แก้วประจำกาย</div>
        <div id="soul-code" class="text-xs font-mono font-bold text-amber-300">NAGA-PENDING</div>
      </div>
      <div class="text-right">
        <div class="text-[8px] text-slate-400 uppercase">ทรัพย์มณีคงคลัง</div>
        <div id="soul-balance" class="text-xs font-mono font-bold text-sky-300">฿0 มณี</div>
      </div>
    </div>
  </div>

  <!-- แท่นจารึกสัจจะ (ฟอร์มกรอก Col A - F) -->
  <div class="naga-glass-altar rounded-3xl p-5 mb-4 space-y-3">
    <div class="flex items-center justify-between pb-2 border-b border-amber-400/20">
      <h2 class="text-xs font-bold text-amber-200 flex items-center gap-1.5">
        <span>📜</span> แผ่นทองคำจารึกนาม
      </h2>
      <span id="sync-status" class="text-[9px] text-emerald-300 font-light">กำลังหยั่งจิต...</span>
    </div>

    <div class="space-y-2.5 text-xs">
      <div>
        <label class="block text-slate-300 mb-1">นามผู้ถือครองบัญชีแก้ว (ชื่อ-นามสกุล):</label>
        <input type="text" id="m-name" placeholder="ระบุนามจริงเพื่อประสิทธิ์พร" class="soul-input w-full p-2.5 rounded-xl">
      </div>

      <div>
        <label class="block text-slate-300 mb-1">สดับวจีผ่านสายสวรรค์ (เบอร์โทรศัพท์):</label>
        <input type="tel" id="m-phone" placeholder="08XXXXXXXX" class="soul-input w-full p-2.5 rounded-xl">
      </div>

      <div>
        <label class="block text-slate-300 mb-1">สาส์นลมปราณ (อีเมล):</label>
        <input type="email" id="m-email" placeholder="example@email.com" class="soul-input w-full p-2.5 rounded-xl">
      </div>

      <div>
        <label class="block text-slate-300 mb-1">เรือนเคหาสน์ในมนุษยโลก (ที่อยู่ส่งวัตถุมงคล):</label>
        <textarea id="m-address" rows="2" placeholder="ที่อยู่รับพัสดุมงคลให้ถึงมือโดยสวัสดิภาพ" class="soul-input w-full p-2.5 rounded-xl"></textarea>
      </div>

      <button id="btn-save" onclick="blessAndRegisterSoul()" class="btn-naga-bless w-full py-3.5 text-xs shadow-xl mt-3 flex items-center justify-center gap-1.5">
        <span>✨ ประทับตราจิต & อัญเชิญบัตรแก้วเข้า LINE</span>
      </button>
    </div>
  </div>

  <script>
    const API_URL = typeof getMasterApiUrl === "function" ? getMasterApiUrl() : "https://script.google.com/macros/s/AKfycbwBK-NcHXTiaoVhJyBxB3fMVGFj9x8lSjvU1ECL6pzmjjIWLFqgN-94ny9niIjtow9B/exec";
    const MY_LIFF_ID = "2007499712-B0uid9G3";

    let currentUserId = "GUEST_USER";

    window.onload = function() {
      initLiffSoul();
    };

    function initLiffSoul() {
      if (typeof liff !== "undefined") {
        liff.init({ liffId: MY_LIFF_ID }).then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile().then(p => {
              currentUserId = p.userId;
              if (p.pictureUrl) {
                document.getElementById("soul-avatar").src = p.pictureUrl;
              }
              const nameInput = document.getElementById("m-name");
              if (!nameInput.value) nameInput.value = p.displayName || "";
              
              // หยั่งรู้อดีตชาติจากชีตทันทีผ่าน User ID
              recallPastSoul(currentUserId);
            });
          }
        }).catch(() => {
          document.getElementById("sync-status").innerText = "สายญาณออฟไลน์";
        });
      }
    }

    function recallPastSoul(uid) {
      document.getElementById("sync-status").innerText = "กำลังเปิดบัญชีแก้ว...";
      fetch(`${API_URL}?action=get_member_profile&userId=${encodeURIComponent(uid)}`)
        .then(r => r.json())
        .then(res => {
          if (res.status === "success" && res.member) {
            const m = res.member;
            document.getElementById("m-name").value = m.name || "";
            document.getElementById("m-phone").value = m.phone || "";
            document.getElementById("m-email").value = m.email || "";
            document.getElementById("m-address").value = m.address || "";

            document.getElementById("soul-name").innerText = m.name || "ผู้ถือบัญชี";
            document.getElementById("soul-phone").innerText = m.phone || "-";
            document.getElementById("soul-code").innerText = m.memberCode || "NAGA-SOUL";
            document.getElementById("soul-balance").innerText = "฿" + Number(m.balance || 0).toLocaleString() + " มณี";
            document.getElementById("soul-privilege").innerText = m.privilege || "วรรณะนาคารัตนบารมี";

            document.getElementById("sync-status").innerText = "ผูกดวงจิตสมบูรณ์ ✅";
          } else {
            document.getElementById("sync-status").innerText = "ดวงจิตใหม่พร้อมจารึก ✨";
          }
        })
        .catch(() => {
          document.getElementById("sync-status").innerText = "พร้อมเข้าสู่พิธี";
        });
    }

    function blessAndRegisterSoul() {
      const name = document.getElementById("m-name").value.trim();
      const phone = document.getElementById("m-phone").value.trim();
      const email = document.getElementById("m-email").value.trim();
      const address = document.getElementById("m-address").value.trim();

      if (!name || !phone) {
        return alert("กรุณาจารึกนามและเบอร์ติดต่อเพื่อผูกจิตสู่บาดาลครับ");
      }

      const btn = document.getElementById("btn-save");
      btn.disabled = true;
      btn.innerText = "กำลังสถิตนามลงบัญชีแก้ว...";

      const payload = {
        action: "register_member",
        userId: currentUserId,
        name: name,
        phone: phone,
        email: email,
        address: address
      };

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(r => r.json())
      .then(res => {
        btn.disabled = false;
        btn.innerText = "✨ ประทับตราจิต & อัญเชิญบัตรแก้วเข้า LINE";

        if (res.status === "success") {
          alert(`🐍 สลักนามลงคลังแก้วสำเร็จ!\nสังข์ประจำกาย: [${res.memberCode}]\nบัตรแก้วรัตนบารมีได้สำแดงขึ้นในห้องแชท LINE แล้วครับ`);

          if (typeof liff !== "undefined" && liff.isInClient()) {
            liff.closeWindow(); // ปิดทวารบาดาลกลับสู่ห้องแชททันที
          }
        } else {
          alert("วิบากขัดข้อง: " + (res.message || "ไม่สามารถจารึกได้"));
        }
      })
      .catch(() => {
        btn.disabled = false;
        btn.innerText = "✨ ประทับตราจิต & อัญเชิญบัตรแก้วเข้า LINE";
        alert("สายใยญาณสะดุด กรุณาลองใหม่อีกครั้ง");
      });
    }
  </script>
</body>
</html>
