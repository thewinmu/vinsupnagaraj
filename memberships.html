<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>บัตรแก้วรัตนบารมี - วินทร์ทรัพย์นาคราช</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', '-apple-system', 'sans-serif'] },
          colors: {
            mysticBg: { DEFAULT: '#08231C', light: '#0D382D', deep: '#051913' },
            nagaEmerald: { DEFAULT: '#105B43', deep: '#063828', glow: '#16805E', light: '#A7F3D0' },
            auroraGold: { light: '#FEF08A', DEFAULT: '#FBBF24', amber: '#F59E0B', border: '#E6CA65' }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at 50% 0%, #104234 0%, #08261E 50%, #051A14 100%);
      color: #F3F4F6;
      min-height: 100vh;
      transition: background 0.5s ease, color 0.5s ease;
    }
    .glass-mystic {
      background: rgba(9, 39, 31, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(230, 202, 101, 0.45);
    }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-center items-center pb-24">

  <div class="w-full max-w-sm space-y-4">
    <!-- Luxury Card -->
    <div class="relative overflow-hidden rounded-[28px] p-5 bg-gradient-to-br from-mysticBg-light via-mysticBg to-mysticBg-deep border-2 border-auroraGold-border shadow-2xl">
      <div class="absolute -top-10 -right-10 w-40 h-40 rounded-full bg-auroraGold-bright/25 blur-2xl pointer-events-none"></div>

      <div class="relative z-10 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-mysticBg-deep to-nagaEmerald p-0.5 border border-auroraGold-border flex items-center justify-center shadow-md">
            <span class="text-xl">🐍</span>
          </div>
          <div>
            <h2 class="text-[10px] font-black tracking-wider text-auroraGold-bright uppercase leading-none">
              SHOP@วินทร์ทรัพย์นาคราช
            </h2>
            <p class="text-xs font-black text-white mt-0.5">บัตรแก้วรัตนบารมี</p>
          </div>
        </div>
        <span class="px-2.5 py-0.5 rounded-full text-[9px] font-black text-mysticBg-deep bg-auroraGold-bright border border-auroraGold-border shadow-sm">
          VIP นาคา
        </span>
      </div>

      <div class="relative z-10 mt-5 space-y-1">
        <span class="text-[10px] font-bold text-stone-300 uppercase tracking-wider block">ผู้ถือครองบัญชีมงคล</span>
        <p id="card-holder-name" class="text-base font-black text-white tracking-tight">ผู้ศรัทธาบารมี</p>
        <p id="card-member-code" class="text-xs font-mono font-black text-auroraGold-bright tracking-widest">NAGA-••••••</p>
      </div>

      <div class="relative z-10 mt-4 pt-3 border-t border-white/10 flex justify-between items-end">
        <div>
          <span class="text-[9px] font-bold text-stone-300 block">วรรณะบารมี</span>
          <span id="card-privilege" class="text-xs font-black text-nagaEmerald-light">วรรณะนาคารัตนบารมี</span>
        </div>
        <div>
          <span class="text-[9px] font-bold text-stone-300 block text-right">ทรัพย์มณีคงคลัง</span>
          <span id="card-balance" class="text-xs font-black text-auroraGold-bright text-right block">฿0 มณี</span>
        </div>
      </div>
    </div>

    <!-- Form -->
    <div class="glass-mystic rounded-[28px] p-5 shadow-lg border border-auroraGold-border/40 space-y-3">
      <h3 class="text-xs font-black text-auroraGold-light uppercase flex items-center gap-1.5">
        <span>✍️</span> จารึกข้อมูลผู้ถือครองบัญชี
      </h3>

      <div>
        <label class="text-[11px] font-bold text-stone-300 block mb-1">ชื่อ - นามสกุล *</label>
        <input type="text" id="member-name" placeholder="ระบุชื่อ-นามสกุลจริง" class="w-full text-xs font-medium px-3.5 py-2.5 rounded-2xl border border-auroraGold-border/40 focus:outline-none focus:border-auroraGold-bright bg-black/40 text-white">
      </div>

      <div>
        <label class="text-[11px] font-bold text-stone-300 block mb-1">เบอร์โทรศัพท์ติดต่อ *</label>
        <input type="tel" id="member-phone" placeholder="08xxxxxxxx" class="w-full text-xs font-medium px-3.5 py-2.5 rounded-2xl border border-auroraGold-border/40 focus:outline-none focus:border-auroraGold-bright bg-black/40 text-white">
      </div>

      <div>
        <label class="text-[11px] font-bold text-stone-300 block mb-1">ที่อยู่จัดส่งวัตถุมงคล / สาส์นนำทาง</label>
        <textarea id="member-address" rows="2" placeholder="ระบุที่อยู่จัดส่งโดยละเอียด" class="w-full text-xs font-medium px-3.5 py-2.5 rounded-2xl border border-auroraGold-border/40 focus:outline-none focus:border-auroraGold-bright bg-black/40 text-white"></textarea>
      </div>

      <button id="btn-submit-member" onclick="saveMemberProfile()" class="w-full bg-gradient-to-r from-nagaEmerald-glow via-nagaEmerald to-mysticBg-deep text-white font-black text-xs py-3.5 rounded-2xl shadow-md border border-auroraGold-bright hover:brightness-110 active:scale-95 transition flex items-center justify-center space-x-1.5">
        <span>✨ บันทึกและผูกจิตข้อมูลสมาชิก</span>
      </button>

      <a href="index.html" class="block text-center text-xs font-bold text-auroraGold-light hover:underline pt-1">
        ← กลับสู่หน้าร้านวัตถุมงคล
      </a>
    </div>
  </div>

  <!-- ปุ่มสวิตช์ 8 สกิน -->
  <button id="theme-switch-btn" onclick="toggleNextTheme()" class="fixed bottom-20 right-4 z-50 p-2.5 rounded-full bg-black/70 border border-auroraGold-bright text-white shadow-2xl backdrop-blur-md active:scale-90 transition-all flex items-center gap-1.5">
    <span class="text-base">🎨</span>
    <span id="current-theme-name" class="text-[10px] font-bold text-auroraGold-bright pr-1">มรกตสุวรรณภูมิ</span>
  </button>

  <script>
    const LIFF_ID = "2007499712-3e6TMnJJ";
    const API_URL = "https://script.google.com/macros/s/AKfycbzhqzmw9LkSheJD2AQTreWQY2w1Wqh0okxRMXhRelayFqHetwQCPmc877YJCPnd6P6w/exec";

    const THEME_LIST = [
      { id: "emerald_gold", name: "มรกตสุวรรณภูมิ", bg: "radial-gradient(circle at 50% 0%, #104234 0%, #08261E 50%, #051A14 100%)", text: "#F3F4F6" },
      { id: "obsidian_night", name: "มณีรัตน์ราตรี", bg: "radial-gradient(circle at 50% 0%, #0D2B23 0%, #071612 60%, #030A08 100%)", text: "#F3F4F6" },
      { id: "pearl_platinum", name: "เพชรนาคินทร์ไข่มุก", bg: "radial-gradient(circle at 50% 0%, #FFFFFF 0%, #FAF8F5 45%, #EAF2EE 100%)", text: "#0E1310" },
      { id: "solar_bronze", name: "สุริยันจันทราคราช", bg: "radial-gradient(circle at 50% 0%, #2D220B 0%, #1E1606 60%, #0F0A02 100%)", text: "#F3F4F6" },
      { id: "lotus_ruby", name: "นาคีบงกชแก้ว", bg: "radial-gradient(circle at 50% 0%, #2A1620 0%, #1A0F14 60%, #0D060A 100%)", text: "#F3F4F6" },
      { id: "deep_sea_sapphire", name: "สมุทรนพรัตน์", bg: "radial-gradient(circle at 50% 0%, #0C2B3B 0%, #061A24 60%, #020D13 100%)", text: "#F3F4F6" },
      { id: "crimson_ruby", name: "เพลิงสุวรรณกาล", bg: "radial-gradient(circle at 50% 0%, #2B1212 0%, #180A0A 60%, #0B0404 100%)", text: "#F3F4F6" },
      { id: "imperial_diamond", name: "มหาจักรพรรดิรัตน", bg: "radial-gradient(circle at 50% 0%, #161F2C 0%, #0D1117 60%, #05080C 100%)", text: "#F3F4F6" }
    ];

    function toggleNextTheme() {
      let currentId = localStorage.getItem("vinsup_theme_id") || "emerald_gold";
      let currentIndex = THEME_LIST.findIndex(t => t.id === currentId);
      let nextIndex = (currentIndex + 1) % THEME_LIST.length;
      applyTheme(THEME_LIST[nextIndex].id);
    }

    function applyTheme(themeId) {
      const theme = THEME_LIST.find(t => t.id === themeId) || THEME_LIST[0];
      localStorage.setItem("vinsup_theme_id", theme.id);
      document.body.style.background = theme.bg;
      document.body.style.color = theme.text;
      const label = document.getElementById("current-theme-name");
      if (label) label.innerText = theme.name;
    }

    let currentUserId = "";

    window.addEventListener("DOMContentLoaded", async () => {
      let savedThemeId = localStorage.getItem("vinsup_theme_id") || "emerald_gold";
      applyTheme(savedThemeId);

      try {
        if (typeof liff !== "undefined") {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            currentUserId = profile.userId;
            loadMemberData(currentUserId);
          } else {
            liff.login();
          }
        }
      } catch (err) {}
    });

    async function loadMemberData(uid) {
      try {
        const res = await fetch(`${API_URL}?action=get_member_profile&userId=${encodeURIComponent(uid)}`);
        const data = await res.json();
        if (data.status === "success" && data.member) {
          const m = data.member;
          document.getElementById("card-holder-name").innerText = m.name !== "-" ? m.name : "ผู้ศรัทธาบารมี";
          document.getElementById("card-member-code").innerText = m.memberCode;
          document.getElementById("card-privilege").innerText = m.privilege || "วรรณะนาคารัตนบารมี";
          document.getElementById("card-balance").innerText = `฿${Number(m.balance || 0).toLocaleString()} มณี`;

          document.getElementById("member-name").value = m.name !== "-" ? m.name : "";
          document.getElementById("member-phone").value = m.phone !== "-" ? m.phone : "";
          document.getElementById("member-address").value = m.address !== "-" ? m.address : "";
          document.getElementById("btn-submit-member").innerText = "✨ อัปเดตข้อมูลบัตรสมาชิก";
        }
      } catch (e) {}
    }

    async function saveMemberProfile() {
      const name = document.getElementById("member-name").value.trim();
      const phone = document.getElementById("member-phone").value.trim();
      const address = document.getElementById("member-address").value.trim();

      if (!name || !phone) {
        alert("กรุณาระบุชื่อ-นามสกุล และเบอร์โทรศัพท์ครับ");
        return;
      }

      if (!currentUserId) {
        alert("กรุณาเปิดผ่านแอป LINE เพื่อดึงรหัส User ID ครับ");
        return;
      }

      const btn = document.getElementById("btn-submit-member");
      btn.disabled = true;
      btn.innerText = "กำลังจารึกข้อมูลมงคล...";

      const payload = {
        action: "register_member",
        userId: currentUserId,
        name: name,
        phone: phone,
        address: address,
        email: "-"
      };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === "success") {
          setTimeout(() => {
            if (typeof liff !== "undefined" && liff.isInClient()) {
              liff.closeWindow();
            } else {
              alert("✅ บันทึกข้อมูลสำเร็จ! ระบบได้ส่งบัตรแก้วรัตนบารมีเข้าแชท LINE เรียบร้อยแล้วครับ");
              loadMemberData(currentUserId);
              btn.disabled = false;
            }
          }, 300);
        } else {
          alert("แจ้งเตือน: " + (result.message || "บันทึกไม่สำเร็จ"));
          btn.disabled = false;
        }
      } catch (err) {
        alert("สายสัญญาณขัดข้อง กรุณาลองใหม่อีกครั้ง");
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
