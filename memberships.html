<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>บัญชีผู้ศรัทธา • วินทร์ทรัพย์นาคราช</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #022c22 0%, #03120e 50%, #000000 100%);
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
    }
    .gold-text {
      background: linear-gradient(135deg, #ffffff 0%, #fef08a 60%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card-emerald-glossy {
      background: linear-gradient(135deg, rgba(6, 78, 59, 0.45) 0%, rgba(2, 44, 34, 0.75) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .btn-gold-glow {
      background: linear-gradient(135deg, #fef08a 0%, #ca8a04 100%);
      color: #022c22;
      font-weight: 700;
      border-radius: 9999px;
      box-shadow: 0 4px 20px rgba(202, 138, 4, 0.4);
      transition: all 0.2s ease;
    }
    .btn-gold-glow:active { transform: scale(0.96); }
  </style>
</head>
<body class="p-5 max-w-md mx-auto flex flex-col pb-12">

  <!-- Header -->
  <div class="flex items-center justify-between py-4 mb-2">
    <button onclick="window.location.href='./index.html'" class="text-xs font-semibold text-white px-4 py-2 rounded-full border border-white/20 bg-black/40 hover:bg-emerald-950/60 transition shadow">⟨ กลับหน้าร้าน</button>
    <div class="text-sm text-amber-200 font-bold tracking-wider">🐍 วินทร์ทรัพย์นาคราช</div>
  </div>

  <div class="text-center mb-6">
    <h1 class="text-2xl font-extrabold gold-text tracking-wide">บัญชีผู้ศรัทธา</h1>
    <p class="text-xs text-slate-400 mt-1">MEMBER PROFILE & PRIVILEGES</p>
  </div>

  <!-- หน้าจอโปรไฟล์หลัก (แสดง LINE Profile ทันทีอัตโนมัติ) -->
  <div id="profile-container" class="space-y-4">
    
    <!-- การ์ดโปรไฟล์สมาชิก -->
    <div class="card-emerald-glossy p-6 text-center shadow-xl">
      <div class="w-20 h-20 mx-auto rounded-full p-1 border-2 border-amber-400 mb-3 shadow-md bg-emerald-950 overflow-hidden flex items-center justify-center">
        <img id="line-avatar" src="" alt="Avatar" class="w-full h-full object-cover rounded-full hidden">
        <span id="default-avatar" class="text-3xl">👑</span>
      </div>
      <div class="text-xs text-slate-400 font-medium">นามผู้ศรัทธา</div>
      <div class="text-xl font-extrabold gold-text mt-1" id="member-name">กำลังเชื่อมต่อ LINE...</div>
      <div class="text-xs text-amber-300 font-bold mt-1" id="member-code">รหัส: กำลังโหลด...</div>
    </div>

    <!-- กล่องแสดงยอดทรัพย์และสิทธิ์ -->
    <div class="grid grid-cols-2 gap-3">
      <div class="card-emerald-glossy p-4 text-center">
        <div class="text-xs text-slate-300 font-medium">ยอดทรัพย์คงเหลือ</div>
        <div class="text-xl font-extrabold text-amber-300 mt-1" id="member-balance">0 ฿</div>
      </div>
      <div class="card-emerald-glossy p-4 text-center">
        <div class="text-xs text-slate-300 font-medium">สิทธิ์เสี่ยงทายฟรี</div>
        <div class="text-xl font-extrabold text-amber-300 mt-1" id="member-quota">10 ครั้ง</div>
      </div>
    </div>

    <!-- กล่องข้อมูลส่วนตัว -->
    <div class="card-emerald-glossy p-6 shadow-lg space-y-3">
      <div class="flex justify-between items-center border-b border-white/10 pb-2">
        <h3 class="text-sm font-bold text-amber-200">📋 ข้อมูลส่วนตัวและที่อยู่</h3>
      </div>
      <div class="space-y-2 text-xs text-slate-200">
        <p><b>ชื่อ - นามสกุล:</b> <span id="info-name">-</span></p>
        <p><b>เบอร์โทรศัพท์:</b> <span id="info-phone">-</span></p>
        <p><b>ที่อยู่จัดส่งวัตถุมงคล:</b> <span id="info-address">-</span></p>
      </div>
    </div>

    <!-- ✏️ ปุ่มแก้ไขข้อมูลส่วนตัว -->
    <div>
      <button onclick="window.location.href='./edit-profile.html'" class="w-full py-3 px-4 rounded-2xl flex items-center justify-center gap-2 shadow-md transition bg-black/40 border border-white/20 text-xs font-semibold text-white hover:bg-emerald-950/60">
        <span>✏️ แก้ไขข้อมูลส่วนตัว</span>
      </button>
    </div>

    <!-- 🎴 ปุ่มเข้าสู่ระบบเสี่ยงทาย Pick a Card -->
    <div>
      <button onclick="accessPickACard()" class="w-full py-3.5 px-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg transition-all duration-200" style="background: linear-gradient(135deg, #78350f 0%, #451a03 100%); border: 1px solid rgba(252, 211, 77, 0.4);">
        <span class="text-lg">🎴</span>
        <span class="text-sm font-bold text-amber-200 tracking-wide">เข้าสู่ระบบเสี่ยงทาย (Pick a Card)</span>
      </button>
    </div>

    <!-- 📅 ปุ่มจองคิวดูดวง (แสดงทุกแพ็กเกจ) -->
    <div class="mt-2 mb-2">
      <button onclick="window.location.href='./booking.html'" class="w-full py-3.5 px-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg transition-all duration-200" style="background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); border: 1px solid rgba(202, 138, 4, 0.4);">
        <span class="text-lg">📅</span>
        <span class="text-sm font-bold text-amber-200 tracking-wide">จองคิวดูดวง (แสดงทุกแพ็กเกจ)</span>
      </button>
    </div>

  </div>

  <script>
    const WEB_URL = "https://script.google.com/macros/s/AKfycbxXRJyClfhGCLyG3plwkuCBzbwsIQdPiy0X11f3EbCvL2Dj-y2sCenNFiqjMdKNoqhf/exec";
    const LIFF_ID = "2007499712-B0uid9G3";
    let isRegisteredMember = false;

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof liff !== 'undefined' && LIFF_ID) {
        liff.init({ liffId: LIFF_ID })
          .then(() => {
            if (liff.isLoggedIn()) {
              liff.getProfile().then(p => {
                loadProfileAndCheckRegistration(p.userId, p.displayName, p.pictureUrl);
              }).catch(() => {
                loadProfileAndCheckRegistration("admin_user_001", "ผู้ศรัทธา", "");
              });
            } else {
              liff.login();
            }
          })
          .catch(() => {
            loadProfileAndCheckRegistration("admin_user_001", "ผู้ศรัทธา", "");
          });
      } else {
        loadProfileAndCheckRegistration("admin_user_001", "ผู้ศรัทธา", "");
      }
    });

    // โหลดแสดง LINE Profile และตรวจสอบข้อมูลกับ Google Sheets
    function loadProfileAndCheckRegistration(userId, displayName, pictureUrl) {
      if (pictureUrl) {
        const avatarImg = document.getElementById('line-avatar');
        avatarImg.src = pictureUrl;
        avatarImg.classList.remove('hidden');
        document.getElementById('default-avatar').classList.add('hidden');
      }

      // แสดงชื่อจาก LINE ให้เห็นทันที
      document.getElementById('member-name').innerText = displayName;

      // ดึงข้อมูลสมาชิกจากระบบหลังบ้าน
      fetch(`${WEB_URL}?action=login_or_register&userId=${encodeURIComponent(userId)}&name=${encodeURIComponent(displayName)}`)
        .then(r => r.json())
        .then(res => {
          if (res && res.status === "success") {
            isRegisteredMember = true;

            document.getElementById('member-name').innerText = res.name || displayName;
            document.getElementById('member-code').innerText = "รหัส: " + (res.memberCode || "B001");
            document.getElementById('member-balance').innerText = (res.balance || 0) + " ฿";
            document.getElementById('member-quota').innerText = (res.freeQuota || 10) + " ครั้ง";
            
            document.getElementById('info-name').innerText = res.name || displayName;
            document.getElementById('info-phone').innerText = res.phone || "-";
            document.getElementById('info-address').innerText = res.address || "-";
          }
        })
        .catch(err => console.error("Error loading data:", err));
    }

    // ฟังก์ชันเข้าใช้งาน Pick a Card
    function accessPickACard() {
      if (isRegisteredMember) {
        window.location.href = './pickacard.html';
      } else {
        window.location.href = './pickacard.html';
      }
    }
  </script>
</body>
</html>
