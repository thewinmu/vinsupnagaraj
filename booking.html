<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>จองคิวดูดวงญาณนาคราช • วินทร์ทรัพย์นาคราช</title>
  
  <script src="./config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-deep: #021a14;
      --pearl-cream: #fbfbee;
      --gold-bright: #fef9c3;
      --gold-mid: #fef08a;
      --gold-dark: #ca8a04;
      --glossy-card: linear-gradient(145deg, rgba(4, 41, 31, 0.88) 0%, rgba(2, 16, 12, 0.96) 100%);
    }

    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at 50% 0%, #064e3b 0%, var(--bg-deep) 45%, #010c09 100%);
      color: var(--pearl-cream);
      min-height: 100vh;
      margin: 0;
    }

    .bright-white-gold-text {
      background: linear-gradient(135deg, #ffffff 0%, var(--gold-bright) 30%, var(--gold-mid) 65%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(254, 249, 195, 0.45);
    }

    .glossy-panel {
      background: var(--glossy-card);
      border: 1px solid rgba(254, 240, 138, 0.28);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .custom-input {
      background: rgba(2, 22, 17, 0.85);
      border: 1px solid rgba(254, 240, 138, 0.35);
      color: var(--pearl-cream);
      transition: all 0.25s ease;
    }
    .custom-input:focus {
      outline: none;
      border-color: #fef08a;
      box-shadow: 0 0 16px rgba(254, 240, 138, 0.4);
    }

    .slot-available {
      background: rgba(4, 41, 31, 0.7);
      border: 1px solid rgba(254, 240, 138, 0.3);
      color: var(--pearl-cream);
    }
    .slot-available:hover {
      border-color: #fef08a;
      background: rgba(6, 78, 59, 0.85);
      transform: translateY(-2px);
    }
    .slot-selected {
      background: linear-gradient(135deg, #fef08a 0%, #ca8a04 100%) !important;
      color: #022c22 !important;
      font-weight: 700;
      border-color: #ffffff !important;
      box-shadow: 0 0 20px rgba(254, 240, 138, 0.8) !important;
    }
    .slot-disabled {
      background: rgba(20, 30, 25, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ef4444;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .btn-gold-action {
      background: linear-gradient(135deg, #ffffff 0%, #fef08a 35%, #eab308 70%, #a16207 100%);
      color: #032018;
      box-shadow: 0 8px 25px rgba(234, 179, 8, 0.45);
      transition: all 0.25s ease;
    }
  </style>
</head>
<body class="p-4 sm:p-6 max-w-lg mx-auto flex flex-col pb-28">

  <div class="flex items-center justify-between py-3 mb-4">
    <button onclick="window.location.href='./index.html'" class="text-xs text-pearl-cream bg-black/60 border border-amber-300/30 px-4 py-2 rounded-full hover:border-amber-300 transition shadow-md">
      ⟨ กลับหน้าร้าน
    </button>
    <a href="https://www.tiktok.com/@thewinmu" target="_blank" class="text-xs text-amber-200 border border-amber-300/30 px-3 py-1.5 rounded-full bg-black/40">
      🎵 TikTok @thewinmu
    </a>
  </div>

  <div class="text-center mb-6 relative">
    <div class="relative w-16 h-16 mx-auto mb-2 rounded-full p-0.5 bg-gradient-to-tr from-amber-400 via-emerald-500 to-amber-200 shadow-[0_0_20px_rgba(254,240,138,0.55)]">
      <div class="w-full h-full rounded-full bg-black/80 flex items-center justify-center overflow-hidden">
        <img src="./logo.png" alt="วินทร์ทรัพย์นาคราช" class="w-full h-full object-contain p-1">
      </div>
    </div>
    <h1 class="text-2xl sm:text-3xl font-extrabold bright-white-gold-text mb-1">จองคิวตรวจดวงชะตา</h1>
    <p class="text-xs text-emerald-200/90 tracking-wider">จัดสรรเวลา 15 นาที • ตรวจนับคิวแบบวันต่อวัน</p>
  </div>

  <div class="glossy-panel rounded-3xl p-5 sm:p-6 space-y-5">
    <div>
      <label class="block text-xs font-bold text-amber-200 mb-2 flex items-center gap-1.5">
        <span>📜</span> 1. เลือกแพ็กเกจบริการ
      </label>
      <select id="service-select" onchange="onServiceChanged()" class="custom-input w-full p-3.5 rounded-xl text-xs sm:text-sm"></select>
      <div id="service-desc" class="text-[11px] text-emerald-300/80 mt-1.5 px-1 font-light"></div>
    </div>

    <div>
      <label class="block text-xs font-bold text-amber-200 mb-2 flex items-center gap-1.5">
        <span>📅</span> 2. เลือกวันที่เปิดรับญาณ (จัดการวันต่อวัน)
      </label>
      <input type="date" id="booking-date" onchange="loadAvailableSlots()" class="custom-input w-full p-3.5 rounded-xl text-xs sm:text-sm cursor-pointer">
    </div>

    <div>
      <div class="flex justify-between items-center mb-2">
        <label class="text-xs font-bold text-amber-200 flex items-center gap-1.5">
          <span>⏳</span> 3. เลือกรอบเวลาว่าง (15 นาที/รอบ)
        </label>
        <span id="slot-status-label" class="text-[10px] text-emerald-300">เลือกรอบเวลา</span>
      </div>
      <div id="slots-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-52 overflow-y-auto p-1"></div>
    </div>

    <div class="border-t border-amber-300/20 pt-4 space-y-3">
      <div>
        <label class="block text-xs text-slate-300 mb-1">ชื่อ-นามสกุล / ชื่อเล่น</label>
        <input type="text" id="cust-name" placeholder="ชื่อผู้รับคำพยากรณ์" class="custom-input w-full p-3 rounded-xl text-xs">
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1">เบอร์โทร หรือ LINE ID</label>
        <input type="tel" id="cust-phone" placeholder="เช่น 0812345678" class="custom-input w-full p-3 rounded-xl text-xs">
      </div>
      <div>
        <label class="block text-xs text-slate-300 mb-1">เรื่องที่ต้องการถามล่วงหน้า</label>
        <textarea id="cust-note" rows="2" placeholder="เช่น การงาน การเงิน ความรัก" class="custom-input w-full p-3 rounded-xl text-xs resize-none"></textarea>
      </div>
    </div>

    <div class="pt-2">
      <div class="flex justify-between items-center mb-4 px-1">
        <span class="text-xs text-emerald-200">ยอดค่าบูชาครู:</span>
        <span id="display-price" class="text-xl font-extrabold bright-white-gold-text">0 บาท</span>
      </div>

      <button id="btn-submit" onclick="submitBooking()" class="btn-gold-action w-full py-4 rounded-2xl font-extrabold text-sm uppercase tracking-wider">
        ✨ ยืนยันการจองคิวมงคล
      </button>
    </div>
  </div>

  <div id="result-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="glossy-panel border-2 border-amber-300/80 rounded-3xl p-6 text-center max-w-sm w-full shadow-2xl">
      <div id="modal-icon" class="text-4xl mb-3">🙏</div>
      <h3 id="modal-title" class="text-lg font-bold bright-white-gold-text mb-2">ผลการจองคิว</h3>
      <p id="modal-desc" class="text-xs text-slate-200 leading-relaxed mb-5 whitespace-pre-line">-</p>
      <button onclick="closeModalAndRedirect()" class="btn-gold-action w-full py-3 rounded-xl text-xs font-bold">
        ตกลง / ปิดหน้าต่าง
      </button>
    </div>
  </div>

  <script>
    const WEB_URL = typeof getMasterApiUrl === "function" ? getMasterApiUrl() : "https://script.google.com/macros/s/AKfycbwBK-NcHXTiaoVhJyBxB3fMVGFj9x8lSjvU1ECL6pzmjjIWLFqgN-94ny9niIjtow9B/exec";

    let selectedSlot = "";
    let selectedPrice = 0;

    window.onload = function() {
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      const yyyy = tomorrow.getFullYear();
      const mm = String(tomorrow.getMonth() + 1).padStart(2, '0');
      const dd = String(tomorrow.getDate()).padStart(2, '0');
      
      const dInput = document.getElementById("booking-date");
      dInput.min = `${yyyy}-${mm}-${dd}`;
      dInput.value = `${yyyy}-${mm}-${dd}`;

      loadServices();
    };

    function loadServices() {
      fetch(`${WEB_URL}?action=get_services`)
        .then(r => r.json())
        .then(res => {
          const select = document.getElementById("service-select");
          select.innerHTML = "";
          let list = (res.status === "success" && res.services.length > 0) ? res.services : [
            { name: "ดูดวงญาณนาคราช 15 นาที", price: 108, description: "เปิดมิติชะตาการงาน การเงิน ความรัก และวิธีแก้เคล็ดเฉพาะบุคคล" }
          ];

          list.forEach((s, idx) => {
            const opt = document.createElement("option");
            opt.value = s.name;
            opt.dataset.price = s.price;
            opt.dataset.desc = s.description;
            opt.innerText = `${s.name} (฿${s.price.toLocaleString()})`;
            if (idx === 0) opt.selected = true;
            select.appendChild(opt);
          });
          onServiceChanged();
          loadAvailableSlots();
        }).catch(() => {
          onServiceChanged();
          loadAvailableSlots();
        });
    }

    function onServiceChanged() {
      const select = document.getElementById("service-select");
      if (select.selectedIndex === -1) return;
      const opt = select.options[select.selectedIndex];
      selectedPrice = Number(opt.dataset.price || 0);
      document.getElementById("display-price").innerText = `${selectedPrice.toLocaleString()} บาท`;
      document.getElementById("service-desc").innerText = opt.dataset.desc || "บริการจัดสรรเวลา 15 นาที";
    }

    function loadAvailableSlots() {
      const dateVal = document.getElementById("booking-date").value;
      const grid = document.getElementById("slots-grid");
      grid.innerHTML = `<div class="col-span-full py-4 text-center text-xs text-amber-200 animate-pulse">กำลังตรวจสอบคิวว่าง...</div>`;
      selectedSlot = "";

      fetch(`${WEB_URL}?action=get_time_slots&date=${encodeURIComponent(dateVal)}`)
        .then(r => r.json())
        .then(res => {
          grid.innerHTML = "";
          if (res.status === "success" && res.slots.length > 0) {
            res.slots.forEach(s => {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = `p-3 rounded-xl text-xs font-semibold ${s.available ? 'slot-available' : 'slot-disabled'}`;
              btn.innerText = s.available ? s.time : `${s.time} (เต็ม)`;
              if (s.available) {
                btn.onclick = () => {
                  document.querySelectorAll("#slots-grid button").forEach(b => b.classList.remove("slot-selected"));
                  btn.classList.add("slot-selected");
                  selectedSlot = s.time;
                };
              } else {
                btn.disabled = true;
              }
              grid.appendChild(btn);
            });
          }
        });
    }

    function submitBooking() {
      const serviceName = document.getElementById("service-select").value;
      const bookingDate = document.getElementById("booking-date").value;
      const custName = document.getElementById("cust-name").value.trim();
      const custPhone = document.getElementById("cust-phone").value.trim();
      const custNote = document.getElementById("cust-note").value.trim();

      if (!bookingDate || !selectedSlot || !custName) {
        alert("กรุณาเลือกวัน รอบเวลา และระบุชื่อให้ครบถ้วนครับ");
        return;
      }

      const btn = document.getElementById("btn-submit");
      btn.disabled = true;
      btn.innerText = "กำลังตรวจสอบและบันทึกคิว...";

      const params = new URLSearchParams({
        action: "submit_booking",
        serviceName: serviceName,
        bookingDate: bookingDate,
        slotTime: selectedSlot,
        price: selectedPrice,
        name: custName,
        phone: custPhone,
        note: custNote
      });

      fetch(`${WEB_URL}?${params.toString()}`)
        .then(r => r.json())
        .then(res => {
          btn.disabled = false;
          btn.innerText = "✨ ยืนยันการจองคิวมงคล";

          if (res.status === "success") {
            showModal("🙏", "บันทึกการจองสำเร็จ", `คิวของคุณได้รับการยืนยันแล้ว:\nวันที่: ${bookingDate}\nรอบเวลา: ${selectedSlot}\n\nกรุณาส่งสลิปค่าครูผ่าน LINE เพื่อความสมบูรณ์ครับ`);
          } else if (res.status === "full") {
            showModal("⚠️", "คิวจองเต็มแล้ว", res.message);
            loadAvailableSlots();
          } else {
            showModal("❌", "แจ้งเตือน", res.message || "เกิดข้อผิดพลาด");
          }
        });
    }

    function showModal(icon, title, desc) {
      document.getElementById("modal-icon").innerText = icon;
      document.getElementById("modal-title").innerText = title;
      document.getElementById("modal-desc").innerText = desc;
      document.getElementById("result-modal").classList.remove("hidden");
    }

    function closeModalAndRedirect() {
      document.getElementById("result-modal").classList.add("hidden");
      if (document.getElementById("modal-title").innerText.includes("สำเร็จ")) {
        window.location.href = "./index.html";
      }
    }
  </script>
</body>
</html>
