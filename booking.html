<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจองคิวพยากรณ์ | วินทร์ทรัพย์นาคราช</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F8FAFC; color: #0F172A; font-weight: 500; }
    .corporate-gradient { background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%); }
    .gold-accent { color: #B45309; }
    .gold-border { border-color: rgba(180, 83, 9, 0.25); }
    .executive-card { background: #FFFFFF; border: 1px solid #E2E8F0; border-left: 4px solid #B45309; box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05); }
    .executive-btn { background: #0F172A; color: #FFFFFF; transition: all 0.2s ease; }
    .executive-btn:hover { background: #1E293B; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4 max-w-md mx-auto justify-between">
  
  <div>
    <header class="text-center py-6 border-b gold-border mb-6 bg-white rounded-2xl shadow-sm px-4">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl corporate-gradient border gold-border mb-2 shadow-sm">
        <span class="text-xl">🐉</span>
      </div>
      <p class="text-[10px] tracking-[0.3em] gold-accent uppercase font-bold">THE WIN MU ENTERPRISE</p>
      <h1 class="text-lg font-bold text-slate-900 mt-1 tracking-wide">วินทร์ทรัพย์นาคราช</h1>
      <p class="text-xs text-slate-500 mt-0.5 font-normal">ระบบจองคิวบริการพยากรณ์และปรึกษาธุรกิจ</p>
      
      <div id="member-badge" class="mt-3 inline-block bg-slate-50 border border-slate-200 px-4 py-1.5 rounded-lg text-xs text-slate-700 font-semibold shadow-inner">
        กำลังโหลดข้อมูลสมาชิก...
      </div>
    </header>

    <!-- รายการแพ็กเกจ (กรณีเลือกแบบอิสระ) -->
    <div id="step-packages" class="space-y-3.5">
      <div class="text-center text-xs text-slate-400 py-10 font-normal">กำลังโหลดรายการบริการ...</div>
    </div>

    <!-- เลือกรอบวันเวลา (เปลี่ยนช่องเลือกวันที่เป็นแบบ Dropdown 15 วัน) -->
    <div id="step-datetime" style="display: none;" class="space-y-4">
      <button id="back-btn" onclick="backToPackages()" class="text-slate-600 text-xs font-bold flex items-center gap-1 mb-2 hover:text-slate-900">❮ กลับไปเลือกบริการอื่น</button>
      <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
        <p class="text-[11px] text-slate-500 font-medium uppercase tracking-wider">บริการที่เลือก</p>
        <p id="selected-pkg-name" class="text-sm font-bold text-slate-900 mt-1"></p>
      </div>
      <div>
        <label class="text-xs text-slate-700 block mb-2 font-bold">เลือกวันที่ต้องการ (ล่วงหน้า 15 วัน)</label>
        <select id="booking-date" onchange="checkSlots()" class="w-full bg-white border border-slate-300 rounded-xl p-3 text-sm text-slate-900 font-semibold focus:outline-none focus:ring-2 focus:ring-slate-900/10 shadow-sm">
          <option value="">-- กรุณาเลือกวันที่ต้องการจอง --</option>
        </select>
      </div>
      <div>
        <label class="text-xs text-slate-700 block mb-2 font-bold">สถานะรอบเวลา 09:00 - 22:00 น. (🟩 ว่าง | 🟥 เต็ม)</label>
        <div id="slots-container" class="grid grid-cols-2 gap-2.5 max-h-60 overflow-y-auto p-1">
          <p class="text-xs text-slate-400 col-span-2 py-6 text-center font-normal">กรุณาเลือกวันที่ด้านบนเพื่อตรวจสอบรอบเวลา</p>
        </div>
      </div>
    </div>
  </div>

  <div id="action-box" style="display: none;" class="mt-8">
    <button onclick="submitBooking()" class="w-full executive-btn font-bold py-4 rounded-xl text-sm shadow-lg tracking-wide active:scale-95">ยืนยันการจองคิว & รับใบสรุปยอดโอน</button>
  </div>

  <footer class="text-center text-[11px] text-slate-400 py-6 border-t border-slate-200 mt-8 font-normal">
    The Win Mu Enterprise © 2026 — All Rights Reserved.
  </footer>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzejrRwZ6pqYq613-LrpdxtMcZHopcuMOA-3SLCzxHdaGtu5uwMdvpdhv8xWEHloYc1hA/exec";
    let currentUserId = "U8065e05dc54f0ddc3fb46e97492eb53a";
    let memberInfo = { memberCode: "M0000", name: "ท่านผู้มีเกียรติ" };
    let bookingData = { packageName: "", price: 0, bookingDate: "", bookingTime: "" };
    let isDirectSelection = false;

    window.onload = async function() {
      try {
        await liff.init({ liffId: "2007499712-B0uid9G3" });
        if (liff.isLoggedIn()) {
          currentUserId = (await liff.getProfile()).userId;
        }
      } catch (e) {}
      
      fetchMemberData();
      generateDateDropdown();

      const urlParams = new URLSearchParams(window.location.search);
      const directPkg = urlParams.get('pkg');
      const directPrice = urlParams.get('price');

      if (directPkg && directPrice) {
        isDirectSelection = true;
        selectPackage(directPkg, Number(directPrice));
        document.getElementById('back-btn').style.display = 'none';
      } else {
        fetchPackages();
      }
    };

    // สร้างตัวเลือกวันที่แบบ Dropdown ล่วงหน้า 15 วัน
    function generateDateDropdown() {
      const select = document.getElementById('booking-date');
      const thaiDays = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
      const thaiMonths = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

      for (let i = 0; i < 15; i++) {
        let d = new Date();
        d.setDate(d.getDate() + i);
        
        let year = d.getFullYear();
        let month = String(d.getMonth() + 1).padStart(2, '0');
        let day = String(d.getDate()).padStart(2, '0');
        let dateValue = `${year}-${month}-${day}`; // รูปแบบส่งค่าหลังบ้าน YYYY-MM-DD

        let dayName = thaiDays[d.getDay()];
        let monthName = thaiMonths[d.getMonth()];
        let displayStr = `วัน${dayName}ที่ ${d.getDate()} ${monthName} ${year + 543}`;

        let opt = document.createElement('option');
        opt.value = dateValue;
        opt.innerText = displayStr;
        select.appendChild(opt);
      }
    }

    function fetchMemberData() {
      fetch(WEB_APP_URL + "?action=get_member&userId=" + currentUserId)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success" && data.member) {
            memberInfo = data.member;
            document.getElementById('member-badge').innerText = "👤 " + memberInfo.name + " (" + memberInfo.memberCode + ")";
          }
        });
    }

    function fetchPackages() {
      fetch(WEB_APP_URL + "?action=get_packages")
        .then(res => res.json())
        .then(data => {
          if (data.status === "success" && data.packages && data.packages.length > 0) {
            const container = document.getElementById('step-packages');
            container.innerHTML = "";
            data.packages.forEach(pkg => {
              const card = document.createElement('div');
              card.className = "executive-card rounded-xl p-4 cursor-pointer hover:border-slate-400 transition-all transform hover:-translate-y-0.5";
              card.onclick = () => selectPackage(pkg.name, pkg.price);
              card.innerHTML = `
                <div class="flex justify-between items-start gap-2">
                  <h3 class="font-bold text-sm text-slate-900">${pkg.name}</h3>
                  <span class="text-slate-900 font-bold text-xs bg-slate-100 px-2.5 py-1 rounded-md border border-slate-200 whitespace-nowrap">${pkg.price} ฿</span>
                </div>
                <p class="text-xs text-slate-500 mt-2 leading-relaxed font-normal">${pkg.description}</p>
              `;
              container.appendChild(card);
            });
          } else {
            document.getElementById('step-packages').innerHTML = '<div class="text-center text-xs text-slate-400 py-6">ไม่พบรายการบริการในระบบ</div>';
          }
        });
    }

    function selectPackage(name, price) {
      bookingData.packageName = name;
      bookingData.price = price;
      document.getElementById('step-packages').style.display = 'none';
      document.getElementById('step-datetime').style.display = 'block';
      document.getElementById('selected-pkg-name').innerText = name + " — " + price + " บาท";
    }

    function checkSlots() {
      const date = document.getElementById('booking-date').value;
      if (!date) return;
      fetch(WEB_APP_URL + "?action=check_slots&date=" + date)
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('slots-container');
          container.innerHTML = "";
          data.slots.forEach(slot => {
            const btn = document.createElement('button');
            if (slot.available) {
              btn.className = "bg-emerald-50 border border-emerald-300 p-3 rounded-xl text-xs text-emerald-900 font-bold shadow-sm transition hover:bg-emerald-100";
              btn.innerText = "🟩 " + slot.time + " (ว่าง)";
              btn.onclick = () => selectTime(slot.time, btn);
            } else {
              btn.className = "bg-slate-100 border border-slate-200 p-3 rounded-xl text-xs text-slate-400 opacity-60 cursor-not-allowed font-bold";
              btn.innerText = "🟥 " + slot.time + " (เต็ม)";
              btn.disabled = true;
            }
            container.appendChild(btn);
          });
        });
    }

    function selectTime(timeStr, btnEl) {
      bookingData.bookingTime = timeStr;
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('ring-2', 'ring-slate-900', 'bg-slate-100'));
      btnEl.classList.add('time-btn', 'ring-2', 'ring-slate-900', 'bg-slate-100');
      document.getElementById('action-box').style.display = 'block';
    }

    function backToPackages() {
      if (isDirectSelection) return;
      document.getElementById('step-datetime').style.display = 'none';
      document.getElementById('step-packages').style.display = 'block';
      document.getElementById('action-box').style.display = 'none';
    }

    function submitBooking() {
      bookingData.bookingDate = document.getElementById('booking-date').value;
      if(!bookingData.bookingDate) {
        alert("กรุณาเลือกวันที่ต้องการจองคิวก่อนครับ");
        return;
      }
      
      const payload = { action: "create_booking", userId: currentUserId, memberCode: memberInfo.memberCode, customerName: memberInfo.name, ...bookingData };

      fetch(WEB_APP_URL, { method: "post", contentType: "application/json", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            if (liff.isInClient()) {
              liff.closeWindow();
            } else {
              window.close();
            }
          } else {
            alert("❌ " + data.message);
          }
        })
        .catch(err => {});
    }
  </script>
</body>
</html>
