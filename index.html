<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>วินทร์ทรัพย์นาคราช • หน้าร้านหลัก</title>
  <script src="./config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #022c22 0%, #064e3b 40%, #09090b 100%);
      color: #fafaf9;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .gold-text {
      background: linear-gradient(135deg, #fef08a 0%, #fde047 50%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .pearl-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(234, 179, 8, 0.35);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.2);
      transition: all 0.3s ease;
    }
    .pearl-card:active { transform: scale(0.98); border-color: rgba(234, 179, 8, 0.8); }
    .naga-crest {
      filter: drop-shadow(0 0 12px rgba(234, 179, 8, 0.6));
    }
  </style>
</head>
<body class="p-5 max-w-md mx-auto flex flex-col justify-between pb-12">

  <div>
    <!-- Header สไตล์หรูหราพร้อมตราพญานาคสีทอง -->
    <div class="text-center py-6 space-y-2">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-b from-amber-200/20 to-amber-600/10 border border-amber-400/40 naga-crest mb-1">
        <span class="text-3xl">🐍</span>
      </div>
      <h1 class="text-2xl font-bold tracking-wide gold-text">วินทร์ทรัพย์นาคราช</h1>
      <p class="text-xs font-medium text-emerald-200/80 tracking-widest uppercase">✦ ศูนย์รวมศาสตร์พยากรณ์และสิ่งศักดิ์สิทธิ์ ✦</p>
    </div>

    <!-- เมนูทั้งหมดดึงจาก Google Sheets (หน้าร้าน) -->
    <div id="menu-container" class="space-y-3.5 mt-4">
      <div class="text-center py-8 text-xs text-amber-200/60 animate-pulse">กำลังอัญเชิญเมนูจากฐานข้อมูล...</div>
    </div>
  </div>

  <div class="text-center text-[10px] text-amber-100/40 pt-8 tracking-widest uppercase">
    ✨ Win Sap Nakharat Sanctuary ✨
  </div>

  <script>
    const WEB_URL = (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.WEB_URL) ? APP_CONFIG.WEB_URL : "";

    window.addEventListener('DOMContentLoaded', () => {
      fetch(`${WEB_URL}?action=get_menus`)
        .then(r => r.json())
        .then(res => {
          const container = document.getElementById('menu-container');
          container.innerHTML = "";
          const menus = (res && res.menus) ? res.menus : [];
          
          menus.forEach(m => {
            const btn = document.createElement('button');
            btn.className = "pearl-card w-full p-4 flex items-center justify-between text-left";
            btn.onclick = () => { window.location.href = m.url; };
            btn.innerHTML = `
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-400/30 flex items-center justify-center text-2xl shadow-inner">
                  ${m.icon}
                </div>
                <div>
                  <div class="text-sm font-bold text-white tracking-wide">${m.title}</div>
                  <div class="text-xs text-amber-200/70 font-normal mt-0.5">${m.desc}</div>
                </div>
              </div>
              <span class="text-amber-400 text-lg font-bold pr-1">›</span>
            `;
            container.appendChild(btn);
          });
        })
        .catch(() => {
          document.getElementById('menu-container').innerHTML = `
            <div class="pearl-card p-6 text-center">
              <div class="text-sm font-bold text-amber-300 mb-2">ไม่สามารถเชื่อมต่อเมนูได้</div>
              <button onclick="location.reload()" class="px-4 py-2 bg-amber-500 text-black font-bold text-xs rounded-full">ลองใหม่อีกครั้ง</button>
            </div>
          `;
        });
    });
  </script>
</body>
</html>
