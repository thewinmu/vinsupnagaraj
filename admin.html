<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - วินทร์ทรัพย์นาคราช</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-[#05140F] text-stone-100 min-h-screen p-4 sm:p-6">

  <div class="max-w-5xl mx-auto space-y-5">
    <!-- Header Admin -->
    <div class="flex items-center justify-between border-b border-[#E6CA65]/30 pb-4">
      <div class="flex items-center space-x-3">
        <span class="text-3xl">🐍</span>
        <div>
          <h1 class="text-base font-black text-[#FBBF24] uppercase tracking-wider">ระบบจัดการหลังบ้าน (Admin Console)</h1>
          <p class="text-xs text-stone-400">SHOP@วินทร์ทรัพย์นาคราช</p>
        </div>
      </div>
      <button onclick="loadAllMembers()" class="bg-[#105B43] border border-[#FBBF24] text-white px-4 py-2 rounded-xl text-xs font-bold hover:brightness-125 transition flex items-center gap-1.5">
        <span>🔄</span> รีเฟรชข้อมูลสมาชิก
      </button>
    </div>

    <!-- Stats Bar -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-[#0D2B23] p-4 rounded-2xl border border-[#E6CA65]/30">
        <span class="text-[10px] text-stone-400 block font-bold">จำนวนสมาชิกทั้งหมด</span>
        <span id="stat-member-count" class="text-xl font-black text-[#FBBF24]">0</span>
      </div>
    </div>

    <!-- ตารางรายชื่อสมาชิก (Member Table) -->
    <div class="bg-[#0D2B23] rounded-2xl border border-[#E6CA65]/40 overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-white/10 flex justify-between items-center">
        <h2 class="text-xs font-black text-[#FBBF24] uppercase">รายชื่อสมาชิกในระบบ (ชีต member)</h2>
        <span id="load-status" class="text-[10px] text-stone-400">พร้อมดึงข้อมูล</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-black/40 text-stone-300 border-b border-white/10">
            <tr>
              <th class="p-3">รหัสสมาชิก</th>
              <th class="p-3">ชื่อ - นามสกุล</th>
              <th class="p-3">เบอร์โทรศัพท์</th>
              <th class="p-3">ที่อยู่จัดส่ง</th>
              <th class="p-3">วรรณะบารมี</th>
              <th class="p-3">ทรัพย์มณี</th>
              <th class="p-3">วันที่ลงทะเบียน</th>
            </tr>
          </thead>
          <tbody id="member-table-body" class="divide-y divide-white/5">
            <tr>
              <td colspan="7" class="p-6 text-center text-stone-400">กำลังโหลดรายชื่อสมาชิก...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzhqzmw9LkSheJD2AQTreWQY2w1Wqh0okxRMXhRelayFqHetwQCPmc877YJCPnd6P6w/exec";

    window.addEventListener("DOMContentLoaded", loadAllMembers);

    async function loadAllMembers() {
      const statusEl = document.getElementById("load-status");
      const tbody = document.getElementById("member-table-body");
      statusEl.innerText = "กำลังประสานฐานข้อมูล...";

      try {
        const res = await fetch(`${API_URL}?action=get_all_members`);
        const data = await res.json();

        if (data.status === "success" && data.members) {
          document.getElementById("stat-member-count").innerText = data.count || data.members.length;
          
          if (data.members.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-stone-400">ยังไม่มีข้อมูลสมาชิกในชีต member</td></tr>`;
            statusEl.innerText = "ไม่พบสมาชิก";
            return;
          }

          tbody.innerHTML = data.members.map(m => `
            <tr class="hover:bg-white/5 transition">
              <td class="p-3 font-mono font-bold text-[#FBBF24]">${m.memberCode || '-'}</td>
              <td class="p-3 font-bold text-white">${m.name || '-'}</td>
              <td class="p-3 text-stone-300">${m.phone || '-'}</td>
              <td class="p-3 text-stone-300 max-w-xs truncate">${m.address || '-'}</td>
              <td class="p-3 text-emerald-300 font-bold">${m.privilege || 'วรรณะนาคา'}</td>
              <td class="p-3 text-[#FBBF24] font-bold">฿${Number(m.balance || 0).toLocaleString()}</td>
              <td class="p-3 text-stone-400 font-mono text-[10px]">${m.registerDate || '-'}</td>
            </tr>
          `).join("");

          statusEl.innerText = `โหลดสำเร็จ (${data.members.length} ท่าน)`;
        } else {
          tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-400">โหลดไม่สำเร็จ: ${data.message || ''}</td></tr>`;
          statusEl.innerText = "เกิดข้อผิดพลาด";
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-400">สายสัญญาณขัดข้อง ไม่สามารถเชื่อมต่อ API ได้</td></tr>`;
        statusEl.innerText = "เชื่อมต่อล้มเหลว";
      }
    }
  </script>
</body>
</html>
