<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>บัตรแก้วรัตนบารมี - วินทร์ทรัพย์นาคราช</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', '-apple-system', 'sans-serif'] },
          colors: {
            mysticBg: { DEFAULT: '#08231C', light: '#0D382D', deep: '#051913' },
            nagaEmerald: { DEFAULT: '#105B43', deep: '#063828', glow: '#16805E', light: '#A7F3D0' },
            auroraGold: { light: '#FEF08A', DEFAULT: '#FBBF24', amber: '#F59E0B', border: '#E6CA65' }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at 50% 0%, #104234 0%, #08261E 50%, #051A14 100%);
      color: #F3F4F6;
      min-height: 100vh;
      transition: background 0.5s ease;
    }
    .glass-mystic {
      background: rgba(9, 39, 31, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(230, 202, 101, 0.45);
    }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-center items-center pb-24">

  <div class="w-full max-w-sm space-y-4">
    <!-- หน้าบัตรแก้วรัตนบารมี -->
    <div class="relative overflow-hidden rounded-[28px] p-5 bg-gradient-to-br from-mysticBg-light via-mysticBg to-mysticBg-deep border-2 border-auroraGold-border shadow-2xl">
      <div class="absolute -top-10 -right-10 w-40 h-40 rounded-full bg-auroraGold-bright/25 blur-2xl pointer-events-none"></div>

      <div class="relative z-10 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-mysticBg-deep to-nagaEmerald p-0.5 border border-auroraGold-border flex items-center justify-center shadow-md">
            <span class="text-xl">🐍</span>
          </div>
          <div>
            <h2 class="text-[10px] font-black tracking-wider text-auroraGold-bright uppercase leading-none">
              SHOP@วินทร์ทรัพย์นาคราช
            </h2>
            <p class="text-xs font-black text-white mt-0.5">บัตรแก้วรัตนบารมี</p>
          </div>
        </div>
        <span id="card-badge" class="px-2.5 py-0.5 rounded-full text-[9px] font-black text-mysticBg-deep bg-auroraGold-bright border border-auroraGold-border shadow-sm">
          ยังไม่เป็นสมาชิก
        </span>
      </div>

      <div class="relative z-10 mt-5 space-y-1">
        <span class="text-[10px] font-bold text-stone-300 uppercase tracking-wider block">ผู้ถือครองบัญชีมงคล</span>
        <p id="card-holder-name" class="text-base font-black text-white tracking-tight">กำลังตรวจสอบสิทธิ์...</p>
        <p id="card-member-code" class="text-xs font-mono font-black text-auroraGold-bright tracking-widest">NAGA-••••••</p>
      </div>

      <div class="relative z-10 mt-4 pt-3 border-t border-white/10 flex justify-between items-end">
        <div>
          <span class="text-[9px] font-bold text-stone-300 block">วรรณะบารมี</span>
          <span id="card-privilege" class="text-xs font-black text-nagaEmerald-light">รอการสถาปนา</span>
        </div>
        <div>
          <span class="text-[9px] font-bold text-stone-300 block text-right">ทรัพย์มณีคงคลัง</span>
          <span id="card-balance" class="text-xs font-black text-auroraGold-bright text-right block">฿0 มณี</span>
        </div>
      </div>
    </div>

    <!-- ส่วนปุ่มควบคุมการสมัคร / แก้ไขข้อมูล -->
    <div id="action-box" class="space-y-3">
      <!-- กรณีที่ 1: ยังไม่เป็นสมาชิก -> แสดงปุ่มกดสมัครตัวใหญ่ ชัดเจน -->
      <button id="btn-register-action" onclick="handleRegisterClick()" class="w-full bg-gradient-to-r from-auroraGold-bright to-auroraGold-amber text-mysticBg-deep font-black text-sm py-4 rounded-2xl shadow-xl border-2 border-auroraGold-border hover:brightness-110 active:scale-95 transition flex items-center justify-center space-x-2">
        <span class="text-lg">✨</span>
        <span>กดสมัครสมาชิกสายญาณนาคราช</span>
      </button>

      <!-- กรณีที่ 2: เป็นสมาชิกแล้ว -> แสดงปุ่มเปิดฟอร์มแก้ไขข้อมูล -->
      <button id="btn-toggle-edit" onclick="toggleEditForm()" class="hidden w-full bg-gradient-to-r from-nagaEmerald-glow to-nagaEmerald text-white font-black text-xs py-3.5 rounded-2xl shadow-md border border-auroraGold-bright/60 hover:brightness-110 active:scale-95 transition flex items-center justify-center space-x-2">
        <span>✏️ แก้ไขข้อมูลส่วนตัว & ที่อยู่จัดส่ง</span>
      </button>
    </div>

    <!-- ฟอร์มแก้ไขข้อมูล (ซ่อนไว้เป็นค่าเริ่มต้น จะแสดงเมื่อกดปุ่มแก้ไขเท่านั้น) -->
    <div id="edit-form-panel" class="hidden glass-mystic rounded-[28px] p-5 shadow-lg border border-auroraGold-border/40 space-y-3">
      <div class="flex items-center justify-between border-b border-white/10 pb-2">
        <h3 class="text-xs font-black text-auroraGold-light uppercase flex items-center gap-1.5">
          <span>✍️</span> แก้ไขข้อมูลสมาชิก
        </h3>
        <button onclick="toggleEditForm()" class="text-xs text-stone-400 hover:text-white">✕ ปิด</button>
      </div>

      <div>
        <label class="text-[11px] font-bold text-stone-300 block mb-1">ชื่อ - นามสกุล *</label>
        <input type="text" id="member-name" placeholder="ระบุชื่อ-นามสกุลจริง" class="w-full text-xs font-medium px-3.5 py-2.5 rounded-2xl border border-auroraGold-border/40 focus:outline-none focus:border-auroraGold-bright bg-black/40 text-white">
      </div>

      <div>
        <label class="text-[11px] font-bold text-stone-300 block mb-1">เบอร์โทรศัพท์ติดต่อ *</label>
        <input type="tel" id="member-phone" placeholder="08xxxxxxxx" class="w-full text-xs font-medium px-3.5 py-2.5 rounded-2xl border border-auroraGold-border/40 focus:outline-none focus:border-auroraGold-bright bg-black/40 text-white">
      </div>

      <div>
        <label class="text-[11px] font-bold text-stone-300 block mb-1">ที่อยู่จัดส่งพัสดุวัตถุมงคล</label>
        <textarea id="member-address" rows="2" placeholder="ระบุบ้านเลขที่ ซอย ถนน ตำบล อำเภอ จังหวัด รหัสไปรษณีย์" class="w-full text-xs font-medium px-3.5 py-2.5 rounded-2xl border border-auroraGold-border/40 focus:outline-none focus:border-auroraGold-bright bg-black/40 text-white"></textarea>
      </div>

      <button id="btn-submit-update" onclick="saveUpdatedMemberProfile()" class="w-full bg-gradient-to-r from-auroraGold-bright to-auroraGold-amber text-mysticBg-deep font-black text-xs py-3.5 rounded-2xl shadow-md border border-auroraGold-border hover:brightness-110 active:scale-95 transition flex items-center justify-center space-x-1.5">
        <span>💾 ยืนยันการอัปเดตข้อมูล</span>
      </button>
    </div>

    <a href="index.html" class="block text-center text-xs font-bold text-auroraGold-light hover:underline pt-2">
      ← กลับสู่หน้าร้านวัตถุมงคล
    </a>
  </div>

  <script>
    const LIFF_ID = "2007499712-3e6TMnJJ";
    const API_URL = "https://script.google.com/macros/s/AKfycbzhqzmw9LkSheJD2AQTreWQY2w1Wqh0okxRMXhRelayFqHetwQCPmc877YJCPnd6P6w/exec";

    let currentUserId = "";
    let isMember = false;

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        if (typeof liff !== "undefined") {
          await liff.init({ liffId: LIFF_ID });
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          const profile = await liff.getProfile();
          currentUserId = profile.userId;

          // ตรวจสอบสถานะสมาชิกทันที
          loadMemberStatus(currentUserId, profile.displayName);
        }
      } catch (err) {
        console.error("LIFF Init Error:", err);
        document.getElementById("card-holder-name").innerText = "กรุณาเปิดใน LINE แอปพลิเคชัน";
      }
    });

    async function loadMemberStatus(uid, displayName) {
      try {
        const res = await fetch(`${API_URL}?action=get_member_profile&userId=${encodeURIComponent(uid)}`);
        const data = await res.json();

        if (data.status === "success" && data.member) {
          isMember = true;
          const m = data.member;
          document.getElementById("card-holder-name").innerText = m.name || displayName || "ผู้ศรัทธาบารมี";
          document.getElementById("card-member-code").innerText = m.memberCode || "NAGA-VIP";
          document.getElementById("card-privilege").innerText = m.privilege || "วรรณะนาคารัตนบารมี";
          document.getElementById("card-balance").innerText = `฿${Number(m.balance || 0).toLocaleString()} มณี`;
          document.getElementById("card-badge").innerText = "สมาชิกสายญาณ";

          // กรอกข้อมูลเดิมลงฟอร์ม
          document.getElementById("member-name").value = m.name !== "-" ? m.name : "";
          document.getElementById("member-phone").value = m.phone !== "-" ? m.phone : "";
          document.getElementById("member-address").value = m.address !== "-" ? m.address : "";

          // ซ่อนปุ่มสมัคร แล้วแสดงปุ่มแก้ไขข้อมูลแทน
          document.getElementById("btn-register-action").classList.add("hidden");
          document.getElementById("btn-toggle-edit").classList.remove("hidden");
        } else {
          isMember = false;
          document.getElementById("card-holder-name").innerText = displayName || "ผู้ศรัทธาบารมี";
          document.getElementById("card-badge").innerText = "ยังไม่เป็นสมาชิก";
          document.getElementById("btn-register-action").classList.remove("hidden");
          document.getElementById("btn-toggle-edit").classList.add("hidden");
        }
      } catch (e) {
        console.warn("Load Member Error:", e);
      }
    }

    // เมื่อกดปุ่มสมัครสมาชิก -> ส่งคำว่า "สมาชิก" เข้าแชท LINE ทันที
    async function handleRegisterClick() {
      const btn = document.getElementById("btn-register-action");
      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin mr-1.5">🌀</span> กำลังสมัครสมาชิก...`;

      try {
        // 1. ตรวจสอบว่าเปิดใน LINE Client หรือไม่
        if (typeof liff !== "undefined" && liff.isInClient()) {
          // ส่งข้อความแทนผู้ใช้เข้าห้องแชทคำว่า "สมาชิก"
          await liff.sendMessages([{
            type: "text",
            text: "สมาชิก"
          }]);

          // หน่วงเวลาเล็กน้อยเพื่อให้ระบบส่งข้อความสำเร็จ แล้วปิดหน้าต่าง LIFF กลับเข้าห้องแชท
          setTimeout(() => {
            liff.closeWindow();
          }, 500);

        } else {
          // หากเปิดผ่านเบราว์เซอร์ภายนอก (Fallback API)
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
              action: "register_member",
              userId: currentUserId,
              name: "ผู้ศรัทธาบารมี"
            })
          });
          const result = await res.json();
          if (result.status === "success") {
            alert("สถาปนาสมาชิกสำเร็จ! กรุณาตรวจสอบบัตรในแชท LINE ครับ");
            await loadMemberStatus(currentUserId);
          }
        }
      } catch (err) {
        console.error("Register Error:", err);
        alert("สายสัญญาณขัดข้อง กรุณาลองใหม่อีกครั้งครับ");
      } finally {
        btn.disabled = false;
        btn.innerText = "✨ กดสมัครสมาชิกสายญาณนาคราช";
      }
    }

    function toggleEditForm() {
      const form = document.getElementById("edit-form-panel");
      form.classList.toggle("hidden");
      if (!form.classList.contains("hidden")) {
        form.scrollIntoView({ behavior: 'smooth' });
      }
    }

    // กดอัปเดตข้อมูล -> แก้ไขทับแถวเดิมในชีต member และพับฟอร์มเก็บทันที
    async function saveUpdatedMemberProfile() {
      const name = document.getElementById("member-name").value.trim();
      const phone = document.getElementById("member-phone").value.trim();
      const address = document.getElementById("member-address").value.trim();

      if (!name || !phone) {
        alert("กรุณาระบุชื่อ-นามสกุล และเบอร์โทรศัพท์ครับ");
        return;
      }

      const btn = document.getElementById("btn-submit-update");
      btn.disabled = true;
      btn.innerText = "กำลังบันทึกข้อมูล...";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "save_member",
            userId: currentUserId,
            name: name,
            phone: phone,
            address: address
          })
        });
        const result = await res.json();

        if (result.status === "success") {
          alert("✅ อัปเดตข้อมูลสมาชิกเรียบร้อยแล้ว!");
          document.getElementById("card-holder-name").innerText = name;
          // พับฟอร์มเก็บซ่อนทันที
          document.getElementById("edit-form-panel").classList.add("hidden");
        } else {
          alert("แจ้งเตือน: " + (result.message || "บันทึกไม่สำเร็จ"));
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการเชื่อมต่อ");
      } finally {
        btn.disabled = false;
        btn.innerText = "💾 ยืนยันการอัปเดตข้อมูล";
      }
    }
  </script>
</body>
</html>
