<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Console • วินทร์ทรัพย์นาคราช</title>
  
  <script src="./config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 50% 0%, #064032 0%, #022018 45%, #010a08 100%);
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    .pearl-header {
      background: linear-gradient(135deg, rgba(6, 64, 50, 0.94) 0%, rgba(2, 32, 24, 0.98) 100%);
      border: 1px solid rgba(250, 204, 21, 0.35);
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
    }

    .lux-glass-box {
      background: linear-gradient(145deg, rgba(6, 64, 50, 0.88) 0%, rgba(2, 28, 21, 0.96) 100%);
      border: 1px solid rgba(250, 204, 21, 0.3);
      backdrop-filter: blur(18px);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
    }

    .tab-btn {
      background: rgba(2, 44, 34, 0.7);
      border: 1px solid rgba(254, 240, 138, 0.2);
      color: #cbd5e1;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #fef08a 0%, #ca8a04 100%);
      color: #022018;
      font-weight: 700;
      box-shadow: 0 3px 10px rgba(202, 138, 4, 0.35);
    }
  </style>
</head>
<body class="p-3 sm:p-5 max-w-4xl mx-auto flex flex-col pb-20">

  <!-- Header -->
  <header class="pearl-header rounded-3xl p-3 mb-4 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-full p-0.5 bg-gradient-to-tr from-amber-300 via-emerald-400 to-amber-500 shadow flex-shrink-0">
        <div class="w-full h-full rounded-full bg-black flex items-center justify-center overflow-hidden">
          <img src="./logo.png" alt="โลโก้" class="w-full h-full object-contain p-0.5" onerror="this.src='https://placehold.co/60x60/064032/fef08a?text=🐍'">
        </div>
      </div>
      <div>
        <h1 class="text-xs font-bold text-amber-200 tracking-wide">วินทร์ทรัพย์นาคราช</h1>
        <p class="text-[9px] text-emerald-300/80 font-light">ระบบศูนย์กลางผู้ดูแลระบบ (Admin Console)</p>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <a href="./index.html" class="text-[10px] bg-black/50 border border-amber-300/30 text-pearl-cream px-3 py-1.5 rounded-full font-medium">
        หน้าร้านค้า ⟨
      </a>
    </div>
  </header>

  <!-- แท็บเลือกตารางฐานข้อมูล (รวม member) -->
  <div class="flex items-center gap-1.5 mb-3.5 overflow-x-auto pb-1 no-scrollbar text-xs">
    <button onclick="switchTab('member')" id="tab-member" class="tab-btn active px-3.5 py-1.5 rounded-full whitespace-nowrap text-[11px]">👤 ข้อมูลสมาชิก (member)</button>
    <button onclick="switchTab('products')" id="tab-products" class="tab-btn px-3.5 py-1.5 rounded-full whitespace-nowrap text-[11px]">🛍️ สินค้า & บริการ (products)</button>
    <button onclick="switchTab('orders')" id="tab-orders" class="tab-btn px-3.5 py-1.5 rounded-full whitespace-nowrap text-[11px]">📦 คำสั่งซื้อ (orders)</button>
    <button onclick="switchTab('bookings')" id="tab-bookings" class="tab-btn px-3.5 py-1.5 rounded-full whitespace-nowrap text-[11px]">📅 คิวตรวจดวง (bookings)</button>
    <button onclick="switchTab('psarnkru')" id="tab-psarnkru" class="tab-btn px-3.5 py-1.5 rounded-full whitespace-nowrap text-[11px]">🪷 สาส์นบรมครู (psarnkru)</button>
    <button onclick="switchTab('settings')" id="tab-settings" class="tab-btn px-3.5 py-1.5 rounded-full whitespace-nowrap text-[11px]">⚙️ ตั้งค่า (settings)</button>
  </div>

  <!-- แถบควบคุม: ค้นหา, รีเฟรช, เพิ่มข้อมูล และตั้งค่า API ขนส่ง -->
  <div class="lux-glass-box rounded-2xl p-3 mb-4 flex flex-wrap items-center justify-between gap-2.5">
    <div class="flex items-center gap-2 flex-1 min-w-[200px]">
      <span class="text-xs text-amber-400">🔍</span>
      <input type="text" id="admin-search" oninput="filterAdminTable()" placeholder="ค้นหาในตารางปัจจุบัน..." class="bg-black/40 border border-amber-300/20 rounded-xl px-3 py-1.5 text-xs text-white placeholder-slate-400 focus:outline-none w-full">
    </div>

    <div class="flex items-center gap-2">
      <button onclick="loadCurrentTable()" class="px-3 py-1.5 bg-black/50 border border-emerald-400/30 text-emerald-300 text-xs rounded-xl hover:bg-black/80 transition">
        🔄 รีเฟรช
      </button>
      <button onclick="openCreateModal()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow transition">
        + เพิ่มข้อมูล
      </button>
      <button onclick="openShippingModal()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs rounded-xl shadow transition">
        🚚 ตั้งค่า API ขนส่ง
      </button>
    </div>
  </div>

  <!-- พื้นที่แสดงผลตารางข้อมูล -->
  <div class="lux-glass-box rounded-3xl p-4 overflow-hidden">
    <div id="table-loading" class="py-16 text-center text-xs text-amber-200 animate-pulse font-light">
      กำลังเชื่อมต่อฐานข้อมูล...
    </div>
    <div id="table-data-container"></div>
  </div>

  <!-- MODAL: จัดการ API ขนส่งสด -->
  <div id="shipping-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="lux-glass-box rounded-3xl p-5 w-full max-w-md text-white space-y-4 border border-amber-400/40 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-white/10">
        <h3 class="text-xs font-bold text-amber-200">🚚 ตั้งค่าเชื่อมต่อ API ขนส่งพัสดุสด</h3>
        <button onclick="closeShippingModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-300 mb-1">ผู้ให้บริการขนส่ง:</label>
          <select id="ship-provider" class="w-full p-2.5 rounded-xl bg-black/60 border border-amber-300/30 text-white focus:outline-none">
            <option value="THAILAND_POST">ไปรษณีย์ไทย (Thailand Post Track & Trace)</option>
            <option value="FLASH_EXPRESS">Flash Express (API)</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-300 mb-1">API Token / Secret Key:</label>
          <input type="password" id="ship-api-key" placeholder="วาง API Key ขนส่งที่นี่..." class="w-full p-2.5 rounded-xl bg-black/60 border border-amber-300/30 text-white focus:outline-none">
          <span id="ship-key-status" class="text-[10px] text-emerald-400 mt-1 block"></span>
        </div>
      </div>

      <div class="pt-2 border-t border-white/10 flex justify-end gap-2">
        <button onclick="closeShippingModal()" class="px-4 py-2 bg-white/10 text-slate-300 rounded-xl text-xs">ยกเลิก</button>
        <button onclick="saveShippingConfig()" class="px-4 py-2 bg-amber-400 text-black font-bold rounded-xl text-xs shadow">บันทึกคีย์ขนส่ง</button>
      </div>
    </div>
  </div>

  <!-- MODAL: เพิ่ม/แก้ไข ข้อมูล (CRUD Dynamic Form) -->
  <div id="crud-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="lux-glass-box rounded-3xl p-5 w-full max-w-lg text-white max-h-[85vh] flex flex-col justify-between border border-amber-400/40 shadow-2xl overflow-y-auto">
      <div>
        <div class="flex justify-between items-center pb-2 border-b border-white/10 mb-3">
          <h3 id="crud-modal-title" class="text-xs font-bold text-amber-200">จัดการข้อมูล</h3>
          <button onclick="closeCrudModal()" class="text-slate-400 hover:text-white">✕</button>
        </div>
        <div id="crud-form-fields" class="space-y-3 text-xs max-h-[60vh] overflow-y-auto pr-1"></div>
      </div>

      <div class="pt-3 border-t border-white/10 flex justify-end gap-2 mt-4">
        <button onclick="closeCrudModal()" class="px-4 py-2 bg-white/10 text-slate-300 rounded-xl text-xs">ยกเลิก</button>
        <button id="crud-submit-btn" onclick="submitCrudForm()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs shadow">บันทึก</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = typeof getMasterApiUrl === "function" ? getMasterApiUrl() : "https://script.google.com/macros/s/AKfycbwBK-NcHXTiaoVhJyBxB3fMVGFj9x8lSjvU1ECL6pzmjjIWLFqgN-94ny9niIjtow9B/exec";

    let currentSheet = "member";
    let rawTableData = null;
    let editingRowIndex = null;

    window.onload = function() {
      loadCurrentTable();
    };

    function switchTab(sheetName) {
      currentSheet = sheetName;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById(`tab-${sheetName}`);
      if (btn) btn.classList.add("active");
      loadCurrentTable();
    }

    function loadCurrentTable() {
      document.getElementById("table-loading").classList.remove("hidden");
      document.getElementById("table-data-container").innerHTML = "";

      fetch(`${API_URL}?action=get_table_data&sheetName=${currentSheet}`)
        .then(r => r.json())
        .then(res => {
          document.getElementById("table-loading").classList.add("hidden");
          if (res.status === "success") {
            rawTableData = res;
            renderTableData(res);
          } else {
            document.getElementById("table-data-container").innerHTML = `
              <div class="py-12 text-center text-xs text-red-300">${res.message || "ไม่สามารถโหลดข้อมูลได้"}</div>
            `;
          }
        })
        .catch(() => {
          document.getElementById("table-loading").classList.add("hidden");
          document.getElementById("table-data-container").innerHTML = `
            <div class="py-12 text-center text-xs text-red-300">การเชื่อมต่อขัดข้อง</div>
          `;
        });
    }

    function renderTableData(data) {
      const container = document.getElementById("table-data-container");
      container.innerHTML = "";

      if (!data.rows || data.rows.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-xs text-slate-400">ยังไม่มีข้อมูลในตารางนี้</div>`;
        return;
      }

      const isProductTab = (currentSheet === "products");
      let tableHtml = `<div class="overflow-x-auto"><table class="w-full text-left text-xs border-collapse">`;
      
      // Header
      tableHtml += `<thead><tr class="bg-black/60 text-amber-200 border-b border-amber-300/30">`;
      data.headers.forEach(h => { tableHtml += `<th class="p-3 whitespace-nowrap">${h}</th>`; });
      if (isProductTab) tableHtml += `<th class="p-3 text-center whitespace-nowrap">เปิด/ปิดขาย</th>`;
      tableHtml += `<th class="p-3 text-center whitespace-nowrap">จัดการ</th></tr></thead><tbody>`;

      // Rows
      data.rows.forEach(r => {
        tableHtml += `<tr class="border-b border-white/5 hover:bg-white/5 transition">`;
        r.data.forEach(cell => {
          tableHtml += `<td class="p-3 text-slate-200 max-w-[200px] truncate">${cell || '-'}</td>`;
        });

        // สวิตช์เปิด/ปิดขายสำหรับชีต products
        if (isProductTab) {
          const currentStatus = String(r.data[8] || "ACTIVE").trim().toUpperCase();
          const isOpen = (currentStatus === "ACTIVE" || currentStatus === "เปิด" || currentStatus === "TRUE");
          tableHtml += `
            <td class="p-3 text-center">
              <button onclick="toggleProductSwitch(${r.rowIndex}, ${!isOpen})" class="px-3 py-1 rounded-full text-[10px] font-bold ${isOpen ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/50' : 'bg-red-500/20 text-red-300 border border-red-400/50'}">
                ${isOpen ? '🟢 เปิดขาย' : '🔴 ปิดขาย'}
              </button>
            </td>
          `;
        }

        tableHtml += `
          <td class="p-3 text-center whitespace-nowrap">
            <button onclick='openEditModal(${r.rowIndex}, ${JSON.stringify(r.data)})' class="px-2.5 py-1 bg-amber-400/20 text-amber-300 hover:bg-amber-400/30 rounded-lg mr-1 text-[11px]">แก้ไข</button>
            <button onclick="deleteRow(${r.rowIndex})" class="px-2.5 py-1 bg-red-500/20 text-red-300 hover:bg-red-500/30 rounded-lg text-[11px]">ลบ</button>
          </td>
        </tr>`;
      });

      tableHtml += `</tbody></table></div>`;
      container.innerHTML = tableHtml;
    }

    function toggleProductSwitch(rowIndex, newStatus) {
      fetch(`${API_URL}?action=toggle_product_status&rowIndex=${rowIndex}&status=${newStatus}`)
        .then(r => r.json())
        .then(res => {
          if (res.status === "success") {
            loadCurrentTable();
          } else {
            alert("ไม่สามารถเปลี่ยนสถานะได้: " + res.message);
          }
        });
    }

    function filterAdminTable() {
      const q = document.getElementById("admin-search").value.trim().toLowerCase();
      if (!rawTableData) return;

      if (!q) {
        renderTableData(rawTableData);
        return;
      }

      const filteredRows = rawTableData.rows.filter(r => 
        r.data.some(val => String(val).toLowerCase().includes(q))
      );

      renderTableData({
        headers: rawTableData.headers,
        rows: filteredRows
      });
    }

    // --- CRUD MODAL ---
    function openCreateModal() {
      if (!rawTableData) return;
      editingRowIndex = null;
      document.getElementById("crud-modal-title").innerText = `เพิ่มข้อมูลใน ${currentSheet}`;
      buildFormFields(rawTableData.headers, []);
      document.getElementById("crud-modal").classList.remove("hidden");
    }

    function openEditModal(rowIndex, rowData) {
      if (!rawTableData) return;
      editingRowIndex = rowIndex;
      document.getElementById("crud-modal-title").innerText = `แก้ไขข้อมูลแถวที่ ${rowIndex} ใน ${currentSheet}`;
      buildFormFields(rawTableData.headers, rowData);
      document.getElementById("crud-modal").classList.remove("hidden");
    }

    function buildFormFields(headers, values) {
      const formContainer = document.getElementById("crud-form-fields");
      formContainer.innerHTML = "";

      headers.forEach((h, idx) => {
        const val = values[idx] !== undefined ? values[idx] : "";
        const div = document.createElement("div");
        div.innerHTML = `
          <label class="block text-slate-300 mb-1 font-semibold">${h}:</label>
          <input type="text" id="field-${idx}" value="${String(val).replace(/"/g, '&quot;')}" class="w-full p-2.5 rounded-xl bg-black/60 border border-amber-300/30 text-white focus:outline-none focus:border-amber-400">
        `;
        formContainer.appendChild(div);
      });
    }

    function closeCrudModal() {
      document.getElementById("crud-modal").classList.add("hidden");
    }

    function submitCrudForm() {
      if (!rawTableData) return;
      const inputs = document.querySelectorAll("#crud-form-fields input");
      const rowData = Array.from(inputs).map(inp => inp.value);

      const btn = document.getElementById("crud-submit-btn");
      btn.disabled = true;
      btn.innerText = "กำลังบันทึก...";

      const action = editingRowIndex ? "crud_update" : "crud_create";
      const payload = {
        action: action,
        sheetName: currentSheet,
        rowIndex: editingRowIndex,
        rowData: rowData
      };

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(r => r.json())
      .then(res => {
        btn.disabled = false;
        btn.innerText = "บันทึก";
        if (res.status === "success") {
          closeCrudModal();
          loadCurrentTable();
        } else {
          alert("เกิดข้อผิดพลาด: " + res.message);
        }
      })
      .catch(() => {
        btn.disabled = false;
        btn.innerText = "บันทึก";
        alert("การเชื่อมต่อระบบขัดข้อง");
      });
    }

    function deleteRow(rowIndex) {
      if (!confirm(`ยืนยันการลบแถวที่ ${rowIndex} หรือไม่?`)) return;

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "crud_delete",
          sheetName: currentSheet,
          rowIndex: rowIndex
        })
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          loadCurrentTable();
        } else {
          alert("ไม่สามารถลบได้: " + res.message);
        }
      });
    }

    // --- SHIPPING MODAL ---
    function openShippingModal() {
      fetch(`${API_URL}?action=get_shipping_config`)
        .then(r => r.json())
        .then(res => {
          if (res.status === "success") {
            document.getElementById("ship-provider").value = res.provider || "THAILAND_POST";
            document.getElementById("ship-api-key").value = res.apiKey || "";
            document.getElementById("ship-key-status").innerText = res.hasKey ? "🟢 บันทึกคีย์แล้ว (พร้อมใช้งาน)" : "🔴 ยังไม่ได้ตั้งค่าคีย์";
          }
        });
      document.getElementById("shipping-modal").classList.remove("hidden");
    }

    function closeShippingModal() {
      document.getElementById("shipping-modal").classList.add("hidden");
    }

    function saveShippingConfig() {
      const provider = document.getElementById("ship-provider").value;
      const apiKey = document.getElementById("ship-api-key").value.trim();

      fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "save_shipping_config",
          provider: provider,
          apiKey: apiKey
        })
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          alert("บันทึกการตั้งค่า API ขนส่งเรียบร้อยแล้ว");
          closeShippingModal();
        } else {
          alert("เกิดข้อผิดพลาด: " + res.message);
        }
      });
    }
  </script>
</body>
</html>
