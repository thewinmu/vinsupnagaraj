<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบจองคิวดูดวง • วินทร์ทรัพย์นาคราช</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      /* Theme ดำเงาหรูหรา (Glossy Black / Deep Obsidian) ผสมเขียวมรกต */
      background: radial-gradient(circle at top, #022c22 0%, #03120e 45%, #000000 100%);
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
    }
    /* โทนสีขาวมุกและเงินประกายทองอ่อนๆ หรูหรา */
    .pearl-gold-text {
      background: linear-gradient(135deg, #ffffff 0%, #fef08a 60%, #e2e8f0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* การ์ดเขียวมรกตเข้ม ขอบขาวมุกโปร่งแสงเงางาม */
    .card-emerald-glossy {
      background: linear-gradient(135deg, rgba(6, 78, 59, 0.45) 0%, rgba(2, 44, 34, 0.75) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    /* ปุ่มสไตล์พรีเมียมเขียว-ขาว-ดำ */
    .btn-pearl-emerald {
      background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
      color: #022c22;
      font-weight: 700;
      border-radius: 9999px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }
    .btn-pearl-emerald:active { transform: scale(0.96); }
    
    .text-pearl { color: #f8fafc; }
    .text-pearl-muted { color: #94a3b8; }
  </style>
</head>
<body class="p-5 max-w-md mx-auto flex flex-col pb-12">

  <!-- Header -->
  <div class="flex items-center justify-between py-4 mb-2">
    <button onclick="window.location.href='./index.html'" class="text-xs font-semibold text-pearl px-4 py-2 rounded-full border border-white/20 bg-black/40 hover:bg-emerald-950/60 transition shadow">⟨ กลับหน้าร้าน</button>
    <div class="text-sm text-pearl font-bold tracking-wider">วินทร์ทรัพย์นาคราช</div>
  </div>

  <div class="text-center mb-6">
    <h1 class="text-2xl font-extrabold pearl-gold-text tracking-wide">ยืนยันการจองคิวดูดวง</h1>
    <p class="text-xs text-pearl-muted mt-1" id="subtitle-mode">เลือกช่วงเวลาเพื่อรับคำพยากรณ์</p>
  </div>

  <!-- กล่องประกาศสถานะจาก Admin (ถ้าปิดรับจอง) -->
  <div id="admin-notice" class="hidden mb-6 p-4 rounded-2xl bg-zinc-900 border border-red-500/50 text-center text-xs text-red-300 leading-relaxed shadow-xl">
    ⚠️ <span id="notice-text">ขณะนี้ปิดรับจองคิวชั่วคราว</span>
  </div>

  <!-- แสดงแพ็กเกจที่เลือก -->
  <div id="service-list" class="space-y-4">
    <div class="text-center py-10 text-pearl-muted animate-pulse text-xs">กำลังโหลดแพ็กเกจที่ท่านเลือก...</div>
  </div>

  <!-- Modal เลือกเวลาจอง (ปรับเวลาเป็น 2 คอลัมน์) -->
  <div id="booking-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="card-emerald-glossy p-6 w-full max-w-md space-y-4 border border-white/20 shadow-2xl">
      <div class="flex justify-between items-center border-b border-white/10 pb-3">
        <h3 class="text-sm font-bold text-pearl" id="modal-service-title">เลือกช่วงเวลานัดหมาย</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-base px-2">✕</button>
      </div>
      
      <div class="space-y-2 text-xs">
        <label class="block text-pearl-muted font-medium mb-2">รอบเวลาบริการ (สถานะ ว่าง / เต็ม):</label>
        <!-- 💡 ปรับเวลาเป็น 2 คอลัมน์ด้วย grid-cols-2 -->
        <div id="slot-container" class="grid grid-cols-2 gap-2.5 max-h-64 overflow-y-auto pr-1">
          <div class="text-gray-400 text-center py-4 col-span-2">กำลังตรวจสอบรอบเวลา...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WEB_URL = "https://script.google.com/macros/s/AKfycbxXRJyClfhGCLyG3plwkuCBzbwsIQdPiy0X11f3EbCvL2Dj-y2sCenNFiqjMdKNoqhf/exec";
    const LIFF_ID = "2007499712-B0uid9G3";
    let selectedService = "";
    let isBookingOpen = true;
    let currentUserId = "guest_user";
    let targetServiceFromURL = "";

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      targetServiceFromURL = urlParams.get('service') ? decodeURIComponent(urlParams.get('service')).trim() : "";

      if (typeof liff !== 'undefined' && LIFF_ID) {
        liff.init({ liffId: LIFF_ID })
          .then(() => {
            if (liff.isLoggedIn()) {
              liff.getProfile().then(p => { currentUserId = p.userId; }).catch(() => {});
            }
          })
          .catch(err => console.error("LIFF Init Error:", err));
      }
      checkBookingStatusAndLoad();
    });

    function checkBookingStatusAndLoad() {
      fetch(`${WEB_URL}?action=get_booking_status`)
        .then(r => r.json())
        .then(res => {
          if (res && res.status === "success") {
            if (res.bookingStatus === "closed") {
              isBookingOpen = false;
              document.getElementById('notice-text').innerText = res.message || "ขณะนี้ปิดรับจองคิวชั่วคราว";
              document.getElementById('admin-notice').classList.remove('hidden');
            }
          }
          loadServices();
        })
        .catch(() => loadServices());
    }

    function loadServices() {
      fetch(`${WEB_URL}?action=get_booking_services`)
        .then(r => r.json())
        .then(res => {
          const container = document.getElementById('service-list');
          container.innerHTML = "";
          
          if(res && res.items && res.items.length > 0) {
            let itemsToShow = res.items;
            if (targetServiceFromURL) {
              itemsToShow = res.items.filter(item => item.name.toLowerCase().includes(targetServiceFromURL.toLowerCase()));
              if (itemsToShow.length === 0) {
                itemsToShow = res.items;
              } else {
                document.getElementById('subtitle-mode').innerText = "แพ็กเกจที่คุณเลือกจากแชท LINE";
              }
            }

            itemsToShow.forEach(item => {
              const btnStyle = isBookingOpen ? "btn-pearl-emerald cursor-pointer py-3" : "bg-zinc-800 text-zinc-500 cursor-not-allowed opacity-50 py-3";
              const btnAction = isBookingOpen ? `onclick="openBookingModal('${item.name}')"` : "";
              
              container.innerHTML += `
                <div class="card-emerald-glossy p-5 flex flex-col gap-3">
                  <div>
                    <div class="text-base font-bold text-pearl">${item.name}</div>
                    <div class="text-xs text-pearl-muted mt-1.5 leading-relaxed">${item.desc || 'เปิดดวงพยากรณ์มงคล เจาะลึกเฉพาะประเด็น'}</div>
                    <div class="text-sm font-extrabold pearl-gold-text mt-3">${item.price > 0 ? item.price.toLocaleString() + ' บาท' : 'บูชาฟรี'}</div>
                  </div>
                  <button ${btnAction} class="${btnStyle} w-full text-xs tracking-wide flex items-center justify-center gap-1 shadow-md">
                    ${isBookingOpen ? '🔮 เลือกจองเวลานี้' : '🔒 ปิดรับจองชั่วคราว'}
                  </button>
                </div>
              `;
            });
          } else {
            container.innerHTML = `<div class="text-center text-xs text-gray-400 py-10">ไม่พบแพ็กเกจดูดวงในขณะนี้</div>`;
          }
        })
        .catch(() => {
          document.getElementById('service-list').innerHTML = `<div class="text-center text-xs text-red-300 py-10">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</div>`;
        });
    }

    function openBookingModal(serviceName) {
      if (!isBookingOpen) return;
      selectedService = serviceName;
      document.getElementById('modal-service-title').innerText = `จองคิว: ${serviceName}`;
      document.getElementById('booking-modal').classList.remove('hidden');
      loadTimeSlots();
    }

    function closeModal() {
      document.getElementById('booking-modal').classList.add('hidden');
    }

    function loadTimeSlots() {
      const container = document.getElementById('slot-container');
      container.innerHTML = `<div class="text-gray-300 text-center py-4 col-span-2 text-xs">กำลังตรวจสอบรอบเวลา...</div>`;

      fetch(`${WEB_URL}?action=get_time_slots`)
        .then(r => r.json())
        .then(res => {
          container.innerHTML = "";
          const slots = (res && res.slots) ? res.slots : [];

          if(slots.length === 0) {
            container.innerHTML = `<div class="text-gray-400 text-center py-4 col-span-2 text-xs">ไม่พบรอบเวลาเปิดบริการ</div>`;
            return;
          }

          slots.forEach(slot => {
            const isOpen = slot.status.toLowerCase() === "open";
            
            if (isOpen) {
              container.innerHTML += `
                <div class="p-2.5 rounded-xl bg-black/40 border border-emerald-500/30 flex flex-col justify-between gap-2">
                  <div>
                    <div class="text-pearl font-bold text-[11px]">⏰ ${slot.time}</div>
                    <span class="inline-flex items-center gap-1 text-[9px] text-emerald-300 bg-emerald-950 px-2 py-0.5 rounded-full border border-emerald-500/40 mt-1">
                      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> ว่าง
                    </span>
                  </div>
                  <button onclick="confirmSlot('${slot.time}')" class="btn-pearl-emerald w-full py-1.5 text-[11px] shadow">จอง</button>
                </div>
              `;
            } else {
              container.innerHTML += `
                <div class="p-2.5 rounded-xl bg-zinc-900/60 border border-red-500/20 flex flex-col justify-between gap-2 opacity-60">
                  <div>
                    <div class="text-zinc-500 font-bold text-[11px]">⏰ ${slot.time}</div>
                    <span class="inline-flex items-center gap-1 text-[9px] text-red-400 bg-red-950 px-2 py-0.5 rounded-full border border-red-500/30 mt-1">
                      <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span> เต็มแล้ว
                    </span>
                  </div>
                  <button disabled class="bg-zinc-800 text-zinc-600 w-full py-1.5 text-[11px] rounded-full cursor-not-allowed">เต็ม</button>
                </div>
              `;
            }
          });
        })
        .catch(() => {
          container.innerHTML = `<div class="text-red-300 text-center py-4 col-span-2 text-xs">โหลดรอบเวลาไม่สำเร็จ</div>`;
        });
    }

    function confirmSlot(slotTime) {
      if (confirm(`ยืนยันการจองแพ็กเกจ "${selectedService}" รอบเวลา ${slotTime} ใช่หรือไม่?`)) {
        fetch(`${WEB_URL}?action=submit_booking&userId=${encodeURIComponent(currentUserId)}&serviceName=${encodeURIComponent(selectedService)}&slotTime=${encodeURIComponent(slotTime)}`)
          .then(r => r.json())
          .then(res => {
            alert(`✨ ทำการจองคิวสำเร็จ! ระบบบันทึกข้อมูลเรียบร้อยแล้ว กรุณากลับไปที่แชท LINE เพื่อรับใบเสร็จและชำระเงินครับ`);
            closeModal();
          })
          .catch(() => {
            alert(`✨ บันทึกการจองเรียบร้อยแล้ว`);
            closeModal();
          });
      }
    }
  </script>
</body>
</html>
