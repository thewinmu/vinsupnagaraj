<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เลือกหมวดหมู่คำทำนาย • วินทร์ทรัพย์นาคราช</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at top, #064e3b 0%, #022c22 40%, #000000 100%);
      color: #ffffff;
      min-height: 100vh;
    }
    .gold-text {
      background: linear-gradient(135deg, #ffffff 0%, #fef08a 40%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0px 4px 20px rgba(202, 138, 4, 0.4);
    }
    .category-card {
      background: linear-gradient(145deg, rgba(6, 78, 59, 0.6) 0%, rgba(0, 0, 0, 0.8) 100%);
      border: 1px solid rgba(254, 240, 138, 0.2);
      backdrop-filter: blur(10px);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .category-card:hover {
      border-color: #fef08a;
      box-shadow: 0 0 20px rgba(202, 138, 4, 0.5), inset 0 0 15px rgba(16, 185, 129, 0.3);
      transform: translateY(-5px) scale(1.02);
    }
    .glow-icon {
      filter: drop-shadow(0 0 10px rgba(254, 240, 138, 0.8));
    }
  </style>
</head>
<body class="p-5 max-w-md mx-auto flex flex-col pb-12">

  <!-- Header -->
  <div class="flex items-center justify-between py-4 mb-4">
    <button onclick="window.location.href='./index.html'" class="text-xs font-semibold text-white px-4 py-2 rounded-full border border-white/20 bg-black/60 shadow-lg">⟨ กลับหน้าร้าน</button>
    <div class="text-sm text-emerald-300 font-bold tracking-widest uppercase">Oracle Cards</div>
  </div>

  <div class="text-center mb-8 relative">
    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-32 h-32 bg-emerald-500 rounded-full blur-[60px] opacity-30 pointer-events-none"></div>
    <h1 class="text-3xl font-extrabold gold-text mb-2 relative z-10">เสี่ยงทายไพ่นาคราช</h1>
    <p class="text-xs text-emerald-200 tracking-wider relative z-10">เลือกมิติแห่งคำทำนายที่คุณต้องการเปิดรับ</p>
  </div>

  <div class="grid grid-cols-2 gap-4">
    
    <!-- ปุ่มหมวดหมู่ต่างๆ จะส่ง parameter cat=... ไปที่หน้า pickacard.html -->
    <a href="pickacard.html?cat=pcardoftheday" class="category-card rounded-2xl p-5 text-center col-span-2 group">
      <div class="text-4xl mb-3 glow-icon group-hover:animate-pulse">🔮</div>
      <h3 class="text-lg font-bold text-amber-200 tracking-wide">Card of the Day</h3>
      <p class="text-[10px] text-slate-300 mt-1">ไพ่พลังงานประจำวันของคุณ</p>
    </a>

    <a href="pickacard.html?cat=pjob" class="category-card rounded-2xl p-4 text-center group">
      <div class="text-3xl mb-2 glow-icon group-hover:animate-pulse">💼</div>
      <h3 class="text-sm font-bold text-emerald-300">การงาน</h3>
    </a>

    <a href="pickacard.html?cat=pmoney" class="category-card rounded-2xl p-4 text-center group">
      <div class="text-3xl mb-2 glow-icon group-hover:animate-pulse">💰</div>
      <h3 class="text-sm font-bold text-amber-300">การเงิน</h3>
    </a>

    <a href="pickacard.html?cat=plove" class="category-card rounded-2xl p-4 text-center group">
      <div class="text-3xl mb-2 glow-icon group-hover:animate-pulse">❤️</div>
      <h3 class="text-sm font-bold text-pink-300">ความรัก</h3>
    </a>

    <a href="pickacard.html?cat=plucky" class="category-card rounded-2xl p-4 text-center group">
      <div class="text-3xl mb-2 glow-icon group-hover:animate-pulse">✨</div>
      <h3 class="text-sm font-bold text-yellow-300">โชคลาภ</h3>
    </a>

    <a href="pickacard.html?cat=phealth" class="category-card rounded-2xl p-4 text-center group">
      <div class="text-3xl mb-2 glow-icon group-hover:animate-pulse">🌿</div>
      <h3 class="text-sm font-bold text-emerald-400">สุขภาพ</h3>
    </a>

    <a href="pickacard.html?cat=psarnkru" class="category-card rounded-2xl p-4 text-center group">
      <div class="text-3xl mb-2 glow-icon group-hover:animate-pulse">🕊️</div>
      <h3 class="text-sm font-bold text-white drop-shadow-md">สาส์นเทวดา</h3>
    </a>

  </div>

</body>
</html>
