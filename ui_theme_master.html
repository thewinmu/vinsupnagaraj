<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Master Theme • วินทร์ทรัพย์นาคราช</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    /* ==========================================
       [1] Core Variables & Fonts
       ========================================== */
    body {
      font-family: 'Prompt', sans-serif;
      /* พื้นหลังสีเขียวมรกตเข้มแบบมีมิติ */
      background: radial-gradient(circle at 50% 30%, #06402b 0%, #021a11 60%, #010d08 100%);
      color: #fafaf9;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    /* ฟอนต์ภาษาอังกฤษ/ตัวเลข ให้ดูหรูหราแบบคลาสสิก */
    .font-eng { font-family: 'Cinzel', serif; }

    /* ==========================================
       [2] Colors & Gradients (ทอง & เขียว)
       ========================================== */
    /* ตัวหนังสือสีทอง */
    .text-gold {
      background: linear-gradient(to bottom right, #fcf6ba, #bf953f, #b38728, #fbf5b7, #aa771c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0px 2px 10px rgba(191, 149, 63, 0.2);
    }
    
    /* ตัวหนังสือสีทองอ่อน (สำหรับรายละเอียด) */
    .text-gold-light { color: #e8d089; }

    /* ==========================================
       [3] UI Components (ปุ่ม และ การ์ด)
       ========================================== */
    /* ปุ่มหลัก (สีทองสว่าง) */
    .btn-primary {
      background: linear-gradient(135deg, #fcf6ba 0%, #d4af37 50%, #aa771c 100%);
      color: #010d08;
      font-weight: 700;
      border-radius: 9999px;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3), inset 0 2px 2px rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-primary:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3); }

    /* ปุ่มรอง (สีเขียวเข้ม ขอบทอง) */
    .btn-secondary {
      background: linear-gradient(180deg, #052c1e 0%, #021a11 100%);
      color: #e8d089;
      font-weight: 600;
      border: 1px solid #aa771c;
      border-radius: 9999px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      transition: all 0.3s ease;
    }
    .btn-secondary:active { transform: scale(0.97); background: #021a11; }

    /* การ์ดกระจก (Glassmorphism) สำหรับแสดงข้อมูล */
    .glass-panel {
      background: rgba(2, 26, 17, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    /* ==========================================
       [4] Special Elements (แท่นวาง & เอฟเฟกต์)
       ========================================== */
    /* แท่นวางการ์ด 3D (Pedestal) */
    .pedestal {
      width: 220px;
      height: 45px;
      margin: -25px auto 0 auto;
      background: radial-gradient(ellipse at top, #d4af37 0%, #aa771c 40%, #021a11 100%);
      border-radius: 50%;
      box-shadow: 0 15px 25px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.4);
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pedestal-inner {
      width: 190px;
      height: 25px;
      background: #fdfbf1;
      border-radius: 50%;
      box-shadow: inset 0 -3px 8px rgba(170, 119, 28, 0.5);
      position: absolute;
      top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #aa771c;
      letter-spacing: 0.5px;
    }

    /* การ์ดลอยได้ */
    .floating-card {
      animation: float 4s ease-in-out infinite;
      position: relative;
      z-index: 10;
      border: 2px solid #d4af37;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3), inset 0 0 15px rgba(212, 175, 55, 0.5);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    /* ละอองดาว (Sparkles) */
    .sparkle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fcf6ba;
      border-radius: 50%;
      box-shadow: 0 0 8px 2px #d4af37;
      animation: twinkle 3s infinite alternate;
    }
    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.5); }
    }
  </style>
</head>
<body class="max-w-md mx-auto relative pb-8">

  <!-- Effect ละอองดาวประดับฉาก -->
  <div class="sparkle" style="top: 15%; left: 20%; animation-delay: 0s;"></div>
  <div class="sparkle" style="top: 25%; right: 15%; animation-delay: 1s;"></div>
  <div class="sparkle" style="top: 55%; left: 10%; animation-delay: 0.5s;"></div>
  <div class="sparkle" style="top: 65%; right: 25%; animation-delay: 1.5s;"></div>

  <!-- ==========================================
       SECTION 1: App Bar (ส่วนหัว)
       ========================================== -->
  <header class="flex items-center justify-between p-5 relative z-20">
    <button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-gold-light hover:text-white transition">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div class="text-center flex-1">
      <h1 class="text-lg font-bold text-gold tracking-wide flex items-center justify-center gap-2">
        <span class="text-xs">🐍</span> วินทร์ทรัพย์นาคราช
      </h1>
    </div>
    <button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-gold-light hover:text-white transition">
      <i class="fa-solid fa-ellipsis"></i>
    </button>
  </header>

  <!-- ==========================================
       SECTION 2: Hero Area (พื้นที่โชว์การ์ด / โปรไฟล์)
       ========================================== -->
  <section class="mt-2 mb-8 px-5 relative z-10 flex flex-col items-center">
    
    <!-- Title & Subtitle -->
    <div class="text-center mb-6">
      <h2 class="text-2xl font-extrabold text-gold font-eng mb-1">Membure Status</h2>
      <div class="flex items-center justify-center gap-2 text-xs font-medium text-gold-light opacity-80 uppercase tracking-widest">
        <span>✦</span> ศูนย์รวมศาสตร์พยากรณ์ <span>✦</span>
      </div>
    </div>

    <!-- การ์ด 3D ลอยอยู่บนแท่น (ใช้โชว์หน้าไพ่ หรือ บัตรสมาชิก) -->
    <div class="relative w-40 h-60 bg-[#021a11] floating-card flex flex-col items-center justify-center overflow-hidden">
      <!-- ลายพื้นหลังการ์ด -->
      <div class="absolute inset-0 opacity-20" style="background-image: repeating-linear-gradient(45deg, #d4af37 0, #d4af37 1px, transparent 1px, transparent 10px);"></div>
      <!-- ไอคอน/รูปภาพ กลางการ์ด -->
      <div class="text-5xl mb-3 text-gold relative z-10 drop-shadow-lg">🐉</div>
      <div class="font-eng text-xs text-gold-light font-bold tracking-widest relative z-10">MEMBER</div>
      <div class="font-eng text-xl font-bold text-white relative z-10">B001</div>
    </div>

    <!-- แท่นวาง (Pedestal) -->
    <div class="pedestal">
      <div class="pedestal-inner">
        ยอดทรัพย์คงเหลือ: 500 ฿
      </div>
    </div>
    
    <!-- Info Badge ใต้แท่น -->
    <div class="mt-4 px-4 py-1.5 glass-panel rounded-full text-xs font-semibold text-gold-light">
      สิทธิ์เสี่ยงทายฟรี: <span class="text-white font-eng text-sm">10</span> ครั้ง
    </div>
  </section>

  <!-- ==========================================
       SECTION 3: Action Buttons (ปุ่มเมนูหลัก)
       ========================================== -->
  <section class="px-5 space-y-4 relative z-20">
    
    <!-- หัวข้อ Section -->
    <div class="text-[11px] text-gold-light uppercase tracking-widest font-semibold pl-2 mb-2 flex items-center gap-2">
      <div class="w-4 h-[1px] bg-gold-light"></div>
      เมนูหลักบัญชีมงคล
    </div>

    <!-- ปุ่มคู่ (Primary & Secondary) -->
    <div class="grid grid-cols-2 gap-3">
      <button class="btn-primary py-3.5 flex items-center justify-center gap-2">
        <i class="fa-solid fa-wallet"></i> เติมทรัพย์
      </button>
      <button class="btn-secondary py-3.5 flex items-center justify-center gap-2">
        <i class="fa-solid fa-history"></i> ประวัติ
      </button>
    </div>

    <!-- กล่องข้อมูล (Data Cards) -->
    <div class="grid grid-cols-2 gap-3 mt-2">
      <div class="glass-panel p-4 flex flex-col justify-center">
        <div class="text-[9px] text-gray-400 uppercase tracking-wider mb-1">รหัสสมาชิก (Code)</div>
        <div class="font-eng text-gold font-bold text-lg flex items-center gap-2">
          <i class="fa-solid fa-cube text-xs opacity-70"></i> #4B0082
        </div>
      </div>
      <div class="glass-panel p-4 flex flex-col justify-center">
        <div class="text-[9px] text-gray-400 uppercase tracking-wider mb-1">สถานะสิทธิ์ (Status)</div>
        <div class="font-eng text-gold font-bold text-lg flex items-center gap-2">
          <i class="fa-solid fa-crown text-xs opacity-70"></i> VIP
        </div>
      </div>
    </div>

    <!-- ปุ่มขนาดใหญ่เต็มความกว้าง (Call to action) -->
    <div class="grid grid-cols-1 gap-3 pt-2">
      <button class="btn-primary py-4 w-full text-sm flex items-center justify-center gap-3">
        <i class="fa-solid fa-shopping-cart text-lg"></i> บูชาไอเทมมงคล (Shopping)
      </button>
      
      <button class="btn-secondary py-4 w-full text-sm flex items-center justify-center gap-3">
        <i class="fa-solid fa-layer-group text-lg"></i> เสี่ยงทาย Pick a Card
      </button>
    </div>

  </section>

</body>
</html>
