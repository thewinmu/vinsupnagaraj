<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ข้อมูลบัญชีมงคล • วินทร์ทรัพย์นาคราช</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #022c22 0%, #03120e 50%, #000000 100%);
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
    }
    .gold-text {
      background: linear-gradient(135deg, #ffffff 0%, #fef08a 60%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card-emerald-glossy {
      background: linear-gradient(135deg, rgba(6, 78, 59, 0.45) 0%, rgba(2, 44, 34, 0.75) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .input-luxury {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: #ffffff;
      transition: all 0.3s ease;
    }
    .input-luxury:focus {
      border-color: #fef08a;
      box-shadow: 0 0 12px rgba(254, 240, 138, 0.2);
      outline: none;
    }
    .btn-gold {
      background: linear-gradient(135deg, #fef08a 0%, #ca8a04 100%);
      color: #022c22;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(202, 138, 4, 0.4);
      transition: all 0.3s ease;
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(202, 138, 4, 0.6);
    }
  </style>
</head>
<body class="p-5 max-w-md mx-auto flex flex-col pb-12">

  <!-- Header -->
  <div class="flex items-center justify-between py-4 mb-4">
    <button onclick="window.location.href='./index.html'" class="text-xs font-semibold text-white px-4 py-2 rounded-full border border-white/20 bg-black/40 hover:bg-emerald-950/60 transition shadow">⟨ กลับหน้าร้าน</button>
    <div class="text-sm text-amber-200 font-bold tracking-wider drop-shadow-md">🐍 วินทร์ทรัพย์นาคราช</div>
  </div>

  <div class="text-center mb-6">
    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-amber-200 to-amber-600 mb-3 shadow-[0_0_20px_rgba(202,138,4,0.4)]">
      <span class="text-3xl">🐉</span>
    </div>
    <h1 class="text-2xl font-extrabold gold-text tracking-wide drop-shadow-lg">ข้อมูลบัญชีมงคล</h1>
    <p id="loading-txt" class="text-xs text-slate-400 mt-2 tracking-widest uppercase">กำลังเชื่อมต่อฐานข้อมูล...</p>
  </div>

  <!-- กรอบเนื้อหาหลัก -->
  <div class="card-emerald-glossy p-6 space-y-4">
    
    <!-- โหมดแสดงผล (Display Mode) -->
    <div id="display-mode" class="space-y-5 block">
      
      <div class="grid grid-cols-2 gap-4 bg-black/30 p-4 rounded-2xl border border-white/5">
        <div>
          <p class="text-[10px] text-emerald-400 font-bold tracking-wider mb-1">ยอดทรัพย์ (บาท)</p>
          <p id="lbl-balance" class="text-lg font-extrabold text-white">0.00</p>
        </div>
        <div class="text-right border-l border-white/10 pl-4">
          <p class="text-[10px] text-amber-400 font-bold tracking-wider mb-1">สิทธิ์ดูดวงฟรี</p>
          <p class="text-lg font-extrabold text-white"><span id="lbl-quota" class="gold-text">0</span> <span class="text-xs text-slate-400 font-normal">ครั้ง</span></p>
        </div>
      </div>

      <div class="space-y-3 pt-2">
        <div class="flex justify-between items-center border-b border-white/10 pb-3">
          <span class="text-xs text-slate-400">สถานะสมาชิก</span>
          <span id="lbl-privilege" class="text-xs font-bold px-3 py-1 rounded-full bg-gradient-to-r from-amber-600/40 to-amber-400/20 text-amber-300 border border-amber-500/30 shadow-inner">-</span>
        </div>
        <div class="flex justify-between items-center border-b border-white/10 pb-3 pt-1">
          <span class="text-xs text-slate-400">รหัสสมาชิก</span>
          <span id="lbl-code" class="text-sm font-semibold text-white tracking-widest">-</span>
        </div>
        <div class="flex justify-between items-center border-b border-white/10 pb-3 pt-1">
          <span class="text-xs text-slate-400">ชื่อ-นามสกุล</span>
          <span id="lbl-name" class="text-sm font-bold text-amber-100">-</span>
        </div>
        <div class="flex justify-between items-center border-b border-white/10 pb-3 pt-1">
          <span class="text-xs text-slate-400">เบอร์โทรศัพท์</span>
          <span id="lbl-phone" class="text-sm text-white">-</span>
        </div>
        <div class="flex justify-between items-start pt-1">
          <span class="text-xs text-slate-400 whitespace-nowrap mr-4">ที่อยู่จัดส่ง</span>
          <span id="lbl-address" class="text-xs text-white text-right leading-relaxed opacity-90">-</span>
        </div>
      </div>

      <div class="pt-4">
        <button onclick="toggleEditMode(true)" class="w-full py-4 rounded-xl btn-gold text-sm flex items-center justify-center gap-2">
          <span>✨ แก้ไขข้อมูลส่วนตัว</span>
        </button>
      </div>
    </div>

    <!-- โหมดแก้ไข (Edit Mode) -->
    <div id="edit-mode" class="space-y-4 hidden">
      <div class="flex items-center gap-2 mb-4">
        <span class="text-xl">✨</span>
        <h2 class="text-sm font-bold gold-text">อัปเดตข้อมูลมงคล</h2>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-[11px] font-bold text-emerald-400 mb-1.5 uppercase tracking-wider">ชื่อ-นามสกุล</label>
          <input type="text" id="input-name" placeholder="ระบุชื่อ-นามสกุล" class="w-full input-luxury p-3 text-sm">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-emerald-400 mb-1.5 uppercase tracking-wider">เบอร์โทรศัพท์ติดต่อ</label>
          <input type="tel" id="input-phone" placeholder="ระบุเบอร์โทรศัพท์" class="w-full input-luxury p-3 text-sm">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-emerald-400 mb-1.5 uppercase tracking-wider">ที่อยู่จัดส่ง (มงคลวัตถุ)</label>
          <textarea id="input-address" rows="3" placeholder="ระบุที่อยู่จัดส่งให้ครบถ้วน" class="w-full input-luxury p-3 text-sm leading-relaxed"></textarea>
        </div>
      </div>

      <div class="flex gap-3 pt-4">
        <button onclick="saveProfile()" class="flex-1 py-4 rounded-xl bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-bold text-sm shadow-[0_4px_15px_rgba(16,185,129,0.4)] transition-all">
          💾 บันทึกข้อมูล
        </button>
        <button onclick="toggleEditMode(false)" class="flex-none px-6 py-4 rounded-xl bg-black/40 border border-white/20 hover:bg-white/10 text-slate-300 font-bold text-sm transition-all">
          ยกเลิก
        </button>
      </div>
    </div>

  </div>

  <script>
    const WEB_URL = "https://script.google.com/macros/s/AKfycbwBK-NcHXTiaoVhJyBxB3fMVGFj9x8lSjvU1ECL6pzmjjIWLFqgN-94ny9niIjtow9B/exec";
    const LIFF_ID = "2007499712-B0uid9G3";
    let currentUserId = "guest_user";
    let currentDisplayName = "แขก";

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof liff !== 'undefined' && LIFF_ID) {
        liff.init({ liffId: LIFF_ID })
          .then(() => {
            if (liff.isLoggedIn()) {
              liff.getProfile().then(p => {
                currentUserId = p.userId;
                currentDisplayName = p.displayName;
                fetchMemberData(currentUserId, currentDisplayName);
              }).catch(() => fetchMemberData("guest_user", "แขก"));
            } else {
              fetchMemberData("guest_user", "แขก");
            }
          })
          .catch(() => fetchMemberData("guest_user", "แขก"));
      } else {
        fetchMemberData("admin_test_user_001", "ผู้ดูแลระบบ");
      }
    });

    function fetchMemberData(userId, name) {
      document.getElementById('loading-txt').innerText = "กำลังอัญเชิญข้อมูลบัญชีมงคล...";
      
      fetch(`${WEB_URL}?action=login_or_register&userId=${encodeURIComponent(userId)}&name=${encodeURIComponent(name)}`)
        .then(r => r.json())
        .then(res => {
          if (res && res.status === "success") {
            // อัปเดตข้อมูลหน้าแสดงผล
            document.getElementById('lbl-name').innerText = res.name || "-";
            document.getElementById('lbl-code').innerText = res.memberCode || "-";
            document.getElementById('lbl-phone').innerText = res.phone || "-";
            document.getElementById('lbl-address').innerText = res.address || "-";
            document.getElementById('lbl-quota').innerText = res.freeQuota || "0";
            document.getElementById('lbl-privilege').innerText = res.specialPrivilege || "ทั่วไป";
            document.getElementById('lbl-balance').innerText = (res.balance || 0).toLocaleString(undefined, {minimumFractionDigits: 2});

            // ใส่ค่าลงในฟอร์มแก้ไขเตรียมไว้
            document.getElementById('input-name').value = res.name !== "แขก" ? res.name : "";
            document.getElementById('input-phone').value = res.phone !== "-" ? res.phone : "";
            document.getElementById('input-address').value = res.address !== "-" ? res.address : "";

            document.getElementById('loading-txt').innerText = "โหลดข้อมูลเสร็จสมบูรณ์";
            document.getElementById('loading-txt').classList.replace("text-slate-400", "text-emerald-400");
          } else {
            document.getElementById('loading-txt').innerText = "ไม่พบข้อมูลสมาชิก";
            document.getElementById('loading-txt').classList.replace("text-slate-400", "text-red-400");
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById('loading-txt').innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อ";
        });
    }

    function toggleEditMode(isEdit) {
      const displayMode = document.getElementById('display-mode');
      const editMode = document.getElementById('edit-mode');
      
      if (isEdit) {
        displayMode.style.display = 'none';
        editMode.style.display = 'block';
        // เลื่อนขึ้นไปบนสุดเพื่อง่ายต่อการพิมพ์
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        editMode.style.display = 'none';
        displayMode.style.display = 'block';
      }
    }

    function saveProfile() {
      const name = document.getElementById('input-name').value.trim();
      const phone = document.getElementById('input-phone').value.trim();
      const address = document.getElementById('input-address').value.trim();

      alert("⏳ กำลังอัปเดตข้อมูลมงคล...");

      fetch(`${WEB_URL}?action=update_profile&userId=${encodeURIComponent(currentUserId)}&name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}&address=${encodeURIComponent(address)}`)
        .then(r => r.json())
        .then(res => {
          if (res && res.status === "success") {
            alert("✨ บันทึกข้อมูลสำเร็จเรียบร้อยครับ!");
            toggleEditMode(false);
            fetchMemberData(currentUserId, name); // รีโหลดข้อมูลใหม่
          } else {
            alert("❌ บันทึกไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
          }
        })
        .catch(err => {
          console.error(err);
          alert("❌ เกิดข้อผิดพลาดในการเชื่อมต่อเครือข่าย");
        });
    }
  </script>
</body>
</html>
