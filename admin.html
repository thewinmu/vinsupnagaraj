<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบจัดการรอบเวลาคิวดูดวง | วินทร์ทรัพย์นาคราช</title>
  
  <script src="./config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F8FAFC; color: #0F172A; -webkit-tap-highlight-color: transparent; }
    .slot-open { background-color: #ECFDF5; border: 1.5px solid #10B981; color: #065F46; }
    .slot-blocked { background-color: #FEF2F2; border: 1.5px solid #EF4444; color: #991B1B; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">
  <div>
    <!-- Executive Admin Header -->
    <header class="bg-slate-900 text-white p-5 rounded-3xl mb-4 shadow-sm border border-slate-800">
      <div class="text-[11px] text-amber-400 font-bold uppercase tracking-wider">ระบบจัดการหลังบ้าน</div>
      <h1 class="text-base font-extrabold mt-0.5">เปิด-ปิดรอบคิวพยากรณ์</h1>
      <p class="text-xs text-slate-400 mt-1">แตะที่กล่องรอบเวลาเพื่อสลับ ว่าง 🟢 / เต็ม 🔴</p>
    </header>

    <!-- กล่องเลือกวันที่ -->
    <div class="bg-white p-4 rounded-3xl border border-slate-200 mb-4 shadow-sm">
      <label class="text-xs font-bold text-slate-700 block mb-1.5">📅 เลือกวันที่ต้องการจัดการ</label>
      <input type="date" id="manage-date" onchange="loadAdminSlots()" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs font-bold text-slate-800 outline-none focus:ring-2 focus:ring-slate-900">
      
      <!-- ปุ่มทางลัด ปิด/เปิดทั้งวัน -->
      <div class="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-slate-100">
        <button onclick="setAllDay(true)" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 py-2.5 rounded-xl text-xs font-bold transition active:scale-95">
          🔴 ปิดรับทั้งวัน
        </button>
        <button onclick="setAllDay(false)" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 py-2.5 rounded-xl text-xs font-bold transition active:scale-95">
          🟢 เปิดรับทั้งวัน
        </button>
      </div>
    </div>

    <!-- รายการ 15 คิว -->
    <div class="flex justify-between items-center mb-2 px-1">
      <span class="text-xs font-bold text-slate-700">รอบเวลาทั้งหมด (15 คิว)</span>
      <div class="text-[10px] font-bold flex gap-2">
        <span class="text-emerald-700 font-extrabold">🟢 ว่าง (เปิด)</span>
        <span class="text-rose-700 font-extrabold">🔴 เต็ม (ปิด)</span>
      </div>
    </div>

    <div id="admin-slots-container" class="grid grid-cols-2 gap-2.5 max-h-[55vh] overflow-y-auto p-1">
      <div class="col-span-2 text-center text-xs text-slate-400 py-8 font-bold">กำลังโหลดข้อมูลรอบคิว...</div>
    </div>
  </div>

  <footer class="text-center py-4 text-[11px] text-slate-400">
    วินทร์ทรัพย์นาคราช Backoffice • ซิงค์กับชีต <span class="font-bold text-slate-600">slot_blocks</span>
  </footer>

  <script>
    const DEFAULT_URL = "https://script.google.com/macros/s/AKfycbxHiLwX4OE2yOJyohq5nERDV0gcUXUEEiXoHgy2SvA6cbsSvQV4Z6PESy8ykvlUwwSz/exec";
    const WEB_URL = (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.WEB_URL) ? APP_CONFIG.WEB_URL : DEFAULT_URL;

    window.onload = function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('manage-date').value = today;
      loadAdminSlots();
    };

    function loadAdminSlots() {
      const date = document.getElementById('manage-date').value;
      const container = document.getElementById('admin-slots-container');
      container.innerHTML = '<div class="col-span-2 text-center text-xs text-slate-400 py-8 font-bold">กำลังเช็ครอบเวลา...</div>';

      fetch(`${WEB_URL}?action=admin_get_slots&date=${date}`, {
        method: "GET",
        mode: "cors",
        redirect: "follow"
      })
      .then(r => {
        if (!r.ok) throw new Error("HTTP Status " + r.status);
        return r.json();
      })
      .then(res => {
        if (res.status === "success" && Array.isArray(res.slots)) {
          container.innerHTML = "";
          res.slots.forEach(s => {
            let btn = document.createElement('button');
            const isBlocked = s.isBlocked;
            btn.className = `${isBlocked ? 'slot-blocked' : 'slot-open'} p-3 rounded-2xl text-xs font-bold transition active:scale-95 text-center flex flex-col justify-center items-center shadow-sm`;
            btn.innerHTML = `
              <div class="text-[10px] ${isBlocked ? 'text-rose-800' : 'text-emerald-800'} font-extrabold mb-0.5">คิวที่ ${s.queue}</div>
              <div class="font-bold">${s.time}</div>
              <div class="text-[9px] ${isBlocked ? 'text-rose-600' : 'text-emerald-600'} font-extrabold mt-1">
                ${isBlocked ? '🔴 เต็ม (ปิด)' : '🟢 ว่าง (เปิด)'}
              </div>
              ${s.reason ? `<div class="text-[8px] text-slate-400 mt-0.5 truncate max-w-full">${s.reason}</div>` : ''}
            `;
            
            btn.onclick = () => toggleSlot(date, s.time, !isBlocked);
            container.appendChild(btn);
          });
        } else {
          throw new Error(res.message || "ข้อมูลไม่ถูกต้อง");
        }
      })
      .catch(err => {
        container.innerHTML = `
          <div class="col-span-2 text-center py-6">
            <div class="text-rose-500 text-xs font-bold mb-2">⚠️ ${err.message}</div>
            <button onclick="loadAdminSlots()" class="bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-xl active:scale-95 transition">
              🔄 กดเพื่อโหลดใหม่อีกครั้ง
            </button>
          </div>
        `;
      });
    }

    function toggleSlot(date, timeSlot, setBlocked) {
      fetch(WEB_URL, {
        method: "post",
        contentType: "application/json",
        body: JSON.stringify({
          action: "admin_toggle_slot",
          date: date,
          timeSlot: timeSlot,
          isBlocked: setBlocked
        })
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          loadAdminSlots();
        }
      });
    }

    function setAllDay(setBlocked) {
      const date = document.getElementById('manage-date').value;
      const confirmText = setBlocked ? "ต้องการปิดรับคิวทั้งวัน ใช่หรือไม่?" : "ต้องการเปิดรับคิวทั้งวัน ใช่หรือไม่?";
      if (!confirm(confirmText)) return;

      fetch(WEB_URL, {
        method: "post",
        contentType: "application/json",
        body: JSON.stringify({
          action: "admin_toggle_all_day",
          date: date,
          isBlocked: setBlocked
        })
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          loadAdminSlots();
        }
      });
    }
  </script>
</body>
</html>
