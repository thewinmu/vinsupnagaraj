<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบสมาชิก • วินทร์ทรัพย์นาคราช</title>
  
  <!-- โหลด Tailwind CSS และ LINE LIFF SDK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: #022015;
      background-image: radial-gradient(circle at 50% 0%, #064e3b 0%, transparent 70%);
      color: #fafaf9;
      min-height: 100vh;
      margin: 0;
    }
    .gold-text {
      background: linear-gradient(135deg, #fef08a 0%, #fde047 50%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card-luxury {
      background: linear-gradient(145deg, rgba(6, 78, 59, 0.6) 0%, rgba(2, 32, 21, 0.9) 100%);
      border: 1px solid rgba(234, 179, 8, 0.5);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(234, 179, 8, 0.1);
    }
    .btn-gold {
      background: linear-gradient(135deg, #fde047 0%, #ca8a04 100%);
      color: #022015;
      font-weight: 800;
      border-radius: 9999px;
      box-shadow: 0 4px 15px rgba(234, 179, 8, 0.3);
    }
    .pulse-loading { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.05); } }
  </style>
</head>
<body class="p-5 max-w-md mx-auto flex flex-col pb-12">

  <div class="flex items-center justify-between py-4 mb-2">
    <button onclick="window.location.href='./index.html'" class="text-xs font-semibold text-amber-300 px-3 py-1 rounded-full border border-amber-500/30 bg-black/30">⟨ กลับหน้าร้าน</button>
    <div class="text-lg text-amber-400 font-bold">วินทร์ทรัพย์นาคราช</div>
  </div>

  <div class="text-center mb-6">
    <h1 class="text-2xl font-extrabold gold-text tracking-wide">บัญชีมงคล</h1>
  </div>

  <!-- 1. หน้าแรก (ปุ่มสมัครสมาชิก) -->
  <div id="section-login" class="card-luxury p-8 text-center space-y-6">
    <div class="text-6xl mb-4">🐍</div>
    <h2 class="text-lg font-bold text-white">ลงทะเบียนรับสิทธิ์</h2>
    <p class="text-xs text-emerald-100/80 leading-relaxed">
      สมัครสมาชิกฟรีผ่านบัญชี LINE ของคุณ<br>พร้อมรับสิทธิ์เสี่ยงทาย Pick a Card ฟรี 10 ครั้ง
    </p>
    <button onclick="loginAndRegister()" class="btn-gold w-full py-4 text-sm mt-4 flex items-center justify-center gap-2">
      <span class="text-lg">👑</span> สมัครสมาชิก / ตรวจสอบสิทธิ์
    </button>
  </div>

  <!-- 2. หน้าโหลด -->
  <div id="section-loading" style="display: none;" class="py-20 text-center space-y-4">
    <div class="text-5xl pulse-loading">🐍</div>
    <p class="text-xs font-semibold text-amber-300 tracking-widest pulse-loading" id="loading-text">กำลังเชื่อมต่อระบบ...</p>
  </div>

  <!-- 3. หน้าบัตรสมาชิก -->
  <div id="section-member" style="display: none;" class="space-y-6 mt-4">
    <div class="card-luxury p-6 flex flex-col items-center text-center">
      <div class="w-16 h-16 rounded-full bg-gradient-to-br from-amber-200 to-amber-600 p-1 mb-3">
        <div class="w-full h-full bg-black rounded-full flex items-center justify-center text-2xl overflow-hidden" id="profile-img">👤</div>
      </div>
      <div class="text-amber-400 font-bold tracking-widest uppercase text-xs mb-1">MEMBER CODE</div>
      <div class="text-2xl font-extrabold gold-text font-mono tracking-widest bg-black/40 px-4 py-1 rounded-lg border border-amber-500/30 mb-4" id="m-code">B000</div>
      
      <div class="w-full border-t border-amber-500/20 pt-4 grid grid-cols-2 gap-2 text-left">
        <div>
          <div class="text-[10px] text-emerald-300 mb-1">ชื่อบัญชี</div>
          <div class="text-sm font-bold text-white truncate" id="m-name">-</div>
        </div>
        <div class="text-right">
          <div class="text-[10px] text-emerald-300 mb-1">สถานะ</div>
          <div class="text-sm font-bold gold-text" id="m-privilege">-</div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="card-luxury p-4 text-center">
        <div class="text-[11px] text-amber-200 font-bold mb-1">ยอดทรัพย์คงเหลือ</div>
        <div class="text-xl font-extrabold text-white"><span id="m-balance">0</span> <span class="text-xs">฿</span></div>
      </div>
      <div class="card-luxury p-4 text-center">
        <div class="text-[11px] text-amber-200 font-bold mb-1">สิทธิ์เสี่ยงทายฟรี</div>
        <div class="text-xl font-extrabold text-white"><span id="m-free">0</span> <span class="text-xs">ครั้ง</span></div>
      </div>
    </div>

    <button onclick="window.location.href='./pickacard_hub.html'" class="btn-gold w-full py-4 text-xs uppercase font-bold tracking-wider mt-4">
      🔮 เข้าสู่ระบบเสี่ยงทาย Pick a Card
    </button>
  </div>

  <!-- กล่องแสดง Error -->
  <div id="error-box" class="hidden mt-6 p-4 bg-red-900/80 border border-red-500 rounded-xl text-xs text-red-200 text-center leading-relaxed"></div>

  <script>
    // กำหนดค่าคอนฟิกไว้โดยตรงในหน้านี้ ตัดปัญหาเรื่องหาไฟล์ config.js ไม่พบ
    const WEB_URL = "https://script.google.com/macros/s/AKfycbxXRJyClfhGCLyG3plwkuCBzbwsIQdPiy0X11f3EbCvL2Dj-y2sCenNFiqjMdKNoqhf/exec";
    const LIFF_ID = "2007499712-J15McRGz";

    function showError(msg) {
      document.getElementById('section-loading').style.display = 'none';
      document.getElementById('section-login').style.display = 'block';
      const errBox = document.getElementById('error-box');
      errBox.innerHTML = `⚠️ <b>เกิดข้อผิดพลาด:</b><br>${msg}`;
      errBox.style.display = 'block';
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof liff !== 'undefined' && LIFF_ID) {
        liff.init({ liffId: LIFF_ID }).catch(err => console.error("LIFF Init Error:", err));
      }
    });

    function loginAndRegister() {
      document.getElementById('section-login').style.display = 'none';
      document.getElementById('error-box').style.display = 'none';
      document.getElementById('section-loading').style.display = 'block';
      document.getElementById('loading-text').innerText = "กำลังตรวจสอบบัญชี LINE...";

      if (typeof liff !== 'undefined' && liff.isInClient()) {
        if (!liff.isLoggedIn()) {
          liff.login();
        } else {
          liff.getProfile()
            .then(p => fetchUserData(p.userId, p.displayName, p.pictureUrl))
            .catch(err => showError("ไม่สามารถดึงข้อมูลโปรไฟล์ LINE ได้: " + err.message));
        }
      } else if (typeof liff !== 'undefined' && !liff.isInClient() && liff.isLoggedIn()) {
         liff.getProfile().then(p => fetchUserData(p.userId, p.displayName, p.pictureUrl));
      } else if (typeof liff !== 'undefined' && !liff.isInClient() && !liff.isLoggedIn()) {
         liff.login();
      } else {
        // ทดสอบบนเบราว์เซอร์คอมพิวเตอร์
        fetchUserData("test_user_001", "ผู้ศรัทธา (ทดสอบ)", "");
      }
    }

    function fetchUserData(uid, uname, picUrl) {
      document.getElementById('loading-text').innerText = "กำลังดึงข้อมูลจาก Google Sheets...";
      
      const targetUrl = `${WEB_URL}?action=login_or_register&userId=${encodeURIComponent(uid)}&name=${encodeURIComponent(uname)}`;
      
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);

      fetch(targetUrl, { signal: controller.signal })
        .then(r => {
          clearTimeout(timeoutId);
          return r.json();
        })
        .then(res => {
          document.getElementById('section-loading').style.display = 'none';
          
          if (res && res.status === "success") {
            document.getElementById('m-name').innerText = res.name;
            document.getElementById('m-code').innerText = res.memberCode;
            document.getElementById('m-free').innerText = res.freeQuota;
            document.getElementById('m-balance').innerText = Number(res.balance).toLocaleString();
            document.getElementById('m-privilege').innerText = res.specialPrivilege || "สิทธิ์มาตรฐาน";

            if (picUrl) {
              document.getElementById('profile-img').innerHTML = `<img src="${picUrl}" class="w-full h-full rounded-full object-cover">`;
            }

            document.getElementById('section-member').style.display = 'block';
          } else {
            showError("เซิร์ฟเวอร์ตอบกลับแต่ข้อมูลไม่ถูกต้อง (เช็คแท็บ member ใน Google Sheets)");
          }
        })
        .catch((err) => {
          clearTimeout(timeoutId);
          if (err.name === 'AbortError') {
            showError("การเชื่อมต่อหมดเวลา (Timeout 10 วินาที) Google Sheets ตอบช้าเกินไป");
          } else {
            showError(`เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ<br>รายละเอียด: ${err.message}`);
          }
        });
    }
  </script>
</body>
</html>
