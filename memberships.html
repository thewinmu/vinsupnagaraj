<script>
    let currentUser = null;
    let currentHistory = [];
    let currentUserId = "";
    // กำหนด URL ตั้งต้นชั่วคราวเพื่อให้ระบบยิงไปขอ URL จริงจาก Script Properties ในครั้งแรก
    let WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwWUVLc2LbWDgws-QYyUBqKkxGRor3APsXEjm1Ml9Xoj0A6X1fUDmXOw7jk9jeiSVgdmw/exec"; 

    window.onload = async function() {
      try {
        await liff.init({ liffId: "2007499712-J15McRGz" }); // LIFF ID ของคุณ
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        currentUserId = profile.userId;
        fetchAppData(currentUserId);
      } catch (err) {
        console.warn("รันในโหมดทดสอบเบราว์เซอร์");
        currentUserId = "U8065e05dc54f0ddc3fb46e97492eb53a"; // UserID จำลองสำหรับเทส
        fetchAppData(currentUserId);
      }
    };

    function fetchAppData(userId) {
      // ยิงไปที่ URL ตั้งต้นก่อน เพื่อดึง Web App URL จริงจาก Properties ผ่าน api_init
      const targetUrl = WEB_APP_URL.includes("placeholder") 
        ? "https://script.google.com/macros/s/AKfycbwWUVLc2LbWDgws-QYyUBqKkxGRor3APsXEjm1Ml9Xoj0A6X1fUDmXOw7jk9jeiSVgdmw/exec?action=api_init&userId=" + userId // <--- ใส่ URL เดบิวต์แรกสุดครั้งเดียวตรงนี้
        : WEB_APP_URL + "?action=api_init&userId=" + userId;

      fetch(targetUrl)
        .then(res => res.json())
        .then(data => {
          if (data) {
            // อัปเดต WEB_APP_URL เป็นค่าจริงจาก Script Properties อัตโนมัติ
            if (data.webAppUrl) {
              WEB_APP_URL = data.webAppUrl;
            }
            if (data.member) {
              currentUser = data.member;
              renderMemberCard();
            }
            if (data.history) {
              currentHistory = data.history;
            }
          }
        })
        .catch(err => console.error("API Error: ", err));
    }

    function renderMemberCard() {
      if (!currentUser) return;
      document.getElementById('card-name').innerText = currentUser.name;
      document.getElementById('card-code').innerText = currentUser.memberCode;
      document.getElementById('card-balance').innerHTML = currentUser.balance.toLocaleString() + ' <span class="text-xs font-normal text-slate-300">฿</span>';
      document.getElementById('stat-free').innerHTML = currentUser.remainingFree + ' <span class="text-[10px] font-normal text-slate-400">ครั้ง</span>';
      document.getElementById('stat-points').innerHTML = currentUser.points.toLocaleString() + ' <span class="text-[10px] font-normal text-slate-400">แต้ม</span>';
      
      document.getElementById('info-phone').innerText = currentUser.phone || "-";
      document.getElementById('info-dob').innerText = currentUser.dob || "-";
      document.getElementById('info-address').innerText = currentUser.address || "-";
      document.getElementById('info-address').title = currentUser.address || "-";
    }

    // Modal Control: History & Points
    function openHistoryModal() {
      if (!currentUser) return;
      document.getElementById('modal-points').innerText = currentUser.points.toLocaleString() + " แต้ม";
      
      const listContainer = document.getElementById('history-list');
      if (currentHistory && currentHistory.length > 0) {
        listContainer.innerHTML = currentHistory.map(h => `
          <div class="p-3 bg-slate-950/60 rounded-xl border border-slate-800 text-xs flex justify-between items-center">
            <div>
              <p class="font-bold text-white">${h.detail}</p>
              <p class="text-[10px] text-slate-400">${h.date}</p>
            </div>
            <span class="text-amber-400 font-bold">${h.amount > 0 ? h.amount.toLocaleString() + ' ฿' : 'ฟรี'}</span>
          </div>
        `).join('');
      } else {
        listContainer.innerHTML = `<p class="text-center text-xs text-slate-500 py-4">ยังไม่มีประวัติการใช้บริการ</p>`;
      }

      const modal = document.getElementById('history-modal');
      const content = document.getElementById('history-content');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0', 'pointer-events-none');
        content.classList.remove('scale-95', 'opacity-0');
      }, 10);
    }

    function closeHistoryModal() {
      const modal = document.getElementById('history-modal');
      const content = document.getElementById('history-content');
      modal.classList.add('opacity-0', 'pointer-events-none');
      content.classList.add('scale-95', 'opacity-0');
      setTimeout(() => { modal.classList.add('hidden'); }, 300);
    }

    // Modal Control: Edit Profile
    function openEditModal() {
      if (!currentUser) return;
      document.getElementById('input-name').value = currentUser.name === "อนุบาล" ? "" : currentUser.name;
      document.getElementById('input-phone').value = currentUser.phone === "-" ? "" : currentUser.phone;
      document.getElementById('input-dob').value = currentUser.dob === "-" ? "" : currentUser.dob;
      document.getElementById('input-address').value = currentUser.address === "-" ? "" : currentUser.address;
      
      const modal = document.getElementById('edit-modal');
      const content = document.getElementById('edit-content');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0', 'pointer-events-none');
        content.classList.remove('scale-95', 'opacity-0');
      }, 10);
    }

    function closeEditModal() {
      const modal = document.getElementById('edit-modal');
      const content = document.getElementById('edit-content');
      modal.classList.add('opacity-0', 'pointer-events-none');
      content.classList.add('scale-95', 'opacity-0');
      setTimeout(() => { modal.classList.add('hidden'); }, 300);
    }

    // Modal Control: Topup Wallet & Copy Account Number
    function openTopupModal() {
      const modal = document.getElementById('topup-modal');
      const content = document.getElementById('topup-content');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0', 'pointer-events-none');
        content.classList.remove('scale-95', 'opacity-0');
      }, 10);
    }

    function closeTopupModal() {
      const modal = document.getElementById('topup-modal');
      const content = document.getElementById('topup-content');
      modal.classList.add('opacity-0', 'pointer-events-none');
      content.classList.add('scale-95', 'opacity-0');
      setTimeout(() => { modal.classList.add('hidden'); }, 300);
    }

    function copyAccNo() {
      const accNo = document.getElementById('bank-accno').innerText;
      navigator.clipboard.writeText(accNo).then(() => {
        alert("📋 คัดลอกเลขบัญชี " + accNo + " เรียบร้อยแล้ว!");
      }).catch(err => {
        alert("ไม่สามารถคัดลอกอัตโนมัติได้ กรุณาจดเลขบัญชีแทนครับ");
      });
    }

    function submitEditForm(event) {
      event.preventDefault();
      const btnSave = document.getElementById('btn-save');
      btnSave.innerText = "กำลังบันทึก...";
      btnSave.disabled = true;

      const payload = {
        liffAction: "UPDATE_MEMBER",
        userId: currentUserId,
        name: document.getElementById('input-name').value,
        phone: document.getElementById('input-phone').value,
        dob: document.getElementById('input-dob').value,
        address: document.getElementById('input-address').value
      };

      // ใช้ WEB_APP_URL ที่ดึงมาจาก Properties อัตโนมัติส่งข้อมูล POST
      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(result => {
        if(result.status === "success") {
          alert("✅ บันทึกข้อมูลส่วนตัวเรียบร้อยแล้วครับ!");
          closeEditModal();
          fetchAppData(currentUserId);
        } else {
          alert("⚠️ " + (result.message || "เกิดข้อผิดพลาด"));
        }
        btnSave.innerText = "บันทึกข้อมูล";
        btnSave.disabled = false;
      })
      .catch(err => {
        alert("❌ เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง");
        btnSave.innerText = "บันทึกข้อมูล";
        btnSave.disabled = false;
      });
    }
  </script>
