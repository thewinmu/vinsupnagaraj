<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบจองคิวบริการ • วินทร์ทรัพย์นาคราช</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #064e3b 0%, #022c22 50%, #022015 100%);
      color: #fafaf9;
      min-height: 100vh;
      margin: 0;
    }
    .gold-text {
      background: linear-gradient(135deg, #fef08a 0%, #fde047 50%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card-soft-luxury {
      background: rgba(6, 78, 59, 0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(234, 179, 8, 0.3);
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .btn-gold {
      background: linear-gradient(135deg, #fde047 0%, #ca8a04 100%);
      color: #022015;
      font-weight: 800;
      border-radius: 9999px;
      box-shadow: 0 4px 15px rgba(234, 179, 8, 0.2);
      transition: transform 0.2s;
    }
    .btn-gold:active { transform: scale(0.96); }
  </style>
</head>
<body class="p-5 max-w-md mx-auto flex flex-col pb-12">

  <!-- Header -->
  <div class="flex items-center justify-between py-4 mb-2">
    <button onclick="window.location.href='./index.html'" class="text-xs font-semibold text-amber-300 px-3 py-1 rounded-full border border-amber-500/30 bg-black/20">⟨ กลับหน้าร้าน</button>
    <div class="text-lg text-amber-400 font-bold">วินทร์ทรัพย์นาคราช</div>
  </div>

  <div class="text-center mb-6">
    <h1 class="text-2xl font-extrabold gold-text tracking-wide">จองคิวบริการมงคล</h1>
    <p class="text-xs text-emerald-200/80 mt-1">เลือกบริการและรอบเวลาที่คุณต้องการ</p>
  </div>

  <!-- กล่องประกาศสถานะจาก Admin (ถ้าปิดรับจองจะแสดงตรงนี้) -->
  <div id="admin-notice" class="hidden mb-6 p-4 rounded-2xl bg-amber-950/80 border border-amber-500/60 text-center text-xs text-amber-200 leading-relaxed shadow-lg">
    ⚠️ <span id="notice-text">ขณะนี้ระบบปิดรับจองคิวชั่วคราว</span>
  </div>

  <!-- รายการบริการจาก Sheet Product -->
  <div id="service-list" class="space-y-4">
    <div class="text-center py-10 text-amber-300 animate-pulse text-xs">กำลังโหลดบริการมงคล...</div>
  </div>

  <!-- Modal เลือกเวลาจอง -->
  <div id="booking-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="card-soft-luxury p-6 w-full max-w-sm space-y-4 bg-emerald-950/95 border border-amber-500/50">
      <div class="flex justify-between items-center border-b border-amber-500/20 pb-3">
        <h3 class="text-sm font-bold text-amber-300" id="modal-service-title">เลือกช่วงเวลานัดหมาย</h3>
        <button onclick="closeModal()" class="text-gray-400 text-sm px-2">✕</button>
      </div>
      
      <div class="space-y-2 text-xs">
        <label class="block text-emerald-200 font-medium">รอบเวลา (สถานะ ว่าง/เต็ม):</label>
        <div id="slot-container" class="space-y-2 max-h-48 overflow-y-auto pr-1">
          <div class="text-gray-400 text-center py-4">กำลังโหลดรอบเวลา...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const WEB_URL = "https://script.google.com/macros/s/AKfycbxXRJyClfhGCLyG3plwkuCBzbwsIQdPiy0X11f3EbCvL2Dj-y2sCenNFiqjMdKNoqhf/exec";
    let selectedService = "";
    let isBookingOpen = true;

    window.addEventListener('DOMContentLoaded', () => {
      checkBookingStatusAndLoad();
    });

    // 1. ตรวจสอบสถานะการเปิด-ปิดจาก Admin ก่อนโหลดหน้า
    function checkBookingStatusAndLoad() {
      fetch(`${WEB_URL}?action=get_booking_status`)
        .then(r => r.json())
        .then(res => {
          if (res && res.status === "success") {
            if (res.bookingStatus === "closed") {
              isBookingOpen = false;
              document.getElementById('notice-text').innerText = res.message || "ขณะนี้ปิดรับจองคิวชั่วคราว";
              document.getElementById('admin-notice').classList.remove('hidden');
            }
          }
          loadServices();
        })
        .catch(() => loadServices());
    }

    // 2. โหลดรายการบริการจากชีต product
    function loadServices() {
      fetch(`${WEB_URL}?action=get_shop_items`)
        .then(r => r.json())
        .then(res => {
          const container = document.getElementById('service-list');
          container.innerHTML = "";
          
          if(res && res.items && res.items.length > 0) {
            res.items.forEach(item => {
              // ถ้า Admin ปิดระบบ ปุ่มจองจะถูกปิดการใช้งานทันที
              const btnStyle = isBookingOpen ? "btn-gold cursor-pointer" : "bg-gray-700 text-gray-400 cursor-not-allowed opacity-50";
              const btnAction = isBookingOpen ? `onclick="openBookingModal('${item.name}')"` : "";
              
              container.innerHTML += `
                <div class="card-soft-luxury p-4 flex flex-col gap-3">
                  <div>
                    <div class="text-base font-bold text-white">${item.name}</div>
                    <div class="text-xs text-emerald-100/70 mt-1 leading-relaxed">${item.desc}</div>
                    <div class="text-sm font-extrabold gold-text mt-2">${item.price > 0 ? item.price.toLocaleString() + ' ฿' : 'บูชาฟรี'}</div>
                  </div>
                  <button ${btnAction} class="${btnStyle} w-full py-2.5 text-xs font-bold tracking-wide flex items-center justify-center gap-1">
                    ${isBookingOpen ? '🔮 จองคิวดูดวง' : '🔒 ปิดรับจองชั่วคราว'}
                  </button>
                </div>
              `;
            });
          } else {
            container.innerHTML = `<div class="text-center text-xs text-gray-400 py-10">ไม่พบรายการบริการในขณะนี้</div>`;
          }
        })
        .catch(() => {
          document.getElementById('service-list').innerHTML = `<div class="text-center text-xs text-red-300 py-10">ไม่สามารถเชื่อมต่อฐานข้อมูลได้</div>`;
        });
    }

    // 3. เปิด Modal เลือกเวลา พร้อมแสดงแถบสถานะ ว่าง/เต็ม
    function openBookingModal(serviceName) {
      if (!isBookingOpen) return;
      selectedService = serviceName;
      document.getElementById('modal-service-title').innerText = `จอง: ${serviceName}`;
      document.getElementById('booking-modal').classList.remove('hidden');
      
      loadTimeSlots();
    }

    function closeModal() {
      document.getElementById('booking-modal').classList.add('hidden');
    }

    // 4. ดึงข้อมูลรอบเวลาและสถานะ ว่าง/เต็ม จากชีต timeslots
    function loadTimeSlots() {
      const container = document.getElementById('slot-container');
      container.innerHTML = `<div class="text-gray-300 text-center py-3 text-xs">กำลังตรวจสอบรอบเวลา...</div>`;

      fetch(`${WEB_URL}?action=get_time_slots`)
        .then(r => r.json())
        .then(res => {
          container.innerHTML = "";
          const slots = (res && res.slots) ? res.slots : [
            { time: "13:00 - 14:00 น.", status: "open" },
            { time: "15:00 - 16:00 น.", status: "open" },
            { time: "17:00 - 18:00 น.", status: "full" }
          ]; // ค่าสำรองถ้ายังไม่ได้สร้างชีต timeslots

          slots.forEach(slot => {
            const isOpen = slot.status.toLowerCase() === "open";
            
            if (isOpen) {
              // สถานะ: ว่าง (เขียว)
              container.innerHTML += `
                <div class="p-3 rounded-xl bg-black/40 border border-emerald-500/30 flex items-center justify-between">
                  <div>
                    <div class="text-white font-bold">⏰ ${slot.time}</div>
                    <span class="inline-flex items-center gap-1 text-[10px] text-emerald-300 bg-emerald-950 px-2 py-0.5 rounded-full border border-emerald-500/30 mt-1">
                      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> ว่าง
                    </span>
                  </div>
                  <button onclick="confirmSlot('${slot.time}')" class="btn-gold px-3 py-1.5 text-xs">จอง</button>
                </div>
              `;
            } else {
              // สถานะ: เต็ม (แดง/เทา)
              container.innerHTML += `
                <div class="p-3 rounded-xl bg-black/50 border border-red-500/20 flex items-center justify-between opacity-70">
                  <div>
                    <div class="text-gray-400 font-bold">⏰ ${slot.time}</div>
                    <span class="inline-flex items-center gap-1 text-[10px] text-red-400 bg-red-950 px-2 py-0.5 rounded-full border border-red-500/30 mt-1">
                      <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span> เต็มแล้ว
                    </span>
                  </div>
                  <button disabled class="bg-gray-800 text-gray-500 px-3 py-1.5 text-xs rounded-full cursor-not-allowed">เต็ม</button>
                </div>
              `;
            }
          });
        })
        .catch(() => {
          container.innerHTML = `<div class="text-red-300 text-center py-3 text-xs">โหลดรอบเวลาไม่สำเร็จ</div>`;
        });
    }

    // 5. ยืนยันการจองคิว
    function confirmSlot(slotTime) {
      if (confirm(`ยืนยันการจองบริการ "${selectedService}" รอบเวลา ${slotTime} ใช่หรือไม่?`)) {
        alert(`✨ ทำการจองสำเร็จ! แอดมินบันทึกคิวของคุณเรียบร้อยแล้ว`);
        closeModal();
      }
    }
  </script>
</body>
</html>
