<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจองคิวพยากรณ์ | วินทร์ทรัพย์นาคราช</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F8FAFC; color: #0F172A; font-weight: 500; }
    .executive-card { background: #FFFFFF; border: 1px solid #E2E8F0; border-left: 4px solid #B45309; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4 max-w-md mx-auto justify-between">
  <div>
    <header class="text-center py-5 border-b mb-5 bg-white rounded-2xl shadow-sm px-4">
      <h1 class="text-base font-bold text-slate-900">วินทร์ทรัพย์นาคราช</h1>
      <p id="user-display" class="text-xs text-slate-500 mt-1">กำลังเชื่อมต่อ LINE...</p>
    </header>

    <div id="step-packages" class="space-y-3">
      <div class="text-center text-xs text-slate-400 py-10">กำลังโหลดบริการ...</div>
    </div>

    <div id="step-datetime" style="display: none;" class="space-y-4">
      <button onclick="backToPkgs()" class="text-xs font-bold text-slate-600 mb-2">❮ เลือกบริการอื่น</button>
      <div class="bg-white border rounded-xl p-3 text-sm font-bold text-slate-900" id="selected-pkg-txt"></div>
      
      <div>
        <label class="text-xs text-slate-700 block mb-1 font-bold">เลือกวันที่จอง (15 วัน)</label>
        <select id="booking-date" onchange="loadSlots()" class="w-full bg-white border rounded-xl p-3 text-sm font-semibold"></select>
      </div>

      <div>
        <label class="text-xs text-slate-700 block mb-1 font-bold">รอบเวลา 09:00 - 22:00 น.</label>
        <div id="slots-container" class="grid grid-cols-2 gap-2 max-h-56 overflow-y-auto p-1"></div>
      </div>
    </div>
  </div>

  <div id="action-box" style="display: none;" class="mt-6">
    <button id="sub-btn" onclick="submit()" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg">ยืนยันการจองคิว</button>
  </div>

  <script>
    const WEB_URL = "https://script.google.com/macros/s/AKfycbzlDSycXni3-s9YtjOmDbZA2ZH2iE_TFon1nOnBThCl6gYVyqL9rC3jxYe9WcwhXa5E9w/exec";
    let userId = "U8065e05dc54f0ddc3fb46e97492eb53a";
    let userName = "คุณลูกค้า";
    let booking = { packageName: "", price: 0, bookingDate: "", bookingTime: "" };

    window.onload = async function() {
      try {
        await liff.init({ liffId: "2007499712-B0uid9G3" });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          userId = profile.userId;
          userName = profile.displayName;
          document.getElementById('user-display').innerText = "ผู้ใช้งาน: " + userName;
        }
      } catch (e) {}

      initDates();

      const params = new URLSearchParams(window.location.search);
      let p = params.get('pkg'), pr = params.get('price');
      if (p && pr) {
        selectPkg(p, Number(pr));
      } else {
        loadPkgs();
      }
    };

    function initDates() {
      const sel = document.getElementById('booking-date');
      const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
      const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      for (let i = 0; i < 15; i++) {
        let d = new Date(); d.setDate(d.getDate() + i);
        let val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        let opt = document.createElement('option');
        opt.value = val;
        opt.innerText = `วัน${days[d.getDay()]}ที่ ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()+543}`;
        sel.appendChild(opt);
      }
    }

    function loadPkgs() {
      fetch(WEB_URL + "?action=get_packages").then(r => r.json()).then(res => {
        if (res.status === "success") {
          let c = document.getElementById('step-packages');
          c.innerHTML = "";
          res.packages.forEach(p => {
            let div = document.createElement('div');
            div.className = "executive-card rounded-xl p-4 cursor-pointer";
            div.onclick = () => selectPkg(p.name, p.price);
            div.innerHTML = `<div class="flex justify-between font-bold text-sm"><span>${p.name}</span><span>${p.price} ฿</span></div>`;
            c.appendChild(div);
          });
        }
      });
    }

    function selectPkg(name, price) {
      booking.packageName = name; booking.price = price;
      document.getElementById('step-packages').style.display = 'none';
      document.getElementById('step-datetime').style.display = 'block';
      document.getElementById('selected-pkg-txt').innerText = name + " (" + price + " บาท)";
      loadSlots();
    }

    function loadSlots() {
      let date = document.getElementById('booking-date').value;
      fetch(WEB_URL + "?action=check_slots&date=" + date).then(r => r.json()).then(res => {
        let c = document.getElementById('slots-container');
        c.innerHTML = "";
        res.slots.forEach(s => {
          let btn = document.createElement('button');
          if (s.available) {
            btn.className = "bg-emerald-50 border border-emerald-300 p-2.5 rounded-xl text-xs font-bold text-emerald-900";
            btn.innerText = "🟩 " + s.time;
            btn.onclick = () => {
              booking.bookingTime = s.time;
              document.querySelectorAll('#slots-container button').forEach(b => b.classList.remove('ring-2', 'ring-slate-900'));
              btn.classList.add('ring-2', 'ring-slate-900');
              document.getElementById('action-box').style.display = 'block';
            };
          } else {
            btn.className = "bg-slate-100 border p-2.5 rounded-xl text-xs font-bold text-slate-400 opacity-60";
            btn.innerText = "🟥 " + s.time; btn.disabled = true;
          }
          c.appendChild(btn);
        });
      });
    }

    function backToPkgs() {
      document.getElementById('step-datetime').style.display = 'none';
      document.getElementById('step-packages').style.display = 'block';
      document.getElementById('action-box').style.display = 'none';
    }

    function submit() {
      booking.bookingDate = document.getElementById('booking-date').value;
      if (!booking.bookingDate || !booking.bookingTime) return alert("กรุณาเลือกวันและรอบเวลา");

      let btn = document.getElementById('sub-btn');
      btn.innerText = "กำลังส่งข้อมูล..."; btn.disabled = true;

      fetch(WEB_URL, {
        method: "post", contentType: "application/json",
        body: JSON.stringify({ action: "create_booking", userId, customerName: userName, ...booking })
      }).then(r => r.json()).then(res => {
        if (res.status === "success") {
          setTimeout(() => { if (liff.isInClient()) liff.closeWindow(); else window.close(); }, 300);
        } else {
          alert(res.message); btn.innerText = "ยืนยันการจองคิว"; btn.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
