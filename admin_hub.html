<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin CRM • วินทร์ทรัพย์นาคราช</title>
  
  <script src="./config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F8FAFC; color: #0F172A; -webkit-tap-highlight-color: transparent; }
    .glass-header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #E2E8F0; }
    .admin-card { background: #FFFFFF; border: 1px solid #E2E8F0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); transition: all 0.2s; }
  </style>
</head>
<body class="pb-20">

  <!-- Header -->
  <header class="glass-header sticky top-0 z-40 px-4 py-3 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-2">
      <div class="bg-slate-800 text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold text-sm">🛡️</div>
      <div>
        <h1 class="text-sm font-black text-slate-800 leading-tight">ADMIN SYSTEM</h1>
        <p class="text-[10px] text-slate-500 font-medium" id="admin-status">ตรวจสอบสิทธิ์...</p>
      </div>
    </div>
    <div class="text-[10px] font-bold bg-emerald-100 text-emerald-700 px-2 py-1 rounded-md">🟢 ONLINE</div>
  </header>

  <!-- Search Section -->
  <div class="p-4">
    <h2 class="text-xs font-bold text-slate-500 mb-2 uppercase tracking-wide">ค้นหาข้อมูลสมาชิก</h2>
    <div class="flex gap-2">
      <input type="text" id="search-keyword" placeholder="ชื่อ, รหัส (Mxxxx), หรือเบอร์โทร..." class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-500 bg-white shadow-inner">
      <button onclick="searchUsers()" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-bold shadow hover:bg-slate-700 active:scale-95 transition">
        🔍 ค้นหา
      </button>
    </div>
  </div>

  <!-- Results Section -->
  <div class="px-4 pb-4">
    <div id="loading-spinner" style="display: none;" class="text-center py-8 text-slate-400 text-xs font-bold">
      <div class="text-2xl mb-2 animate-spin">⏳</div>กำลังค้นหาฐานข้อมูล...
    </div>
    <div id="results-container" class="space-y-3">
      <!-- การ์ดสมาชิกจะแสดงที่นี่ -->
      <div class="text-center py-8 text-slate-400 text-xs">พิมพ์ข้อมูลและกดค้นหาเพื่อดึงข้อมูลลูกดวง</div>
    </div>
  </div>

  <!-- MODAL: แก้ไขข้อมูล -->
  <div id="edit-modal" style="display: none;" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center sm:p-4">
    <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl animate-fade-up">
      <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
        <h3 class="text-sm font-black text-slate-800 flex items-center gap-2">
          <span class="text-xl">✏️</span> แก้ไขข้อมูลสมาชิก
        </h3>
        <button onclick="closeEditModal()" class="text-slate-400 font-bold text-lg px-2 hover:text-slate-600">✕</button>
      </div>

      <div class="text-xs text-slate-500 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-100">
        <div class="font-bold text-slate-800 text-sm mb-0.5" id="edit-display-name">-</div>
        <div class="font-mono text-[10px]" id="edit-display-code">ID: -</div>
      </div>

      <div class="space-y-3 text-sm">
        <input type="hidden" id="edit-target-uid">
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] font-bold text-slate-500 block mb-1">ยอดเงินคงเหลือ (฿)</label>
            <input type="number" id="edit-balance" class="w-full border border-slate-300 rounded-lg px-3 py-2 font-bold text-emerald-700 bg-emerald-50 focus:outline-none focus:ring-1 focus:ring-slate-400">
          </div>
          <div>
            <label class="text-[10px] font-bold text-slate-500 block mb-1">สิทธิ์ฟรีคงเหลือ (ครั้ง)</label>
            <input type="number" id="edit-free" class="w-full border border-slate-300 rounded-lg px-3 py-2 font-bold text-amber-600 bg-amber-50 focus:outline-none focus:ring-1 focus:ring-slate-400">
          </div>
        </div>

        <div>
          <label class="text-[10px] font-bold text-slate-500 block mb-1">สถานะสิทธิพิเศษ (Col M)</label>
          <input type="text" id="edit-privilege" placeholder="เช่น ใช้งานฟรี 1 เดือน, หรือเว้นว่างไว้" class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-slate-400">
        </div>

        <div>
          <label class="text-[10px] font-bold text-slate-500 block mb-1">หมายเหตุการแก้ไข (Admin Note)</label>
          <input type="text" id="edit-note" placeholder="เช่น เติมเงินผ่านสลิป 100 บ." class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-slate-400 bg-slate-50">
        </div>
      </div>

      <div class="mt-5 flex gap-2">
        <button onclick="closeEditModal()" class="flex-1 bg-slate-100 text-slate-600 py-3 rounded-xl text-xs font-bold hover:bg-slate-200 transition">ยกเลิก</button>
        <button onclick="submitUpdate()" id="btn-save" class="flex-1 bg-slate-800 text-white py-3 rounded-xl text-xs font-bold shadow-lg hover:bg-slate-700 transition flex justify-center items-center gap-2">
          💾 บันทึกข้อมูล
        </button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_URL = "https://script.google.com/macros/s/AKfycbw9RJdnqieYUY6QombS0Zmkkim0C8zecq71k0p7kMvwRPzy_Y5NMr8D54WHjd2qUCodEA/exec";
    const WEB_URL = (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.WEB_URL) ? APP_CONFIG.WEB_URL : DEFAULT_URL;

    // สำหรับทดสอบนอกแอป LINE (กรณีใช้งานผ่านคอม จะใช้ M0001 โดยอัตโนมัติจากฝั่ง Backend)
    let currentAdminId = "guest_user"; 
    let currentAdminName = "Admin";

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof liff !== 'undefined') {
        liff.init({ liffId: "2007499712-B0uid9G3" }).then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile().then(p => {
              currentAdminId = p.userId;
              currentAdminName = p.displayName;
              document.getElementById('admin-status').innerText = "ยินดีต้อนรับ, " + currentAdminName;
            });
          }
        }).catch(e => console.warn(e));
      } else {
        document.getElementById('admin-status').innerText = "โหมดทดสอบนอกระบบ LINE";
      }
    });

    function searchUsers() {
      const kw = document.getElementById('search-keyword').value.trim();
      const container = document.getElementById('results-container');
      const loader = document.getElementById('loading-spinner');
      
      container.innerHTML = "";
      loader.style.display = "block";

      const url = `${WEB_URL}?action=admin_search&adminId=${encodeURIComponent(currentAdminId)}&keyword=${encodeURIComponent(kw)}&_t=${Date.now()}`;
      
      fetch(url)
        .then(r => r.json())
        .then(res => {
          loader.style.display = "none";
          if (res.status === "error") {
            container.innerHTML = `<div class="bg-red-50 text-red-600 p-4 rounded-xl text-xs font-bold border border-red-200 text-center">❌ ${res.message}</div>`;
            return;
          }

          if (!res.data || res.data.length === 0) {
            container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">ไม่พบข้อมูลสมาชิกที่ค้นหา</div>`;
            return;
          }

          res.data.forEach(user => {
            const card = document.createElement('div');
            card.className = "admin-card p-4 rounded-2xl relative overflow-hidden";
            card.innerHTML = `
              <div class="flex justify-between items-start mb-3">
                <div>
                  <div class="text-sm font-black text-slate-800">${user.name}</div>
                  <div class="text-[10px] text-slate-500 font-mono mt-0.5">${user.memberCode} | โทร: ${user.phone !== "-" ? user.phone : "ไม่มี"}</div>
                </div>
                <button onclick='openEditModal(${JSON.stringify(user)})' class="bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-lg text-[10px] font-black border border-emerald-200 hover:bg-emerald-200 transition">
                  ✏️ แก้ไข
                </button>
              </div>
              <div class="grid grid-cols-3 gap-2 border-t border-slate-100 pt-3">
                <div class="text-center">
                  <div class="text-[9px] text-slate-400 font-bold mb-0.5">ยอดเงิน (฿)</div>
                  <div class="text-xs font-black text-emerald-600">${Number(user.balance).toLocaleString()}</div>
                </div>
                <div class="text-center border-l border-r border-slate-100">
                  <div class="text-[9px] text-slate-400 font-bold mb-0.5">สิทธิ์ฟรี (ครั้ง)</div>
                  <div class="text-xs font-black text-amber-600">${user.freeQuota}</div>
                </div>
                <div class="text-center">
                  <div class="text-[9px] text-slate-400 font-bold mb-0.5">แต้มสะสม</div>
                  <div class="text-xs font-black text-indigo-600">${user.points}</div>
                </div>
              </div>
              ${user.specialPrivilege ? `<div class="mt-2 bg-amber-50 border border-amber-100 text-amber-700 text-[9px] font-bold px-2 py-1 rounded-md text-center w-full truncate">👑 สิทธิ์: ${user.specialPrivilege}</div>` : ''}
            `;
            container.appendChild(card);
          });
        })
        .catch(err => {
          loader.style.display = "none";
          container.innerHTML = `<div class="text-center py-4 text-red-500 text-xs">เกิดข้อผิดพลาดในการเชื่อมต่อ</div>`;
        });
    }

    function openEditModal(user) {
      document.getElementById('edit-target-uid').value = user.userId;
      document.getElementById('edit-display-name').innerText = user.name;
      document.getElementById('edit-display-code').innerText = "รหัสสมาชิก: " + user.memberCode;
      
      document.getElementById('edit-balance').value = user.balance;
      document.getElementById('edit-free').value = user.freeQuota;
      document.getElementById('edit-privilege').value = user.specialPrivilege;
      document.getElementById('edit-note').value = ""; // เคลียร์ Note ทุกครั้งที่เปิดใหม่

      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
    }

    function submitUpdate() {
      const targetUid = document.getElementById('edit-target-uid').value;
      const balance = document.getElementById('edit-balance').value;
      const freeQuota = document.getElementById('edit-free').value;
      const privilege = document.getElementById('edit-privilege').value;
      const note = document.getElementById('edit-note').value;
      
      const btn = document.getElementById('btn-save');
      btn.innerText = "⏳ กำลังบันทึก...";
      btn.disabled = true;

      const url = `${WEB_URL}?action=admin_update&adminId=${encodeURIComponent(currentAdminId)}&targetUserId=${encodeURIComponent(targetUid)}&balance=${encodeURIComponent(balance)}&freeQuota=${encodeURIComponent(freeQuota)}&privilege=${encodeURIComponent(privilege)}&note=${encodeURIComponent(note)}`;

      fetch(url)
        .then(r => r.json())
        .then(res => {
          btn.innerText = "💾 บันทึกข้อมูล";
          btn.disabled = false;
          
          if (res.status === "success") {
            alert("✅ บันทึกข้อมูลเรียบร้อยแล้ว");
            closeEditModal();
            searchUsers(); // ค้นหาใหม่เพื่ออัปเดตหน้าจอ
          } else {
            alert("❌ " + res.message);
          }
        })
        .catch(err => {
          btn.innerText = "💾 บันทึกข้อมูล";
          btn.disabled = false;
          alert("⚠️ เกิดข้อผิดพลาดในการเชื่อมต่อ");
        });
    }
  </script>
</body>
</html>
