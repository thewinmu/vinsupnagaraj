<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สมาชิก • วินทร์ทรัพย์นาคราช</title>
  <script src="./config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F8F9FA; color: #1D1D1F; min-height: 100vh; }
    .gold-text { background: linear-gradient(135deg, #D4AF37 0%, #FDE08B 50%, #B48608 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .glass-box { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(212, 175, 55, 0.3); border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
    .gold-card { background: linear-gradient(135deg, #121212 0%, #064E3B 70%, #000000 100%); border: 1px solid rgba(212, 175, 55, 0.5); border-radius: 24px; color: #FDE08B; }
    .btn-gold { background: #121212; color: #FDE08B; border: 1px solid rgba(212, 175, 55, 0.6); border-radius: 9999px; }
  </style>
</head>
<body class="p-4 max-w-md mx-auto flex flex-col justify-between pb-10">
  <div>
    <!-- Header -->
    <header class="text-center py-4 glass-box mb-5 px-4">
      <div class="text-[10px] font-semibold tracking-widest text-slate-500 uppercase mb-1">✦ วินทร์ทรัพย์นาคราช ✦</div>
      <h1 class="text-xl font-bold gold-text">MEMBERSHIP</h1>
    </header>

    <!-- ยังไม่เป็นสมาชิก -->
    <div id="box-unregistered" style="display: none;" class="glass-box p-8 text-center my-10">
      <div class="text-4xl mb-3">🏷️</div>
      <h2 class="text-base font-bold text-gray-900 mb-1">ยังไม่พบข้อมูลสมาชิก</h2>
      <p class="text-xs text-gray-500 mb-6">กดปุ่มด้านล่างเพื่อสมัครสมาชิกรับสิทธิ์ฟรี 10 ครั้ง</p>
      <button onclick="registerMember()" id="btn-reg" class="btn-gold w-full py-4 text-xs font-semibold shadow">📝 สมัครสมาชิกทันที</button>
    </div>

    <!-- ข้อมูลสมาชิก -->
    <div id="box-member" style="display: none;">
      <div class="gold-card p-6 mb-5 shadow-lg">
        <div class="flex justify-between items-start mb-6">
          <div>
            <div class="text-[9px] tracking-widest text-[#A7F3D0] uppercase mb-1">Naga Win Sap Member</div>
            <div class="text-xl font-bold text-white" id="m-name">เจ้านางน้อย</div>
            <div class="text-[11px] font-mono mt-1 text-[#D4AF37]" id="m-code">ID: -</div>
          </div>
          <div class="w-10 h-10 rounded-full bg-black/50 border border-[#D4AF37]/60 flex items-center justify-center text-lg">🐍</div>
        </div>
        <div class="grid grid-cols-3 gap-2 pt-4 border-t border-[#D4AF37]/30 text-center">
          <div><div class="text-[10px] text-[#A7F3D0] mb-1">สิทธิ์ฟรี</div><div class="text-base font-semibold text-white" id="m-free">-</div></div>
          <div><div class="text-[10px] text-[#A7F3D0] mb-1">ยอดเงิน (฿)</div><div class="text-base font-semibold text-white" id="m-balance">-</div></div>
          <div><div class="text-[10px] text-[#A7F3D0] mb-1">แต้ม</div><div class="text-base font-semibold text-white" id="m-points">-</div></div>
        </div>
      </div>

      <div class="glass-box p-5 mb-5 space-y-3 text-xs">
        <div class="flex justify-between pb-2 border-b border-gray-100"><span class="text-gray-500">สถานะสิทธิ์</span><span class="font-semibold text-[#B48608]" id="m-privilege">สิทธิ์มาตรฐาน</span></div>
        <div class="flex justify-between"><span class="text-gray-500">เบอร์โทรศัพท์</span><span class="font-medium text-gray-800" id="m-phone">-</span></div>
        <div class="flex justify-between"><span class="text-gray-500">อีเมล</span><span class="font-medium text-gray-800" id="m-email">-</span></div>
        <div class="pt-1"><span class="text-gray-500 block mb-1">ที่อยู่จัดส่ง</span><div class="font-medium text-gray-800 bg-gray-50 p-2.5 rounded-xl border border-gray-100" id="m-address">-</div></div>
      </div>
    </div>

    <button onclick="window.location.href='./pickacard_hub.html'" class="btn-gold w-full py-4 text-sm font-semibold flex items-center justify-center gap-2 mt-4">
      <span>🔮</span> ไปหน้าพยากรณ์ Pick a Card
    </button>
  </div>

  <script>
    const WEB_URL = (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.WEB_URL) ? APP_CONFIG.WEB_URL : "";
    let currentUserId = "guest_user";

    window.addEventListener('DOMContentLoaded', () => {
      if (typeof liff !== 'undefined') {
        liff.init({ liffId: "2007499712-J15McRGz" }).then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile().then(p => { currentUserId = p.userId; loadData(); });
          } else { loadData(); }
        }).catch(() => { loadData(); });
      } else { loadData(); }
    });

    function loadData() {
      fetch(`${WEB_URL}?action=check_user_quota&userId=${encodeURIComponent(currentUserId)}`)
        .then(r => r.json())
        .then(res => {
          if (res && res.isMember) {
            document.getElementById('box-unregistered').style.display = 'none';
            document.getElementById('box-member').style.display = 'block';
            document.getElementById('m-name').innerText = res.name || "เจ้านางน้อย";
            document.getElementById('m-code').innerText = "ID: " + res.memberCode;
            document.getElementById('m-free').innerText = res.freeQuota || 0;
            document.getElementById('m-balance').innerText = Number(res.balance || 0).toLocaleString();
            document.getElementById('m-points').innerText = res.points || 0;
            document.getElementById('m-phone').innerText = res.phone !== "-" ? res.phone : "ยังไม่ระบุ";
            document.getElementById('m-email').innerText = res.email !== "-" ? res.email : "ยังไม่ระบุ";
            document.getElementById('m-address').innerText = res.address !== "-" ? res.address : "ยังไม่ได้ระบุที่อยู่";
            document.getElementById('m-privilege').innerText = res.specialPrivilege || "สิทธิ์มาตรฐาน";
          } else {
            document.getElementById('box-member').style.display = 'none';
            document.getElementById('box-unregistered').style.display = 'block';
          }
        }).catch(() => {
          document.getElementById('box-unregistered').style.display = 'block';
        });
    }

    function registerMember() {
      const btn = document.getElementById('btn-reg');
      btn.innerText = "กำลังสมัคร...";
      fetch(`${WEB_URL}?action=register_member&userId=${encodeURIComponent(currentUserId)}`)
        .then(r => r.json())
        .then(res => {
          if (res.status === "success") {
            alert("สมัครสมาชิกสำเร็จ! รหัสของคุณคือ " + res.memberCode);
            loadData();
          } else {
            btn.innerText = "📝 สมัครสมาชิกทันที";
            alert("เกิดข้อผิดพลาด กรุณาลองใหม่");
          }
        }).catch(() => {
          btn.innerText = "📝 สมัครสมาชิกทันที";
          alert("เกิดข้อผิดพลาดในการเชื่อมต่อ");
        });
    }
  </script>
</body>
</html>
