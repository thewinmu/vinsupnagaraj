<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบจองคิวพยากรณ์ | วินทร์ทรัพย์นาคราช</title>
  
  <script src="./config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #F8FAFC; color: #0F172A; -webkit-tap-highlight-color: transparent; }
    .emerald-gradient { background: linear-gradient(135deg, #065F46 0%, #047857 100%); }
    .card-luxury { background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 1.25rem; box-shadow: 0 4px 14px -2px rgba(15, 23, 42, 0.04); }
    .slot-avail { background-color: #ECFDF5; border: 1.5px solid #10B981; color: #065F46; }
    .slot-avail:hover { background-color: #D1FAE5; }
    .slot-busy { background-color: #FEF2F2; border: 1.5px solid #F87171; color: #991B1B; opacity: 0.65; cursor: not-allowed; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto">
  <div>
    <!-- Executive Header -->
    <header class="text-center py-5 border border-slate-100 mb-4 bg-white rounded-3xl shadow-sm px-4">
      <div class="inline-flex items-center gap-2 mb-1">
        <span class="w-3.5 h-3.5 rounded-full bg-emerald-600 shadow-sm shadow-emerald-500/50"></span>
        <h1 class="text-base font-extrabold text-slate-900 tracking-tight" id="brand-title">วินทร์ทรัพย์นาคราช</h1>
      </div>
      <p id="user-display" class="text-xs text-slate-500 font-semibold">ระบบพร้อมใช้งาน</p>
    </header>

    <div id="error-box" style="display: none;" class="mb-4 p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs">
      <div class="font-bold flex items-center gap-1">⚠️ ข้อผิดพลาด:</div>
      <div id="error-msg" class="mt-1 font-medium"></div>
    </div>

    <!-- STEP 1: เลือกบริการ (แสดงเฉพาะประเภท "บริการ") -->
    <div id="step-packages" class="space-y-3">
      <div id="loading-spinner" class="text-center py-12">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-600 border-t-transparent"></div>
        <p class="text-xs text-slate-400 font-bold mt-3">กำลังเชื่อมต่อฐานข้อมูลบริการ...</p>
      </div>
    </div>

    <!-- STEP 2: 15 คิวรอบเวลา (09.00 - 20.00 น.) -->
    <div id="step-datetime" style="display: none;" class="space-y-4">
      <button onclick="backToPkgs()" class="text-xs font-bold text-slate-600 mb-1 flex items-center gap-1 hover:text-slate-900">
        ❮ ย้อนกลับไปเลือกบริการอื่น
      </button>

      <!-- การ์ดสรุปแพ็กเกจ -->
      <div class="card-luxury p-4 border border-emerald-100 bg-emerald-50/20">
        <div class="text-[11px] text-slate-400 font-bold">บริการที่เลือก:</div>
        <div class="text-sm font-black text-emerald-950 mt-0.5" id="selected-pkg-txt">-</div>
        <div class="text-xs font-black text-amber-700 mt-1" id="selected-price-txt">-</div>
      </div>

      <!-- เลือกวันที่ (15 วันข้างหน้า) -->
      <div>
        <label class="text-xs font-bold text-slate-700 block mb-1.5">📅 เลือกวันที่ต้องการจอง</label>
        <select id="booking-date" onchange="loadSlots()" class="w-full bg-white border border-slate-200 rounded-2xl p-3.5 text-xs font-bold text-slate-800 shadow-sm focus:ring-2 focus:ring-emerald-600 outline-none"></select>
      </div>

      <!-- รายการ 15 คิว -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs font-bold text-slate-700">⏰ เลือกรอบเวลา (09.00 - 20.00 น.)</label>
          <div class="text-[10px] font-bold flex gap-2">
            <span class="text-emerald-700 font-extrabold">🟢 ว่าง</span>
            <span class="text-rose-700 font-extrabold">🔴 เต็ม</span>
          </div>
        </div>
        <div id="slots-container" class="grid grid-cols-2 gap-2.5 max-h-72 overflow-y-auto p-1"></div>
      </div>
    </div>
  </div>

  <div id="action-box" style="display: none;" class="mt-6">
    <button id="sub-btn" onclick="submitBooking()" class="w-full emerald-gradient text-white font-extrabold py-4 rounded-2xl text-xs shadow-lg shadow-emerald-800/20 active:scale-95 transition">
      ยืนยันการจองและออกบิลชำระเงิน
    </button>
  </div>

  <script>
    const DEFAULT_CONFIG = {
      WEB_URL: "https://script.google.com/macros/s/AKfycbw9RJdnqieYUY6QombS0Zmkkim0C8zecq71k0p7kMvwRPzy_Y5NMr8D54WHjd2qUCodEA/exec",
      LIFF_ID: "2007499712-B0uid9G3",
      BRAND_NAME: "วินทร์ทรัพย์นาคราช"
    };

    const WEB_URL = (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.WEB_URL) ? APP_CONFIG.WEB_URL : DEFAULT_CONFIG.WEB_URL;
    const LIFF_ID = (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.LIFF && APP_CONFIG.LIFF.BOOKING) ? APP_CONFIG.LIFF.BOOKING : DEFAULT_CONFIG.LIFF_ID;

    let userId = "U_WEB_GUEST";
    let userName = "คุณลูกค้า";
    let bookingData = { packageId: "", packageName: "", price: 0, bookingDate: "", bookingTime: "" };

    window.addEventListener('DOMContentLoaded', () => {
      initDateSelector();
      
      const params = new URLSearchParams(window.location.search);
      const pkgId = params.get('id');
      const pkgName = params.get('pkg');
      const pkgPrice = params.get('price');

      if (pkgName && pkgPrice) {
        selectPackage(pkgId || "", pkgName, Number(pkgPrice));
      } else {
        loadPackages();
      }

      initLiff();
    });

    async function initLiff() {
      try {
        if (typeof liff !== 'undefined' && LIFF_ID) {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            userId = profile.userId;
            userName = profile.displayName;
            document.getElementById('user-display').innerText = "ลูกค้า: " + userName;
          }
        }
      } catch (err) {
        console.warn("LINE LIFF Warning:", err);
      }
    }

    function initDateSelector() {
      const sel = document.getElementById('booking-date');
      if (!sel) return;
      sel.innerHTML = "";
      const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
      const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

      for (let i = 0; i < 15; i++) {
        let d = new Date();
        d.setDate(d.getDate() + i);
        let val = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        let opt = document.createElement('option');
        opt.value = val;
        opt.innerText = `วัน${days[d.getDay()]}ที่ ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear() + 543}`;
        sel.appendChild(opt);
      }
    }

    function loadPackages() {
      const container = document.getElementById('step-packages');
      const errBox = document.getElementById('error-box');
      const errMsg = document.getElementById('error-msg');
      
      fetch(WEB_URL + "?action=get_packages", {
        method: "GET",
        mode: "cors",
        redirect: "follow"
      })
      .then(response => {
        if (!response.ok) throw new Error("HTTP Error " + response.status);
        return response.json();
      })
      .then(res => {
        if (res.status === "success" && Array.isArray(res.packages)) {
          if (errBox) errBox.style.display = 'none';
          container.innerHTML = "";
          const servicePackages = res.packages.filter(p => !p.type || p.type === "บริการ");

          if (servicePackages.length === 0) {
            container.innerHTML = '<div class="text-center text-xs text-slate-400 py-10 font-bold">ไม่พบรายการบริการในระบบ</div>';
            return;
          }

          servicePackages.forEach(p => {
            let div = document.createElement('div');
            div.className = "card-luxury p-4 cursor-pointer hover:border-emerald-600 transition mb-3 bg-white border border-slate-200 rounded-2xl shadow-sm";
            div.onclick = () => selectPackage(p.id, p.name, p.price);
            div.innerHTML = `
              <div class="flex justify-between items-center font-bold text-xs">
                <div>
                  <div class="text-slate-900 font-extrabold text-sm">${p.name}</div>
                  <div class="text-[10px] text-slate-400 font-normal">รหัส: ${p.id}</div>
                </div>
                <div class="text-emerald-700 font-black text-sm">${Number(p.price).toLocaleString()} ฿</div>
              </div>
            `;
            container.appendChild(div);
          });
        } else {
          throw new Error(res.message || "ข้อมูลไม่ถูกต้อง");
        }
      })
      .catch(err => {
        if (errBox) errBox.style.display = 'block';
        if (errMsg) errMsg.innerText = "เชื่อมต่อฐานข้อมูลไม่สำเร็จ: " + err.message;
        container.innerHTML = `
          <div class="text-center p-4">
            <button onclick="loadPackages()" class="bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl active:scale-95 transition">
              🔄 ลองเชื่อมต่อใหม่อีกครั้ง
            </button>
          </div>
        `;
      });
    }

    function selectPackage(id, name, price) {
      bookingData.packageId = id;
      bookingData.packageName = name;
      bookingData.price = price;

      document.getElementById('step-packages').style.display = 'none';
      document.getElementById('step-datetime').style.display = 'block';
      document.getElementById('selected-pkg-txt').innerText = name;
      document.getElementById('selected-price-txt').innerText = `ค่าบูชาครู: ${price.toLocaleString()} บาท`;

      loadSlots();
    }

    function loadSlots() {
      const date = document.getElementById('booking-date').value;
      const c = document.getElementById('slots-container');
      c.innerHTML = '<div class="text-center text-xs text-slate-400 py-6 col-span-2 font-bold">กำลังเช็ครอบเวลา...</div>';

      fetch(WEB_URL + "?action=check_slots&date=" + date, {
        method: "GET",
        mode: "cors",
        redirect: "follow"
      })
      .then(r => r.json())
      .then(res => {
        c.innerHTML = "";
        (res.slots || []).forEach(s => {
          let btn = document.createElement('button');
          if (s.available) {
            btn.className = "slot-avail p-3 rounded-2xl text-xs font-bold transition active:scale-95 text-center flex flex-col justify-center items-center shadow-sm";
            btn.innerHTML = `
              <div class="text-[10px] text-emerald-800 font-extrabold mb-0.5">คิวที่ ${s.queue}</div>
              <div class="text-slate-900 font-bold">${s.time}</div>
              <div class="text-[9px] text-emerald-600 font-extrabold mt-1">🟢 ว่าง</div>
            `;
            btn.onclick = () => {
              bookingData.bookingTime = s.time;
              document.querySelectorAll('#slots-container button').forEach(b => b.classList.remove('ring-2', 'ring-emerald-800'));
              btn.classList.add('ring-2', 'ring-emerald-800');
              document.getElementById('action-box').style.display = 'block';
            };
          } else {
            btn.className = "slot-busy p-3 rounded-2xl text-xs font-bold text-center flex flex-col justify-center items-center";
            btn.innerHTML = `
              <div class="text-[10px] text-rose-800 font-extrabold mb-0.5">คิวที่ ${s.queue}</div>
              <div class="text-slate-500 font-medium">${s.time}</div>
              <div class="text-[9px] text-rose-600 font-extrabold mt-1">🔴 เต็ม</div>
            `;
            btn.disabled = true;
          }
          c.appendChild(btn);
        });
      });
    }

    function backToPkgs() {
      document.getElementById('step-datetime').style.display = 'none';
      document.getElementById('step-packages').style.display = 'block';
      document.getElementById('action-box').style.display = 'none';
    }

    function submitBooking() {
      bookingData.bookingDate = document.getElementById('booking-date').value;
      if (!bookingData.bookingDate || !bookingData.bookingTime) {
        alert("กรุณาเลือกรอบเวลาที่ต้องการจองให้เรียบร้อยครับ");
        return;
      }

      const btn = document.getElementById('sub-btn');
      btn.innerText = "กำลังจองคิว...";
      btn.disabled = true;

      fetch(WEB_URL, {
        method: "post",
        contentType: "application/json",
        body: JSON.stringify({
          action: "create_booking",
          userId: userId,
          customerName: userName,
          ...bookingData
        })
      })
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          alert("🎉 จองคิวสำเร็จ! ระบบส่งบิลสรุปยอดชำระเงินและเลขบัญชีไปที่แชท LINE ของคุณแล้ว (กรุณาโอนภายใน 30 นาที)");
          if (typeof liff !== 'undefined' && liff.isInClient()) {
            liff.closeWindow();
          } else {
            window.location.reload();
          }
        } else {
          alert("❌ ไม่สามารถจองได้: " + (res.message || "รอบเวลานี้ไม่ว่าง"));
          btn.innerText = "ยืนยันการจองและออกบิลชำระเงิน";
          btn.disabled = false;
          loadSlots();
        }
      })
      .catch(err => {
        alert("❌ เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง");
        btn.innerText = "ยืนยันการจองและออกบิลชำระเงิน";
        btn.disabled = false;
      });
    }
  </script>
</body>
</html>
