<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>บัตรแก้วรัตนบารมี - SHOP@วินทร์ทรัพย์นาคราช</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'] },
          colors: {
            pearl: '#F2F7F4',
            emeraldDeep: '#0B4734',
            emeraldDark: '#083828',
            nagaGold: '#D97706',
            goldBright: '#FBBF24',
            goldBorder: '#E6CA65',
            obsidian: '#121714'
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at top, #FBFDFB 0%, #EBF4F0 100%);
      color: #121714;
    }
    .glass-pearl {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(230, 202, 101, 0.45);
    }
    .gold-shimmer {
      background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 50%, #FDE68A 100%);
    }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-center items-center">

  <div class="w-full max-w-sm space-y-4">
    <!-- Luxury Naga Member Card (16:9 Glassmorphism Card) -->
    <div class="relative overflow-hidden rounded-[28px] p-5 bg-gradient-to-br from-[#FBFDFB] via-[#E2F1EA] to-[#F5F8F6] border-2 border-goldBorder shadow-xl">
      <!-- Glow Aura -->
      <div class="absolute -top-10 -right-10 w-40 h-40 rounded-full bg-goldBright/30 blur-2xl pointer-events-none"></div>

      <!-- Card Top -->
      <div class="relative z-10 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-obsidian to-emeraldDark p-0.5 border border-goldBorder flex items-center justify-center shadow-md">
            <span class="text-xl">🐍</span>
          </div>
          <div>
            <h2 class="text-[10px] font-black tracking-wider text-nagaGold uppercase leading-none">
              SHOP@วินทร์ทรัพย์นาคราช
            </h2>
            <p class="text-xs font-black text-obsidian mt-0.5">บัตรแก้วรัตนบารมี</p>
          </div>
        </div>
        <span class="px-2.5 py-0.5 rounded-full text-[9px] font-black text-emeraldDeep bg-goldBright/30 border border-goldBorder shadow-sm">
          VIP นาคา
        </span>
      </div>

      <!-- Card Mid (User Info) -->
      <div class="relative z-10 mt-5 space-y-1">
        <span class="text-[10px] font-bold text-stone-500 uppercase tracking-wider block">ผู้ถือครองบัญชีมงคล</span>
        <p id="card-holder-name" class="text-base font-black text-obsidian tracking-tight">ผู้ศรัทธาบารมี</p>
        <p id="card-member-code" class="text-xs font-mono font-black text-nagaGold tracking-widest">NAGA-••••••</p>
      </div>

      <!-- Card Bottom -->
      <div class="relative z-10 mt-4 pt-3 border-t border-goldBorder/40 flex justify-between items-end">
        <div>
          <span class="text-[9px] font-bold text-stone-500 block">วรรณะบารมี</span>
          <span id="card-privilege" class="text-xs font-black text-emeraldDeep">วรรณะนาคารัตนบารมี</span>
        </div>
        <div>
          <span class="text-[9px] font-bold text-stone-500 block text-right">ทรัพย์มณีคงคลัง</span>
          <span id="card-balance" class="text-xs font-black text-nagaGold text-right block">฿0 มณี</span>
        </div>
      </div>
    </div>

    <!-- Registration / Edit Form -->
    <div class="glass-pearl rounded-[28px] p-5 shadow-sm border border-goldBorder/40 space-y-3">
      <h3 class="text-xs font-black text-obsidian uppercase flex items-center gap-1.5">
        <span>✍️</span> จารึกข้อมูลผู้ถือครองบัญชี
      </h3>

      <div>
        <label class="text-[11px] font-bold text-stone-600 block mb-1">ชื่อ - นามสกุล *</label>
        <input type="text" id="member-name" placeholder="ระบุชื่อ-นามสกุลจริง" class="w-full text-xs font-medium px-3.5 py-2.5 rounded-2xl border border-stone-300 focus:outline-none focus:border-goldBright bg-white">
      </div>

      <div>
        <label class="text-[11px] font-bold text-stone-600 block mb-1">เบอร์โทรศัพท์ติดต่อ *</label>
        <input type="tel" id="member-phone" placeholder="08xxxxxxxx" class="w-full text-xs font-medium px-3.5 py-2.5 rounded-2xl border border-stone-300 focus:outline-none focus:border-goldBright bg-white">
      </div>

      <div>
        <label class="text-[11px] font-bold text-stone-600 block mb-1">ที่อยู่จัดส่งวัตถุมงคล / สาส์นนำทาง</label>
        <textarea id="member-address" rows="2" placeholder="ระบุที่อยู่จัดส่งโดยละเอียด" class="w-full text-xs font-medium px-3.5 py-2.5 rounded-2xl border border-stone-300 focus:outline-none focus:border-goldBright bg-white"></textarea>
      </div>

      <button id="btn-submit-member" onclick="saveMemberProfile()" class="w-full bg-gradient-to-r from-obsidian via-emeraldDark to-emeraldDeep text-white font-black text-xs py-3.5 rounded-2xl shadow-md border border-goldBright hover:brightness-110 active:scale-95 transition flex items-center justify-center space-x-1.5">
        <span>✨ บันทึกและผูกจิตข้อมูลสมาชิก</span>
      </button>

      <a href="index.html" class="block text-center text-xs font-bold text-stone-500 hover:text-obsidian pt-1">
        ← กลับสู่หน้าร้านวัตถุมงคล
      </a>
    </div>
  </div>

  <script>
    const LIFF_ID = "2007499712-3e6TMnJJ";
    const API_URL = "https://script.google.com/macros/s/AKfycbzhqzmw9LkSheJD2AQTreWQY2w1Wqh0okxRMXhRelayFqHetwQCPmc877YJCPnd6P6w/exec";

    let currentUserId = "";

    window.addEventListener("DOMContentLoaded", async () => {
      try {
        if (typeof liff !== "undefined") {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            currentUserId = profile.userId;
            loadMemberData(currentUserId);
          } else {
            liff.login();
          }
        }
      } catch (err) {}
    });

    async function loadMemberData(uid) {
      try {
        const res = await fetch(`${API_URL}?action=get_member_profile&userId=${encodeURIComponent(uid)}`);
        const data = await res.json();
        if (data.status === "success" && data.member) {
          const m = data.member;
          document.getElementById("card-holder-name").innerText = m.name !== "-" ? m.name : "ผู้ศรัทธาบารมี";
          document.getElementById("card-member-code").innerText = m.memberCode;
          document.getElementById("card-privilege").innerText = m.privilege || "วรรณะนาคารัตนบารมี";
          document.getElementById("card-balance").innerText = `฿${Number(m.balance || 0).toLocaleString()} มณี`;

          document.getElementById("member-name").value = m.name !== "-" ? m.name : "";
          document.getElementById("member-phone").value = m.phone !== "-" ? m.phone : "";
          document.getElementById("member-address").value = m.address !== "-" ? m.address : "";
          document.getElementById("btn-submit-member").innerText = "✨ อัปเดตข้อมูลบัตรสมาชิก";
        }
      } catch (e) {}
    }

    async function saveMemberProfile() {
      const name = document.getElementById("member-name").value.trim();
      const phone = document.getElementById("member-phone").value.trim();
      const address = document.getElementById("member-address").value.trim();

      if (!name || !phone) {
        alert("กรุณาระบุชื่อ-นามสกุล และเบอร์โทรศัพท์ครับ");
        return;
      }

      if (!currentUserId) {
        alert("กรุณาเปิดผ่านแอป LINE เพื่อดึงรหัส User ID ครับ");
        return;
      }

      const btn = document.getElementById("btn-submit-member");
      btn.disabled = true;
      btn.innerText = "กำลังจารึกข้อมูลมงคล...";

      const payload = {
        action: "register_member",
        userId: currentUserId,
        name: name,
        phone: phone,
        address: address,
        email: "-"
      };

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === "success") {
          setTimeout(() => {
            if (typeof liff !== "undefined" && liff.isInClient()) {
              liff.closeWindow();
            } else {
              alert("✅ บันทึกข้อมูลสำเร็จ! ระบบได้ส่งบัตรแก้วรัตนบารมีเข้าแชท LINE เรียบร้อยแล้วครับ");
              loadMemberData(currentUserId);
              btn.disabled = false;
            }
          }, 300);
        } else {
          alert("แจ้งเตือน: " + (result.message || "บันทึกไม่สำเร็จ"));
          btn.disabled = false;
        }
      } catch (err) {
        alert("สายสัญญาณขัดข้อง กรุณาลองใหม่อีกครั้ง");
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
