<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shop@วินทรัพย์นาคราช • วัตถุมงคล & สินค้าของแท้</title>
  
  <script src="./config.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: radial-gradient(circle at 50% 0%, #064e3b 0%, #022018 45%, #010d0a 100%);
      color: #0f172a;
      min-height: 100vh;
      margin: 0;
    }

    /* สไตล์การ์ดสินค้าตามภาพที่ 2 (สีขาวนวล ขอบทอง)[cite: 10] */
    .lux-product-card {
      background: #fafaf5;
      border: 1.5px solid #eab308;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      transition: all 0.25s ease;
      display: flex;
      flex-col;
      justify-content: space-between;
      overflow: hidden;
      padding: 12px;
    }
    .lux-product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(234, 179, 8, 0.3);
    }

    .btn-add-cart {
      background: #14532d;
      color: #ffffff;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      transition: all 0.2s ease;
    }
    .btn-add-cart:hover {
      background: #166534;
      color: #fef08a;
    }

    .search-input {
      background: #ffffff;
      border-radius: 9999px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body class="p-3 sm:p-5 max-w-md mx-auto flex flex-col pb-28">

  <!-- แถบด้านบน: โลโก้ + Search Bar ตามสไตล์ภาพที่ 2[cite: 10] -->
  <div class="search-input flex items-center justify-between p-2 mb-4">
    <div class="flex items-center gap-2 pl-2">
      <div class="w-7 h-7 rounded-full overflow-hidden flex items-center justify-center">
        <img src="./logo.png" alt="โลโก้" class="w-full h-full object-contain">
      </div>
      <span class="text-xs font-bold text-emerald-950 tracking-wider">Shop@วินทรัพย์นาคราช</span>
    </div>
    <div class="flex items-center gap-2 pr-2">
      <span class="text-slate-400 text-sm">🔍</span>
      <a href="./memberships.html" class="text-emerald-900 text-base font-bold">☰</a>
    </div>
  </div>

  <!-- แถบหมวดหมู่สินค้า -->
  <div id="category-bar" class="flex items-center gap-2 mb-4 overflow-x-auto pb-1 no-scrollbar text-xs">
    <button onclick="filterCategory('all')" id="tab-all" class="px-4 py-1.5 rounded-full bg-amber-400 text-black font-bold whitespace-nowrap shadow">
      ทั้งหมด
    </button>
  </div>

  <!-- ตารางแสดงสินค้าแบบการ์ด 2 คอลัมน์ตามภาพที่ 2[cite: 10] -->
  <div id="product-container" class="grid grid-cols-2 gap-3.5">
    <div class="col-span-full py-12 text-center text-xs text-amber-200 animate-pulse">
      กำลังดึงรายการสินค้าจากระบบ...
    </div>
  </div>

  <script>
    const WEB_URL = typeof getMasterApiUrl === "function" ? getMasterApiUrl() : "https://script.google.com/macros/s/AKfycbwBK-NcHXTiaoVhJyBxB3fMVGFj9x8lSjvU1ECL6pzmjjIWLFqgN-94ny9niIjtow9B/exec";
    const MYSHOP_LIFF = "https://liff.line.me/1572442362-jGxDDGRp/@thewinmu";

    let products = [];
    let currentCategory = "all";

    window.onload = function() {
      fetch(`${WEB_URL}?action=get_shop_products`)
        .then(r => r.json())
        .then(res => {
          if (res.status === "success" && res.products) {
            products = res.products;
            buildCategoryTabs();
            renderProductGrid();
          } else {
            document.getElementById("product-container").innerHTML = `<div class="col-span-full py-10 text-center text-xs text-slate-300">ไม่มีรายการสินค้าที่พร้อมจำหน่ายในขณะนี้</div>`;
          }
        })
        .catch(() => {
          document.getElementById("product-container").innerHTML = `<div class="col-span-full py-10 text-center text-xs text-slate-300">การเชื่อมต่อขัดข้อง</div>`;
        });
    };

    function buildCategoryTabs() {
      const bar = document.getElementById("category-bar");
      const cats = Array.from(new Set(products.map(p => p.category))).filter(Boolean);
      cats.forEach(c => {
        const btn = document.createElement("button");
        btn.id = `tab-${c}`;
        btn.className = "px-4 py-1.5 rounded-full bg-emerald-950/80 border border-amber-300/30 text-white whitespace-nowrap";
        btn.innerText = c;
        btn.onclick = () => filterCategory(c);
        bar.appendChild(btn);
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll("#category-bar button").forEach(b => {
        b.className = "px-4 py-1.5 rounded-full bg-emerald-950/80 border border-amber-300/30 text-white whitespace-nowrap";
      });
      const activeBtn = document.getElementById(`tab-${cat}`);
      if (activeBtn) activeBtn.className = "px-4 py-1.5 rounded-full bg-amber-400 text-black font-bold whitespace-nowrap shadow";
      renderProductGrid();
    }

    function renderProductGrid() {
      const container = document.getElementById("product-container");
      container.innerHTML = "";

      const filtered = products.filter(p => {
        if (currentCategory === "all") return true;
        return p.category === currentCategory;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full py-10 text-center text-xs text-slate-300">ไม่มีสินค้าในหมวดนี้</div>`;
        return;
      }

      filtered.forEach(p => {
        const card = document.createElement("div");
        card.className = "lux-product-card flex flex-col justify-between";

        const imgUrl = (p.imageId && p.imageId.length > 5)
          ? `https://drive.google.com/uc?id=${p.imageId}`
          : "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=300&q=80";

        const originalPriceHtml = p.originalPrice 
          ? `<span class="text-[10px] text-slate-400 line-through">฿${Number(p.originalPrice).toLocaleString()}</span>` 
          : '';

        // โครงสร้างการ์ดตรงตามรูปภาพที่ 2 (มีรหัสสินค้าไอคอนตะกร้าบนขวา)[cite: 10]
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-xs font-extrabold text-slate-800 font-mono">${p.id || 'A001'}</span>
              <span class="text-amber-500 text-xs">🛒</span>
            </div>
            
            <div class="w-full h-32 bg-white rounded-xl overflow-hidden mb-2.5 flex items-center justify-center p-1 border border-slate-100">
              <img src="${imgUrl}" alt="${p.name}" class="w-full h-full object-contain">
            </div>

            <h3 class="text-xs font-bold text-slate-800 leading-snug line-clamp-1 mb-0.5">${p.name}</h3>
            <p class="text-[10px] text-slate-500 font-light line-clamp-1 mb-1">${p.description || '-'}</p>
          </div>

          <div class="pt-2 border-t border-slate-200/60 flex items-center justify-between mt-2">
            <div>
              ${originalPriceHtml}
              <div class="text-xs font-extrabold text-emerald-900">฿${Number(p.price).toLocaleString()}</div>
            </div>
            <a href="${MYSHOP_LIFF}" target="_blank" class="btn-add-cart">
              Add to Cart
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
