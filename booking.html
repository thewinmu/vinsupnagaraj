<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จองคิวดูดวง | วินทร์ทรัพย์นาคราช</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Prompt', sans-serif; background-color: #020617; } </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col p-4 max-w-md mx-auto justify-between">
  <div>
    <header class="text-center py-5 border-b border-amber-500/20 mb-4">
      <p class="text-[10px] tracking-[0.2em] text-amber-500 uppercase font-bold">THE WIN MU</p>
      <h1 class="text-xl font-bold text-amber-400 mt-1">จองคิวพยากรณ์</h1>
      <div id="member-badge" class="mt-2 inline-block bg-slate-900 border border-amber-500/40 px-4 py-1 rounded-full text-xs text-amber-300">กำลังตรวจสอบสมาชิก...</div>
    </header>

    <!-- รายการแพ็กเกจ -->
    <div id="step-packages" class="space-y-3">
      <div class="text-center text-xs text-slate-400 py-6">กำลังโหลดแพ็กเกจ...</div>
    </div>

    <!-- เลือกรอบวันเวลาและเช็กสถานะคิวว่าง 15 วัน -->
    <div id="step-datetime" style="display: none;" class="space-y-4">
      <button onclick="backToPackages()" class="text-amber-400 text-xs">❮ กลับไปเลือกแพ็กเกจ</button>
      <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3">
        <p id="selected-pkg-name" class="text-sm font-bold text-amber-300"></p>
      </div>
      <div>
        <label class="text-xs text-slate-400 block mb-2">เลือกวันที่ (ภายใน 15 วันนี้)</label>
        <input type="date" id="booking-date" onchange="checkSlots()" class="w-full bg-slate-900 border border-amber-500/40 rounded-xl p-3 text-sm text-slate-100 focus:outline-none">
      </div>
      <div>
        <label class="text-xs text-slate-400 block mb-2">สถานะรอบเวลา (🟩 ว่าง | 🟥 เต็ม)</label>
        <div id="slots-container" class="grid grid-cols-2 gap-2">
          <p class="text-xs text-slate-500 col-span-2">กรุณาเลือกวันที่ก่อนครับ</p>
        </div>
      </div>
    </div>
  </div>

  <div id="action-box" style="display: none;" class="mt-6">
    <button onclick="submitBooking()" class="w-full bg-gradient-to-r from-amber-500 to-amber-700 text-slate-950 font-bold py-3.5 rounded-xl text-sm shadow">ยืนยันการจอง & รับใบกำกับภาษี</button>
  </div>

  <script>
    const WEB_APP_URL = "วาง_WEB_APP_URL_ของคุณตรงนี้";
    let currentUserId = "U8065e05dc54f0ddc3fb46e97492eb53a";
    let memberInfo = { memberCode: "M0000", name: "สมาชิก" };
    let bookingData = { packageName: "", price: 0, bookingDate: "", bookingTime: "" };

    window.onload = async function() {
      try {
        await liff.init({ liffId: "2007499712-O7LXXVaY" });
        if (liff.isLoggedIn()) currentUserId = (await liff.getProfile()).userId;
      } catch (e) {}
      fetchMemberData();
      fetchPackages();
      setMinMaxDate();
    };

    function setMinMaxDate() {
      const today = new Date().toISOString().split('T')[0];
      const maxDate = new Date();
      maxDate.setDate(maxDate.getDate() + 15);
      const maxStr = maxDate.toISOString().split('T')[0];
      const dateInput = document.getElementById('booking-date');
      dateInput.min = today;
      dateInput.max = maxStr;
    }

    function fetchMemberData() {
      fetch(WEB_APP_URL + "?action=get_member&userId=" + currentUserId)
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            memberInfo = data.member;
            document.getElementById('member-badge').innerText = "👤 " + memberInfo.name + " (" + memberInfo.memberCode + ")";
          }
        });
    }

    function fetchPackages() {
      fetch(WEB_APP_URL + "?action=get_packages")
        .then(res => res.json())
        .then(data => {
          if (data.status === "success" && data.packages) {
            const container = document.getElementById('step-packages');
            container.innerHTML = "";
            data.packages.forEach(pkg => {
              const card = document.createElement('div');
              card.className = "bg-slate-900 border border-amber-500/30 rounded-2xl p-4 cursor-pointer hover:border-amber-400 transition shadow";
              card.onclick = () => selectPackage(pkg.name, pkg.price);
              card.innerHTML = `
                <h3 class="font-bold text-base text-slate-100">${pkg.name}</h3>
                <p class="text-xs text-slate-400 mt-1">${pkg.description}</p>
                <p class="text-amber-400 font-bold text-sm mt-2">${pkg.price} บาท</p>
              `;
              container.appendChild(card);
            });
          }
        });
    }

    function selectPackage(name, price) {
      bookingData.packageName = name;
      bookingData.price = price;
      document.getElementById('step-packages').style.display = 'none';
      document.getElementById('step-datetime').style.display = 'block';
      document.getElementById('selected-pkg-name').innerText = "📦 " + name + " (" + price + " ฿)";
    }

    function checkSlots() {
      const date = document.getElementById('booking-date').value;
      if (!date) return;
      fetch(WEB_APP_URL + "?action=check_slots&date=" + date)
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById('slots-container');
          container.innerHTML = "";
          data.slots.forEach(slot => {
            const btn = document.createElement('button');
            if (slot.available) {
              btn.className = "bg-emerald-950 border border-emerald-500/50 p-2.5 rounded-xl text-xs text-emerald-300 font-medium";
              btn.innerText = "🟩 " + slot.time + " (ว่าง)";
              btn.onclick = () => selectTime(slot.time, btn);
            } else {
              btn.className = "bg-red-950 border border-red-500/50 p-2.5 rounded-xl text-xs text-red-400 opacity-60 cursor-not-allowed";
              btn.innerText = "🟥 " + slot.time + " (เต็ม)";
              btn.disabled = true;
            }
            container.appendChild(btn);
          });
        });
    }

    function selectTime(timeStr, btnEl) {
      bookingData.bookingTime = timeStr;
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('ring-2', 'ring-amber-400'));
      btnEl.classList.add('ring-2', 'ring-amber-400');
      document.getElementById('action-box').style.display = 'block';
    }

    function backToPackages() {
      document.getElementById('step-datetime').style.display = 'none';
      document.getElementById('step-packages').style.display = 'block';
      document.getElementById('action-box').style.display = 'none';
    }

    function submitBooking() {
      bookingData.bookingDate = document.getElementById('booking-date').value;
      const payload = { action: "create_booking", userId: currentUserId, memberCode: memberInfo.memberCode, customerName: memberInfo.name, ...bookingData };

      fetch(WEB_APP_URL, { method: "post", contentType: "application/json", body: JSON.stringify(payload) })
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            alert("✅ จองคิวสำเร็จ! ระบบส่งใบกำกับภาษีแบบย่อให้ทางแชท LINE แล้ว");
            window.location.reload();
          } else { alert("❌ เกิดข้อผิดพลาด: " + data.message); }
        });
    }
  </script>
</body>
</html>
