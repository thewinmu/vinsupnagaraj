<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>วินทร์ทรัพย์นาคราช - หน้าร้านสายมู & พยากรณ์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  
  <!-- Header Navbar -->
  <header class="bg-blue-950 border-b border-blue-900 p-4 text-center sticky top-0 z-50 shadow-md">
    <h1 class="text-xl font-bold text-amber-400">✨ วินทร์ทรัพย์นาคราช ✨</h1>
    <p id="user-welcome" class="text-xs text-blue-200 mt-1">กำลังเชื่อมต่อระบบสมาชิก LINE...</p>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto p-4 pb-20">
    
    <!-- Tab Navigation -->
    <div class="flex bg-slate-800 rounded-xl p-1 mb-4 border border-slate-700">
      <button onclick="switchTab('shop')" id="btn-shop" class="flex-1 py-2 text-xs font-bold rounded-lg bg-blue-950 text-amber-400 transition">🛒 ร้านค้ามงคล</button>
      <button onclick="switchTab('wallpapers')" id="btn-wallpapers" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 transition">📱 วอลเปเปอร์</button>
      <button onclick="switchTab('profile')" id="btn-profile" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 transition">👤 สมาชิก</button>
    </div>

    <!-- TAB 1: Shop & Services -->
    <div id="tab-shop" class="space-y-3">
      <div class="bg-gradient-to-r from-amber-600 to-amber-800 p-4 rounded-xl shadow-lg text-white">
        <h2 class="font-bold text-sm">🔥 โปรโมชันฉลองเปิดตัว</h2>
        <p class="text-xs mt-1 text-amber-100">ลดราคาพิเศษสำหรับสินค้าและพิธีกรรมมงคล ด่วน! มีจำนวนจำกัด</p>
      </div>
      <div id="product-list" class="grid grid-cols-1 gap-3">
        <!-- รายการสินค้าจะถูกโหลดผ่าน JavaScript อัตโนมัติ -->
        <div class="text-center py-10 text-slate-400 text-xs">กำลังโหลดรายการสินค้า...</div>
      </div>
    </div>

    <!-- TAB 2: Wallpapers -->
    <div id="tab-wallpapers" class="hidden space-y-3">
      <div class="bg-purple-950 border border-purple-800 p-4 rounded-xl text-center">
        <h2 class="font-bold text-sm text-purple-200">✨ วอลเปเปอร์เสริมดวงพญานาคราช</h2>
        <p class="text-xs text-purple-300 mt-1">รับฟรี! สำหรับสมาชิก หรือเลือกบูชาแบบพรีเมียม</p>
        <button onclick="claimFreeWallpaper()" class="mt-3 bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold px-4 py-2 rounded-lg shadow">🎁 กดรับวอลเปเปอร์ฟรีเข้า LINE</button>
      </div>
      <div id="wallpaper-list" class="grid grid-cols-2 gap-3">
        <!-- รายการวอลเปเปอร์ -->
      </div>
    </div>

    <!-- TAB 3: Member Profile -->
    <div id="tab-profile" class="hidden space-y-3">
      <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl space-y-2">
        <h2 class="text-sm font-bold text-amber-400 border-b border-slate-700 pb-2">💳 ข้อมูลสมาชิก</h2>
        <div id="member-info" class="text-xs space-y-1 text-slate-300">
          <p>กำลังโหลดข้อมูลสมาชิก...</p>
        </div>
        <button onclick="openUpdateChat()" class="w-full mt-2 bg-blue-900 hover:bg-blue-800 text-white text-xs font-bold py-2 rounded-lg">⚙️ อัปเดตข้อมูล / เติมเงิน</button>
      </div>
    </div>

  </main>

  <!-- Script Logic -->
  <script>
    let currentUser = null;
    let cachedData = null;

    window.onload = async function() {
      // เริ่มต้นเชื่อมต่อ LIFF (ใส่ LIFF ID ของคุณ หรือจำลอง UserID สำหรับทดสอบ)
      try {
        await liff.init({ liffId: "YOUR_LIFF_ID" }); // เปลี่ยนเป็น LIFF ID ของคุณ
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        loadAppData(profile.userId);
      } catch (err) {
        console.warn("รันในโหมดทดสอบเบราว์เซอร์ภายนอก");
        loadAppData("U8065e05dc54f0ddc3fb46e97492eb53a"); // ใช้ UserID จำลองจากชีตเดิมของคุณ
      }
    };

    function loadAppData(userId) {
      // เรียกข้อมูลจาก Google Apps Script Web App
      const webAppUrl = "YOUR_GAS_WEB_APP_URL"; // แทนที่ด้วย URL ของ Web App หลังจาก Deploy
      if (!webAppUrl.startsWith("https")) {
        document.getElementById('user-welcome').innerText = "⚠️ กรุณาใส่ Web App URL ในโค้ด index.html";
        return;
      }

      fetch(webAppUrl + "?action=api_init&userId=" + userId)
        .then(res => res.json())
        .then(data => {
          cachedData = data;
          currentUser = data.member;
          renderUI();
        })
        .catch(err => console.error(err));
    }

    function renderUI() {
      if (currentUser) {
        document.getElementById('user-welcome').innerText = "ยินดีต้อนรับคุณ " + currentUser.name + " (แต้ม: " + currentUser.balance + " บ.)";
        document.getElementById('member-info').innerHTML = `
          <p><b>รหัสสมาชิก:</b> ${currentUser.memberCode}</p>
          <p><b>ชื่อ-นามสกุล:</b> ${currentUser.name}</p>
          <p><b>เบอร์โทร:</b> ${currentUser.phone}</p>
          <p><b>ยอดเงินคงเหลือ:</b> ${currentUser.balance} บาท</p>
          <p><b>สิทธิ์เปิดไพ่ฟรี:</b> ${currentUser.remainingFree} ครั้ง/เดือน</p>
          <p><b>ที่อยู่:</b> ${currentUser.address}</p>
        `;
      }

      // Render Products
      const prodContainer = document.getElementById('product-list');
      if (cachedData && cachedData.products) {
        prodContainer.innerHTML = cachedData.products.map(p => `
          <div class="bg-slate-800 border border-slate-700 p-3 rounded-xl flex items-center space-x-3">
            <img src="${p.img}" class="w-16 h-16 object-cover rounded-lg bg-slate-700" alt="img">
            <div class="flex-1">
              <h3 class="font-bold text-xs text-white">${p.name}</h3>
              <p class="text-xs text-amber-400 font-bold mt-1">${p.price} บาท ${p.hasCampaign ? '<span class="text-[10px] bg-red-600 text-white px-1 rounded">โปรเปิดตัว</span>' : ''}</p>
            </div>
            <button onclick="buyProduct('${p.id}')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-3 py-2 rounded-lg">สั่งซื้อ</button>
          </div>
        `).join('');
      }
    }

    function switchTab(tab) {
      ['shop', 'wallpapers', 'profile'].forEach(t => {
        document.getElementById('tab-' + t).classList.add('hidden');
        document.getElementById('btn-' + t).className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 transition";
      });
      document.getElementById('tab-' + tab).classList.remove('hidden');
      document.getElementById('btn-' + tab).className = "flex-1 py-2 text-xs font-bold rounded-lg bg-blue-950 text-amber-400 transition shadow";
    }

    function buyProduct(productId) {
      if (!currentUser) return alert("กรุณารอสักครู่ ระบบกำลังโหลดข้อมูลสมาชิก");
      if (confirm("ยืนยันการสั่งซื้อสินค้ารหัส " + productId + " ?")) {
        // ส่งคำสั่งซื้อกลับไปที่ LINE Bot เพื่อออกบิล
        liff.sendMessages([{ type: 'text', text: 'ยืนยันสั่งซื้อ_' + productId }])
          .then(() => { alert("ส่งคำสั่งซื้อไปที่แชท LINE เรียบร้อยแล้ว!"); liff.closeWindow(); })
          .catch(() => { alert("กรุณาส่งข้อความ 'ยืนยันสั่งซื้อ_" + productId + "' ในแชท LINE OA ของร้านครับ"); });
      }
    }

    function claimFreeWallpaper() {
      liff.sendMessages([{ type: 'text', text: 'รับวอลเปเปอร์ฟรี' }])
        .then(() => { alert("ระบบส่งวอลเปเปอร์เข้าแชท LINE ให้แล้วครับ!"); liff.closeWindow(); })
        .catch(() => { alert("กรุณาพิมพ์คำว่า 'รับวอลเปเปอร์ฟรี' ในแชท LINE OA ครับ"); });
    }

    function openUpdateChat() {
      liff.sendMessages([{ type: 'text', text: 'อัปเดตข้อมูล' }])
        .then(() => liff.closeWindow())
        .catch(() => alert("กรุณาพิมพ์ 'อัปเดตข้อมูล' หรือ 'เติมเงิน' ในแชท LINE ครับ"));
    }
  </script>
</body>
</html>
