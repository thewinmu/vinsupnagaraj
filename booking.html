<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>จองคิวดูดวง • วินทร์ทรัพย์นาคราช</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #022c22 0%, #03120e 50%, #000000 100%);
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
    }
    .gold-text {
      background: linear-gradient(135deg, #ffffff 0%, #fef08a 60%, #ca8a04 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .card-emerald-glossy {
      background: linear-gradient(135deg, rgba(6, 78, 59, 0.45) 0%, rgba(2, 44, 34, 0.75) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .slot-disabled {
      background: rgba(153, 27, 27, 0.3) !important; /* พื้นหลังแดงอ่อนๆ */
      border-color: rgba(239, 68, 68, 0.3) !important; /* กรอบสีแดง */
      color: #fca5a5 !important; /* ตัวหนังสือแดงอ่อน */
      cursor: not-allowed;
      text-decoration: line-through;
    }
  </style>
</head>
<body class="p-5 max-w-md mx-auto flex flex-col pb-12">

  <!-- Header -->
  <div class="flex items-center justify-between py-4 mb-2">
    <button onclick="window.location.href='./index.html'" class="text-xs font-semibold text-white px-4 py-2 rounded-full border border-white/20 bg-black/40 hover:bg-emerald-950/60 transition shadow">⟨ กลับหน้าร้าน</button>
    <div class="text-sm text-amber-200 font-bold tracking-wider">🐍 วินทร์ทรัพย์นาคราช</div>
  </div>

  <div class="text-center mb-6">
    <h1 class="text-2xl font-extrabold gold-text tracking-wide">จองคิวดูดวง</h1>
    <p class="text-xs text-slate-400 mt-1">SELECT SERVICE & TIME SLOT</p>
  </div>

  <div class="space-y-4">
    
    <!-- เลือกแพ็กเกจ -->
    <div class="card-emerald-glossy p-5 space-y-3">
      <label class="block text-xs font-bold text-amber-200">📌 เลือกแพ็กเกจบริการ</label>
      <select id="service-select" class="w-full bg-black/50 border border-white/20 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-400">
        <option value="ดูดวง 15 นาที 108 บาท">ดูดวง 15 นาที (108 บาท)</option>
        <option value="ดูดวง 20 นาที 129 บาท">ดูดวง 20 นาที (129 บาท)</option>
        <option value="ดูดวง 45 นาที 365 บาท">ดูดวง 45 นาที (365 บาท)</option>
        <option value="ดูดวง 1ชม 399 บาท">ดูดวง 1 ชม. (399 บาท)</option>
        <option value="ดูดวง unlimite ไม่เกิน 1.30 ชม">ดูดวง Unlimited ไม่เกิน 1.30 ชม.</option>
      </select>
    </div>

    <!-- เลือกวันที่ -->
    <div class="card-emerald-glossy p-5 space-y-3">
      <label class="block text-xs font-bold text-amber-200">📅 เลือกวันที่ต้องการจอง</label>
      <input type="date" id="booking-date" onchange="loadAvailableSlots()" class="w-full bg-black/50 border border-white/20 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-400">
    </div>

    <!-- เลือกรอบเวลา -->
    <div class="card-emerald-glossy p-5 space-y-3">
      <label class="block text-xs font-bold text-amber-200">⏰ เลือกรอบเวลาว่าง</label>
      <div id="slots-container" class="grid grid-cols-2 gap-2">
        <div class="text-xs text-slate-400 col-span-2 text-center py-4">กำลังโหลดรอบเวลาจากระบบ...</div>
      </div>
    </div>

    <!-- ปุ่มยืนยันการจอง -->
    <div class="pt-2">
      <button onclick="confirmBooking()" class="w-full py-4 rounded-2xl flex items-center justify-center gap-2 shadow-xl transition-all duration-200" style="background: linear-gradient(135deg, #fef08a 0%, #ca8a04 100%); color: #022c22; font-weight: 800;">
        <span>✨ ยืนยันการจองคิวทันที</span>
      </button>
    </div>

  </div>

  <script>
    // 📌 อัปเดตลิงก์ WEB_URL เป็นตัวใหม่ล่าสุดแล้ว
    const WEB_URL = "https://script.google.com/macros/s/AKfycbzp9V3l8642jw376HKFzJ0TCskHNuAUBNfLM-eRu-ys1yCEPFAh-W7aBoacH5Yr6FOs/exec";
    const LIFF_ID = "2007499712-B0uid9G3";
    let currentUserId = "guest_user";
    let currentDisplayName = "แขก";
    let selectedSlotTime = "";

    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('booking-date').value = today;
      loadAvailableSlots();

      if (typeof liff !== 'undefined' && LIFF_ID) {
        liff.init({ liffId: LIFF_ID })
          .then(() => {
            if (liff.isLoggedIn()) {
              liff.getProfile().then(p => {
                currentUserId = p.userId;
                currentDisplayName = p.displayName;
              }).catch(() => {});
            }
          })
          .catch(err => console.error("LIFF Init Error:", err));
      }
    });

    // ดึงรอบเวลาจาก API (ส่งวันที่ไปเช็กด้วย)
    function loadAvailableSlots() {
      const rawDate = document.getElementById('booking-date').value;
      if (!rawDate) return;

      // แปลง YYYY-MM-DD เป็น DD/MM/YYYY
      const parts = rawDate.split('-');
      const formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
      
      const container = document.getElementById('slots-container');
      container.innerHTML = `<div class="text-xs text-slate-400 col-span-2 text-center py-4">กำลังโหลดรอบเวลา...</div>`;
      selectedSlotTime = "";

      // เรียก get_time_slots พร้อมส่ง date ไปเช็ก
      fetch(`${WEB_URL}?action=get_time_slots&date=${encodeURIComponent(formattedDate)}`)
        .then(r => r.json())
        .then(res => {
          if (res && res.status === "success" && res.slots) {
            container.innerHTML = "";
            if (res.slots.length === 0) {
                container.innerHTML = `<div class="text-xs text-red-400 col-span-2 text-center py-2">ไม่มีรอบเวลาว่าง</div>`;
                return;
            }
            res.slots.forEach(slot => {
              const btn = document.createElement('button');
              btn.type = "button";
              btn.innerText = slot.time;
              btn.className = "slot-btn p-2.5 rounded-xl text-xs font-semibold transition text-center ";
              
              // เช็กถ้าเต็ม (รวมสถานะ Pending ที่ยังไม่หมดเวลา จะเป็น full)
              if (slot.status === "full" || slot.status === "closed") {
                btn.disabled = true;
                btn.className += " slot-disabled";
                btn.innerText += " (เต็ม)";
              } else {
                btn.className += " bg-black/40 border border-white/20 text-slate-200 hover:border-amber-400";
                btn.onclick = () => selectSlot(btn, slot.time);
              }
              container.appendChild(btn);
            });
          } else {
            container.innerHTML = `<div class="text-xs text-red-400 col-span-2 text-center py-2">ไม่พบข้อมูลรอบเวลา</div>`;
          }
        })
        .catch(err => {
          console.error("Error loading slots:", err);
          container.innerHTML = `<div class="text-xs text-red-400 col-span-2 text-center py-2">เกิดข้อผิดพลาดในการโหลด</div>`;
        });
    }

    function selectSlot(btn, timeStr) {
      if (btn.disabled) return;

      document.querySelectorAll('.slot-btn').forEach(b => {
        if (!b.disabled) {
          b.classList.remove('bg-amber-600', 'border-amber-400', 'text-white');
          b.classList.add('bg-black/40', 'border-white/20', 'text-slate-200');
        }
      });
      
      btn.classList.remove('bg-black/40', 'border-white/20', 'text-slate-200');
      btn.classList.add('bg-amber-600', 'border-amber-400', 'text-white');
      selectedSlotTime = timeStr;
    }

    function confirmBooking() {
      const serviceName = document.getElementById('service-select').value;
      const rawDate = document.getElementById('booking-date').value;

      if (!selectedSlotTime) {
        alert("กรุณาเลือกรอบเวลาก่อนยืนยันการจองครับ");
        return;
      }

      if (!rawDate) {
        alert("กรุณาเลือกวันที่ต้องการจองครับ");
        return;
      }

      // แปลง YYYY-MM-DD เป็น DD/MM/YYYY อีกครั้งเพื่อส่งบันทึก
      const parts = rawDate.split('-');
      const bookingDateFormatted = `${parts[2]}/${parts[1]}/${parts[0]}`;

      if (currentUserId === "guest_user") {
        currentUserId = "admin_test_user_001"; // สำหรับเทสต์บนเบราว์เซอร์
      }

      alert("⏳ กำลังบันทึกการจองคิว...");

      // 📌 ส่งข้อมูลครบถ้วน และรับค่าแบบ JSON เพื่อเช็กสถานะการจองซ้ำ
      fetch(`${WEB_URL}?action=submit_booking&userId=${encodeURIComponent(currentUserId)}&name=${encodeURIComponent(currentDisplayName)}&serviceName=${encodeURIComponent(serviceName)}&bookingDate=${encodeURIComponent(bookingDateFormatted)}&slotTime=${encodeURIComponent(selectedSlotTime)}`)
        .then(r => r.json()) 
        .then(res => {
          if (res && res.status === "error") {
            // 🛑 กรณีโดนคนอื่นตัดหน้าจองไปก่อน (ด่านบล็อกทำงาน)
            alert("❌ " + res.message);
            loadAvailableSlots(); // รีเฟรชรอบเวลาใหม่ทันที
          } else {
            // ✅ จองสำเร็จ
            alert("✨ บันทึกการจองคิวสำเร็จ! ระบบได้ส่งรายละเอียดการชำระเงินไปยังแชท LINE ของท่านแล้ว");
            if (typeof liff !== 'undefined' && liff.isInClient()) {
              liff.closeWindow();
            } else {
              window.location.href = './memberships.html';
            }
          }
        })
        .catch(err => {
          console.error("Booking Error:", err);
          alert("❌ เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง");
        });
    }
  </script>
</body>
</html>
